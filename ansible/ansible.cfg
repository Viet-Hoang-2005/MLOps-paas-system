[defaults]
inventory = ./inventory/terraform.py
remote_user = ubuntu
private_key_file = ~/.ssh/aws_key
host_key_checking = True
forks = 10
timeout = 30
retry_files_enabled = False
stdout_callback = default
roles_path = ./roles
local_tmp = /tmp/ansible-local

[callback_default]
result_format = yaml

[ssh_connection]
pipelining = True
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s

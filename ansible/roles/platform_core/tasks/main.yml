---
- name: Wait for every static worker to be Ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
    name: "{{ hostvars[item].k3s_node_name | default(item) }}"
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
    wait: true
    wait_timeout: 300
    wait_condition:
      type: Ready
      status: "True"
  loop: "{{ groups['workers'] }}"

- name: Install Argo CD without exposing its initial admin password
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo-cd
    chart_repo_url: https://argoproj.github.io/argo-helm
    chart_version: "{{ argocd_chart_version }}"
    release_namespace: argocd
    create_namespace: true
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
    wait: true
    timeout: 15m0s
    release_values: "{{ lookup('ansible.builtin.file', playbook_dir + '/../k8s/argocd/values.yaml') | from_yaml }}"

- name: Wait for the Argo CD Application CRD
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: applications.argoproj.io
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
    wait: true
    wait_timeout: 180
    wait_condition:
      type: Established
      status: "True"

- name: Bootstrap the public root GitOps application
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
    definition: "{{ lookup('ansible.builtin.file', playbook_dir + '/../k8s/argocd/application.yaml') | from_yaml }}"

- name: Wait for Argo CD to reconcile every core addon and cluster Application
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "{{ item }}"
    namespace: argocd
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
  register: reconciled_core_application
  until:
    - reconciled_core_application.resources | length == 1
    - reconciled_core_application.resources[0].status.sync.status | default('') == 'Synced'
    - reconciled_core_application.resources[0].status.health.status | default('') == 'Healthy'
  retries: 90
  delay: 10
  changed_when: false
  loop: "{{ core_addon_application_names + core_cluster_application_names }}"

- name: Wait for the root GitOps application to synchronize
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: mlops-paas-system
    namespace: argocd
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
  register: root_gitops_application
  until:
    - root_gitops_application.resources | length == 1
    - root_gitops_application.resources[0].status.sync.status | default('') == 'Synced'
    - root_gitops_application.resources[0].status.health.status | default('') == 'Healthy'
  retries: 90
  delay: 20
  changed_when: false

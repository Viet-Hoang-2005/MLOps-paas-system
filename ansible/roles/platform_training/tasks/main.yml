---
- name: Require Argo CD to reconcile every training addon and capacity application
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "{{ item }}"
    namespace: argocd
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
  register: reconciled_training_application
  until:
    - reconciled_training_application.resources | length == 1
    - reconciled_training_application.resources[0].status.sync.status | default('') == 'Synced'
    - reconciled_training_application.resources[0].status.health.status | default('') == 'Healthy'
  retries: 60
  delay: 10
  changed_when: false
  loop: "{{ training_addon_application_names + training_cluster_application_names }}"

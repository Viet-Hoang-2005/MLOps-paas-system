---
- name: Require Ubuntu 22.04 or newer
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_version is version('22.04', '>=')
    fail_msg: The K3s roles support Ubuntu 22.04 or newer.

- name: Wait for cloud-init to finish
  become: true
  ansible.builtin.command: cloud-init status --wait
  changed_when: false

- name: Wait for automatic apt jobs
  become: true
  ansible.builtin.command: >-
    systemd-run --property=After=apt-daily.service
    --property=After=apt-daily-upgrade.service --wait /bin/true
  changed_when: false

- name: Install host and Kubernetes prerequisites
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - ca-certificates
      - chrony
      - curl
      - git
      - jq
      - nfs-common
      - open-iscsi
      - python3-jsonpatch
      - python3-kubernetes
      - python3-yaml
      - unzip
    state: present

- name: Set the deterministic host name
  become: true
  ansible.builtin.hostname:
    name: "{{ k3s_node_name | default(inventory_hostname) }}"

- name: Disable swap immediately
  become: true
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb | int > 0
  changed_when: true

- name: Disable swap persistently
  become: true
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*[^#]\S+\s+\S+\s+swap\s+.*)$'
    replace: '# \1'

- name: Configure required kernel modules
  become: true
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    mode: "0644"
    content: |
      overlay
      br_netfilter
  notify: Load K3s kernel modules

- name: Load required kernel modules now
  become: true
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Configure Kubernetes networking sysctls
  become: true
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-k3s.conf
    reload: true
  loop:
    - name: net.bridge.bridge-nf-call-iptables
      value: "1"
    - name: net.bridge.bridge-nf-call-ip6tables
      value: "1"
    - name: net.ipv4.ip_forward
      value: "1"

- name: Set the host timezone to UTC
  become: true
  community.general.timezone:
    name: Etc/UTC

- name: Enable time synchronization and required host services
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - chrony
    - iscsid

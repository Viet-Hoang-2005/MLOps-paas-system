---
- name: Read the installed Helm version
  ansible.builtin.command: /usr/local/bin/helm version --short
  register: installed_helm_version
  changed_when: false
  failed_when: false

- name: Download the pinned Helm archive
  become: true
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: "/usr/local/src/helm-{{ helm_version }}-linux-amd64.tar.gz"
    owner: root
    group: root
    mode: "0644"
  when: helm_version not in installed_helm_version.stdout

- name: Extract the pinned Helm archive
  become: true
  ansible.builtin.unarchive:
    src: "/usr/local/src/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: /usr/local/src
    remote_src: true
  when: helm_version not in installed_helm_version.stdout

- name: Install the pinned Helm binary
  become: true
  ansible.builtin.copy:
    src: /usr/local/src/linux-amd64/helm
    dest: /usr/local/bin/helm
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  when: helm_version not in installed_helm_version.stdout

---
# Ansible Verify Role - Central Dispatcher
- name: "Execute Bootstrap Verification Phase"
  ansible.builtin.include_tasks: bootstrap.yml
  tags: 
    - verify
    - verify-bootstrap
    - verify-nodes
    - verify-network
  when: verify_scope in ['bootstrap', 'all']

- name: "Execute Platform Verification Phase"
  ansible.builtin.include_tasks: platform.yml
  tags:
    - verify
    - verify-platform
    - verify-gitops
    - verify-storage
    - verify-data
    - verify-security
    - verify-logging
    - verify-workloads
    - verify-execution
  when: verify_scope in ['platform', 'all']

- name: "Execute Training Verification Phase"
  ansible.builtin.include_tasks: training.yml
  tags: 
    - verify
    - verify-training
  when: verify_scope in ['training', 'all']

---
# Phase 2: Core Platform, GitOps, Data Stores & Workloads Verification
# --- GitOps Control Plane, Argo CD & Core Addons ---
- name: Verify Argo CD reports the root application healthy
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: mlops-paas-system
    namespace: argocd
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
  register: verified_root_application
  failed_when: >-
    verified_root_application.resources | length != 1 or
    verified_root_application.resources[0].status.sync.status | default('') != 'Synced' or
    verified_root_application.resources[0].status.health.status | default('') != 'Healthy'
  tags: [verify, verify-platform, verify-gitops]

- name: Verify every core addon and cluster Application is reconciled
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "{{ item }}"
    namespace: argocd
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
  register: verified_core_application
  failed_when: >-
    verified_core_application.resources | length != 1 or
    verified_core_application.resources[0].status.sync.status | default('') != 'Synced' or
    verified_core_application.resources[0].status.health.status | default('') != 'Healthy'
  loop: "{{ core_addon_application_names + core_cluster_application_names }}"
  tags: [verify, verify-platform, verify-gitops]

- name: Verify every core addon CRD is Established
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ item }}"
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
    wait: true
    wait_timeout: 300
    wait_condition:
      type: Established
      status: "True"
  loop: "{{ core_addon_crds }}"
  tags: [verify, verify-platform, verify-gitops]

- name: Verify every core addon workload is Ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ item.namespace }}"
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
    label_selectors:
      - "app.kubernetes.io/instance={{ item.release }}"
  register: verified_core_addon_pods
  until:
    - verified_core_addon_pods.resources | length > 0
    - >-
      (verified_core_addon_pods.resources |
      json_query("[?status.conditions[?type=='Ready' && status=='True']]") |
      length) == verified_core_addon_pods.resources | length
  retries: 120
  delay: 5
  loop: "{{ core_addon_workloads }}"
  tags: [verify, verify-platform, verify-gitops]

# --- Storage Subsystem & Dynamic EBS Smoke Test ---
- name: Verify the AWS EBS CSI driver is registered
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: CSIDriver
    name: ebs.csi.aws.com
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
  register: verified_ebs_csi_driver
  failed_when: verified_ebs_csi_driver.resources | length != 1
  tags: [verify, verify-platform, verify-storage]

- name: Verify the default ebs-gp3 StorageClass exists
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: ebs-gp3
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
  register: verified_storage_class
  failed_when: verified_storage_class.resources | length != 1
  tags: [verify, verify-platform, verify-storage]

- name: Verify EBS dynamic provisioning and attachment
  when: verify_storage_smoke_enabled | default(true) | bool
  tags: [verify, verify-platform, verify-storage]
  block:
    - name: Create the temporary storage validation namespace
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ k3s_remote_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ansible-storage-validation

    - name: Create an EBS-backed validation pod and claim
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ k3s_remote_kubeconfig }}"
        definition: "{{ item }}"
      loop:
        - apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: ebs-smoke
            namespace: ansible-storage-validation
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: ebs-gp3
            resources:
              requests:
                storage: 1Gi
        - apiVersion: v1
          kind: Pod
          metadata:
            name: ebs-smoke
            namespace: ansible-storage-validation
          spec:
            restartPolicy: Never
            nodeSelector:
              workload-type: worker
            containers:
              - name: verify
                image: public.ecr.aws/docker/library/busybox:1.36
                command: [sh, -c, "echo ready > /data/status && sleep 600"]
                volumeMounts:
                  - name: data
                    mountPath: /data
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: ebs-smoke

    - name: Wait for the EBS validation pod
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        name: ebs-smoke
        namespace: ansible-storage-validation
        kubeconfig: "{{ k3s_remote_kubeconfig }}"
        wait: true
        wait_timeout: 300
  always:
    - name: Remove the storage validation namespace and volume
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Namespace
        name: ansible-storage-validation
        kubeconfig: "{{ k3s_remote_kubeconfig }}"
        wait: true
        wait_timeout: 300

# --- Shared Data Stores (Postgres HA, Redis HA, Redpanda) ---
- name: Read the CloudNativePG cluster state
  kubernetes.core.k8s_info:
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
    name: postgresql
    namespace: mlops-paas-data
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
  register: verified_cnpg_cluster
  tags: [verify, verify-platform, verify-data]

- name: Require both CloudNativePG instances to be Ready
  ansible.builtin.assert:
    that:
      - verified_cnpg_cluster.resources | length == 1
      - verified_cnpg_cluster.resources[0].spec.instances | int == 2
      - verified_cnpg_cluster.resources[0].status.readyInstances | default(0) | int == 2
    fail_msg: CloudNativePG does not have two ready instances.
  tags: [verify, verify-platform, verify-data]

- name: Read the Redis Platform StatefulSets
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    name: "{{ item }}"
    namespace: mlops-paas-data
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
  loop:
    - redis-queue-ha
    - redis-queue-ha-sentinel
    - redis-cache
  register: verified_redis_statefulsets
  tags: [verify, verify-platform, verify-data]

- name: Require two Redis Queue, three Sentinel replicas, and one Redis Cache Ready
  ansible.builtin.assert:
    that:
      - verified_redis_statefulsets.results[0].resources | length == 1
      - verified_redis_statefulsets.results[1].resources | length == 1
      - verified_redis_statefulsets.results[2].resources | length == 1
      - verified_redis_statefulsets.results[0].resources[0].status.readyReplicas | default(0) | int == 2
      - verified_redis_statefulsets.results[1].resources[0].status.readyReplicas | default(0) | int == 3
      - verified_redis_statefulsets.results[2].resources[0].status.readyReplicas | default(0) | int == 1
    fail_msg: Redis Platform must have two Queue, three Sentinel, and one Cache replicas Ready.
  tags: [verify, verify-platform, verify-data]

- name: Read Redis and Sentinel Pod placement
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: mlops-paas-data
    label_selectors:
      - "app={{ item.app }}"
      - "role={{ item.role }}"
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
  loop:
    - {app: redis-queue-ha, role: replication}
    - {app: redis-queue-ha-sentinel, role: sentinel}
  register: verified_redis_pods
  tags: [verify, verify-platform, verify-data]

- name: Require Redis only on separate workers and Sentinel on all three static nodes
  ansible.builtin.assert:
    that:
      - verified_redis_pods.results[0].resources | length == 2
      - verified_redis_pods.results[1].resources | length == 3
      - (verified_redis_pods.results[0].resources | map(attribute='spec.nodeName') | list | sort) == (groups['workers'] | sort)
      - (verified_redis_pods.results[1].resources | map(attribute='spec.nodeName') | list | sort) == ((groups['master'] + groups['workers']) | sort)
    fail_msg: Redis/Sentinel placement does not match the three-node HA topology.
  tags: [verify, verify-platform, verify-data]

- name: Read the Redpanda Kafka StatefulSet
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    name: redpanda
    namespace: mlops-paas-data
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
  register: verified_redpanda_statefulset
  tags: [verify, verify-platform, verify-data]

- name: Require Redpanda replica to be Ready
  ansible.builtin.assert:
    that:
      - verified_redpanda_statefulset.resources | length == 1
      - verified_redpanda_statefulset.resources[0].status.readyReplicas | default(0) | int >= 1
    fail_msg: Redpanda message broker does not have a ready replica.
  tags: [verify, verify-platform, verify-data]

# --- Security Hardening, Zero Trust Network & External Secrets ---
- name: Verify every External Secrets store is Ready
  kubernetes.core.k8s_info:
    api_version: external-secrets.io/v1
    kind: ClusterSecretStore
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
  register: verified_external_secret_stores
  until:
    - verified_external_secret_stores.resources | length > 0
    - >-
      (verified_external_secret_stores.resources |
      json_query("[?status.conditions[?type=='Ready' && status=='True']]") |
      length) == verified_external_secret_stores.resources | length
  retries: 60
  delay: 5
  tags: [verify, verify-platform, verify-security]

- name: Verify every ExternalSecret is Ready
  kubernetes.core.k8s_info:
    api_version: external-secrets.io/v1
    kind: ExternalSecret
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
  register: verified_external_secrets
  until:
    - verified_external_secrets.resources | length > 0
    - >-
      (verified_external_secrets.resources |
      json_query("[?status.conditions[?type=='Ready' && status=='True']]") |
      length) == verified_external_secrets.resources | length
  retries: 60
  delay: 5
  tags: [verify, verify-platform, verify-security]

- name: Verify core NetworkPolicies exist across isolated planes
  kubernetes.core.k8s_info:
    api_version: networking.k8s.io/v1
    kind: NetworkPolicy
    namespace: "{{ item }}"
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
  register: verified_network_policies
  failed_when: verified_network_policies.resources | length == 0
  loop:
    - mlops-paas-execution
    - mlops-paas-core
    - mlops-paas-data
  tags: [verify, verify-platform, verify-security]

- name: Verify security hardening resources remain intentionally deferred
  ansible.builtin.assert:
    that:
      - root_kustomization_text is not search('security')
    fail_msg: k8s/security must remain outside root GitOps during this rollout phase.
  vars:
    root_kustomization_text: "{{ lookup('ansible.builtin.file', playbook_dir + '/../k8s/kustomization.yaml') }}"
  tags: [verify, verify-platform, verify-security]

# --- Observability, Metrics & Centralized Logging ---
- name: Verify Grafana Alloy DaemonSet on worker nodes
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: DaemonSet
    namespace: mlops-logging
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
    label_selectors:
      - "app.kubernetes.io/name=alloy"
  register: verified_alloy_daemonset
  until:
    - verified_alloy_daemonset.resources | length > 0
    - verified_alloy_daemonset.resources[0].status.numberReady | default(0) >= (groups['workers'] | length)
  retries: 60
  delay: 5
  when:
    - groups['workers'] is defined
    - groups['workers'] | length > 0
  tags: [verify, verify-platform, verify-logging]

- name: Verify Loki StatefulSet ready in logging namespace
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    namespace: mlops-logging
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
    label_selectors:
      - "app.kubernetes.io/name=loki"
  register: verified_loki_statefulset
  until:
    - verified_loki_statefulset.resources | length > 0
    - verified_loki_statefulset.resources[0].status.readyReplicas | default(0) >= 1
  retries: 60
  delay: 5
  tags: [verify, verify-platform, verify-logging]

- name: Verify Prometheus monitoring stack pods ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: monitoring
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
    label_selectors:
      - "app.kubernetes.io/name=prometheus"
  register: verified_prometheus_pods
  until:
    - verified_prometheus_pods.resources | length > 0
    - >-
      (verified_prometheus_pods.resources |
      json_query("[?status.conditions[?type=='Ready' && status=='True']]") |
      length) == verified_prometheus_pods.resources | length
  retries: 60
  delay: 5
  tags: [verify, verify-platform, verify-logging]

# --- Microservices & Tenant Workloads Health ---
- name: Verify core workload Deployments are ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ item.name }}"
    namespace: "{{ item.namespace }}"
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
  register: verified_workload_deployments
  until:
    - verified_workload_deployments.resources | length == 1
    - verified_workload_deployments.resources[0].status.readyReplicas | default(0) >= 1
  retries: 60
  delay: 5
  loop:
    - {name: mlops-paas-control-plane, namespace: mlops-paas-core}
    - {name: mlops-paas-celery-worker, namespace: mlops-paas-core}
    - {name: mlops-paas-consumer, namespace: mlops-paas-core}
    - {name: mlops-paas-model-server, namespace: mlops-paas-serving}
    - {name: mlops-paas-web, namespace: mlops-paas-core}
  tags: [verify, verify-platform, verify-workloads]

- name: Verify Control Plane Service is registered
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    name: mlops-paas-control-plane
    namespace: mlops-paas-core
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
  register: verified_control_plane_service
  failed_when: verified_control_plane_service.resources | length != 1
  tags: [verify, verify-platform, verify-workloads]

# --- Execution Plane, Event Streaming & Pipeline Engine ---
- name: Verify Argo Events EventBus is Ready
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: EventBus
    name: default
    namespace: argo-events
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
  register: verified_eventbus
  until:
    - verified_eventbus.resources | length == 1
    - >-
      (verified_eventbus.resources[0].status.conditions | default([]) |
      selectattr('type', 'equalto', 'Deployed') |
      map(attribute='status') | first | default('False')) == 'True'
  retries: 60
  delay: 5
  tags: [verify, verify-platform, verify-execution]

- name: Verify Argo Events EventSource and Sensor are Ready
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: argo-events
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
  register: verified_events_components
  until:
    - verified_events_components.resources | length == 1
    - >-
      (verified_events_components.resources[0].status.conditions | default([]) |
      selectattr('type', 'equalto', 'Deployed') |
      map(attribute='status') | first | default('False')) == 'True'
  retries: 60
  delay: 5
  loop:
    - {kind: EventSource, name: webhook-eventsource}
    - {kind: Sensor, name: webhook-sensor}
  tags: [verify, verify-platform, verify-execution]

- name: Validate a build Workflow against the live API server
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
    definition: "{{ build_workflow_dry_run }}"
  check_mode: true
  changed_when: false
  tags: [verify, verify-platform, verify-execution, workflow-dry-run]
  vars:
    build_workflow_dry_run:
      apiVersion: argoproj.io/v1alpha1
      kind: Workflow
      metadata:
        generateName: ansible-build-dry-run-
        namespace: mlops-paas-execution
      spec:
        workflowTemplateRef:
          name: mlops-paas-model-packager-template
        arguments:
          parameters:
            - {name: build_id, value: "00000000-0000-4000-8000-000000000001"}
            - {name: project_id, value: "00000000-0000-4000-8000-000000000002"}
            - {name: tenant_id, value: "00000000-0000-4000-8000-000000000003"}
            - {name: image_repository, value: "registry.invalid/mlops-paas/dry-run"}
            - {name: image_tag, value: "validation"}
            - {name: flavor, value: "python"}
            - {name: task_type, value: "classification"}
            - {name: requirements_text, value: ""}
            - {name: source_artifact_name, value: "dry-run.tar.gz"}
            - {name: source_type, value: "manual_upload"}
            - {name: source_download_url, value: "https://example.invalid/source"}
            - {name: output_upload_url, value: "https://example.invalid/output"}
            - name: control_plane_webhook_url
              value: "http://mlops-paas-control-plane.mlops-paas-core.svc.cluster.local/api/v1/builds/callback"


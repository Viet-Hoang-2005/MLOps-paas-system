---
- name: Validate the WSL control host and Terraform inventory
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [preflight, always]
  roles:
    - preflight

- name: Prepare all K3s hosts
  hosts: all
  gather_facts: true
  tags: [bootstrap]
  roles:
    - role: common
      when: bootstrap_k3s_cluster | bool

- name: Install the pinned K3s server
  hosts: master
  become: true
  gather_facts: true
  tags: [bootstrap]
  roles:
    - role: k3s_master
      when: bootstrap_k3s_cluster | bool

- name: Join the pinned K3s workers
  hosts: workers
  gather_facts: true
  tags: [bootstrap]
  roles:
    - role: k3s_worker
      when: bootstrap_k3s_cluster | bool

- name: Verify K3s bootstrap
  hosts: master
  become: true
  gather_facts: false
  tags: [bootstrap, verify]
  roles:
    - role: verify
      verify_scope: bootstrap
      when: bootstrap_k3s_cluster | bool

- name: Bootstrap Argo CD and reconcile the core platform through GitOps
  hosts: master
  become: true
  gather_facts: true
  tags: [platform-core]
  roles:
    - role: helm
      when: deploy_core_platform | bool
    - role: platform_core
      when: deploy_core_platform | bool

- name: Wait for optional training operators and GitOps-managed capacity
  hosts: master
  become: true
  gather_facts: true
  tags: [platform-training]
  roles:
    - role: platform_training
      when: deploy_training_platform | bool

- name: Verify the optional training platform and smoke workloads
  hosts: master
  become: true
  gather_facts: false
  tags: [platform-training, verify]
  roles:
    - role: verify
      verify_scope: training
      when: deploy_training_platform | bool

- name: Verify the reconciled platform
  hosts: master
  become: true
  gather_facts: false
  tags: [verify]
  roles:
    - role: verify
      verify_scope: platform
      when: deploy_core_platform | bool

services:
  # 1. Django Control Plane
  control-plane:
    build:
      context: ./services/control-plane
      dockerfile: Dockerfile
    image: mlops-paas-control-plane
    container_name: control_plane
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: 1
      LOG_FORMAT: ${LOG_FORMAT:-console}
      LOG_SUMMARY_INTERVAL_SECONDS: ${LOG_SUMMARY_INTERVAL_SECONDS:-60}
      PYTHONPATH: /app/src
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-local-dev-change-me}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,control-plane,control_plane}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://mlops-nids-nt114.id.vn,http://localhost:5173,http://127.0.0.1:5173}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://mlops-nids-nt114.id.vn,http://localhost:5173,http://127.0.0.1:5173}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-False}
      DB_HOST_RW: postgres
      DB_HOST_RO: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_SCHEMA: ${DB_SCHEMA:-control_plane}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/4
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      GOOGLE_OAUTH2_CLIENT_ID: ${GOOGLE_OAUTH2_CLIENT_ID}
      GITHUB_OAUTH2_CLIENT_ID: ${GITHUB_OAUTH2_CLIENT_ID}
      GITHUB_OAUTH2_CLIENT_SECRET: ${GITHUB_OAUTH2_CLIENT_SECRET}
      GITHUB_OAUTH_REDIRECT_URI: ${GITHUB_OAUTH_REDIRECT_URI:-http://localhost:5173/oauth/github/callback}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-mlops-paas-artifacts}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      EXECUTION_BACKEND: ${EXECUTION_BACKEND:-docker}
      BUILD_BACKEND: ${BUILD_BACKEND:-}
      DEPLOYMENT_BACKEND: ${DEPLOYMENT_BACKEND:-}
      TRAINING_BACKEND: ${TRAINING_BACKEND:-}
      TRAINING_ENABLED: ${TRAINING_ENABLED:-true}
      TRAINING_GPU_ENABLED: ${TRAINING_GPU_ENABLED:-false}
      TRAINING_GPU_COUNTS: ${TRAINING_GPU_COUNTS:-1}
      DRIFT_BACKEND: ${DRIFT_BACKEND:-}
      LOCAL_TRAINING_TIMEOUT: ${LOCAL_TRAINING_TIMEOUT:-1800}
      EXECUTION_WATCH_ENABLED: ${EXECUTION_WATCH_ENABLED:-true}
      EXECUTION_DISPATCH_TIMEOUT_SECONDS: ${EXECUTION_DISPATCH_TIMEOUT_SECONDS:-1800}
      DRIFT_MAX_RUNTIME_SECONDS: ${DRIFT_MAX_RUNTIME_SECONDS:-3600}
      TRAINING_CAPABILITY_MAX_TTL_SECONDS: ${TRAINING_CAPABILITY_MAX_TTL_SECONDS:-46800}
      LOCAL_TRAINING_MAX_OUTPUT_MB: ${LOCAL_TRAINING_MAX_OUTPUT_MB:-500}
      LOCAL_TRAINING_ALLOW_PIP_INSTALL: ${LOCAL_TRAINING_ALLOW_PIP_INSTALL:-True}
      ENABLE_GPU_TRAINING: ${ENABLE_GPU_TRAINING:-False}
      TRAINING_MAX_ACTIVE_JOBS_PER_TENANT: ${TRAINING_MAX_ACTIVE_JOBS_PER_TENANT:-1}
      MLFLOW_TRACKING_REQUIRED: ${MLFLOW_TRACKING_REQUIRED:-false}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-mlops-paas-training}
      MLFLOW_UI_URL: ${MLFLOW_UI_URL:-http://localhost:5003}
      MODEL_SERVER_PUBLIC_URL: ${MODEL_SERVER_PUBLIC_URL:-http://localhost:5002}
      MODEL_SERVER_INTERNAL_URL: ${MODEL_SERVER_INTERNAL_URL:-http://traefik:5000}
      MODEL_PACKAGER_URL: ${MODEL_PACKAGER_URL:-http://model-packager:7000}
      CONTROL_PLANE_INTERNAL_URL: ${CONTROL_PLANE_INTERNAL_URL:-http://control-plane:8000}
      DOCKER_NETWORK_NAME: ${DOCKER_NETWORK_NAME:-mlops_paas_network}
      CONTROL_PLANE_WEBHOOK_SECRET: ${CONTROL_PLANE_WEBHOOK_SECRET:-super-secret-key}
      HARBOR_REGISTRY_URL: ${HARBOR_REGISTRY_URL-}
      HARBOR_USER_PROJECT: ${HARBOR_USER_PROJECT:-user-images}
      HARBOR_USERNAME: ${HARBOR_USERNAME}
      HARBOR_PASSWORD: ${HARBOR_PASSWORD}
    volumes:
      - ./services/control-plane:/app
      - /var/run/docker.sock:/var/run/docker.sock
    command: sh -c "python manage.py migrate --verbosity 0 && python manage.py collectstatic --noinput --verbosity 0 && exec daphne --verbosity 0 -b 0.0.0.0 -p 8000 config.asgi:application"
    depends_on:
      postgres:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      model-packager:
        condition: service_started
    networks:
      - mlops_paas_network

  # 1.1 Local worker shares orchestration and runtime-health execution slots.
  celery-worker:
    build:
      context: ./services/control-plane
      dockerfile: Dockerfile
    container_name: celery_worker
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: 1
      LOG_FORMAT: ${LOG_FORMAT:-console}
      LOG_SUMMARY_INTERVAL_SECONDS: ${LOG_SUMMARY_INTERVAL_SECONDS:-60}
      PYTHONPATH: /app/src
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-local-dev-change-me}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      DB_HOST_RW: postgres
      DB_HOST_RO: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_SCHEMA: ${DB_SCHEMA:-control_plane}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/4
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDPANDA_BROKERS: redpanda:9092
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-mlops-paas-artifacts}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      EXECUTION_BACKEND: ${EXECUTION_BACKEND:-docker}
      LOCAL_BUILD_TIMEOUT_SECONDS: ${LOCAL_BUILD_TIMEOUT_SECONDS:-43200}
      EXECUTION_WATCH_ENABLED: ${EXECUTION_WATCH_ENABLED:-true}
      EXECUTION_DISPATCH_TIMEOUT_SECONDS: ${EXECUTION_DISPATCH_TIMEOUT_SECONDS:-1800}
      DRIFT_MAX_RUNTIME_SECONDS: ${DRIFT_MAX_RUNTIME_SECONDS:-3600}
      TRAINING_CAPABILITY_MAX_TTL_SECONDS: ${TRAINING_CAPABILITY_MAX_TTL_SECONDS:-46800}
      LOCAL_DEPLOY_READINESS_TIMEOUT_SECONDS: ${LOCAL_DEPLOY_READINESS_TIMEOUT_SECONDS:-90}
      BUILD_BACKEND: ${BUILD_BACKEND:-}
      DEPLOYMENT_BACKEND: ${DEPLOYMENT_BACKEND:-}
      TRAINING_BACKEND: ${TRAINING_BACKEND:-}
      TRAINING_ENABLED: ${TRAINING_ENABLED:-true}
      TRAINING_GPU_ENABLED: ${TRAINING_GPU_ENABLED:-false}
      TRAINING_GPU_COUNTS: ${TRAINING_GPU_COUNTS:-1}
      DRIFT_BACKEND: ${DRIFT_BACKEND:-}
      CONTROL_PLANE_INTERNAL_URL: ${CONTROL_PLANE_INTERNAL_URL:-http://control-plane:8000}
      CONTROL_PLANE_WEBHOOK_SECRET: ${CONTROL_PLANE_WEBHOOK_SECRET:-super-secret-key}
      DOCKER_NETWORK_NAME: ${DOCKER_NETWORK_NAME:-mlops_paas_network}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MODEL_SERVER_PUBLIC_URL: ${MODEL_SERVER_PUBLIC_URL:-http://localhost:5002}
      MODEL_SERVER_INTERNAL_URL: ${MODEL_SERVER_INTERNAL_URL:-http://traefik:5000}
      HARBOR_REGISTRY_URL: ${HARBOR_REGISTRY_URL-}
      HARBOR_USER_PROJECT: ${HARBOR_USER_PROJECT:-user-images}
      HARBOR_USERNAME: ${HARBOR_USERNAME}
      HARBOR_PASSWORD: ${HARBOR_PASSWORD}
    volumes:
      - ./services/control-plane:/app
      - /var/run/docker.sock:/var/run/docker.sock
    command: sh -c "until python manage.py migrate --check; do sleep 2; done; exec celery -A config worker -Q celery,runtime-health --concurrency=2"
    depends_on:
      control-plane:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - mlops_paas_network

  # 1.2 Singleton scheduler; the local worker consumes both scheduled task queues.
  celery-beat:
    build:
      context: ./services/control-plane
      dockerfile: Dockerfile
    image: mlops-paas-control-plane
    container_name: celery_beat
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: 1
      LOG_FORMAT: ${LOG_FORMAT:-console}
      LOG_SUMMARY_INTERVAL_SECONDS: ${LOG_SUMMARY_INTERVAL_SECONDS:-60}
      PYTHONPATH: /app/src
      DJANGO_SETTINGS_MODULE: config.settings.health
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-local-dev-change-me}
      DB_HOST_RW: postgres
      DB_HOST_RO: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_SCHEMA: ${DB_SCHEMA:-control_plane}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/4
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LOCAL_EXECUTION_WATCH_ENABLED: "true"
      EXECUTION_WATCH_ENABLED: ${EXECUTION_WATCH_ENABLED:-true}
    volumes:
      - ./services/control-plane:/app
    command: sh -c "until python manage.py migrate --check; do sleep 2; done; exec celery -A config beat --schedule=/tmp/celerybeat-schedule"
    depends_on:
      control-plane:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - mlops_paas_network

  # 2. Model Server API Gateway
  model-server:
    build:
      context: ./services/model-server
      dockerfile: Dockerfile
    image: mlops-paas-model-server
    container_name: model_server
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      PYTHONUNBUFFERED: 1
      LOG_FORMAT: ${LOG_FORMAT:-console}
      LOG_SUMMARY_INTERVAL_SECONDS: ${LOG_SUMMARY_INTERVAL_SECONDS:-60}
      DB_HOST_RO: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      CONTROL_PLANE_DB_SCHEMA: ${DB_SCHEMA:-control_plane}
      REDPANDA_BROKERS: redpanda:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-mlops_paas_production_data}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWKS_URL: http://control-plane:8000/api/auth/.well-known/jwks.json
      LOCAL_RUNTIME_METRICS_ENABLED: "true"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.model-server.rule=PathRegexp(`^/[A-Za-z0-9-]+/models/[0-9A-Fa-f-]{36}/[0-9A-Fa-f-]{36}/(predict|health)$`)"
      - "traefik.http.routers.model-server.middlewares=model-server-rewrite"
      - "traefik.http.middlewares.model-server-rewrite.replacepathregex.regex=^/[^/]+/models/[^/]+/([^/]+)/(predict|health)$"
      - "traefik.http.middlewares.model-server-rewrite.replacepathregex.replacement=/models/$${1}/$${2}"
      - "traefik.http.services.model-server.loadbalancer.server.port=5000"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - mlops_paas_network
    volumes:
      - ./services/model-server:/app

  # 2.1 Machine Learning Serving Engine (Base Image)
  machine-learning-serving:
    build:
      context: ./services/machine-learning-serving
      dockerfile: Dockerfile
    image: mlops-paas-machine-learning-serving:latest
    container_name: machine_learning_serving
    environment:
      LOG_FORMAT: ${LOG_FORMAT:-console}
      LOG_SUMMARY_INTERVAL_SECONDS: ${LOG_SUMMARY_INTERVAL_SECONDS:-60}
    restart: "no"
    command:
      - python
      - -c
      - >-
        from src.logging_utils import configure, log_event;
        log_event(configure('machine-learning-serving'), 'INFO', 'image.ready', 'Runtime image ready for dynamic execution')
    networks:
      - mlops_paas_network

  # 2.2 Deep Learning Serving Engine (Base Image)
  deep-learning-serving:
    build:
      context: ./services/deep-learning-serving
      dockerfile: Dockerfile
    image: mlops-paas-deep-learning-serving:latest
    container_name: deep_learning_serving
    environment:
      LOG_FORMAT: ${LOG_FORMAT:-console}
    restart: "no"
    command:
      - python
      - -c
      - >-
        from src.logging_utils import configure, log_event;
        log_event(configure('deep-learning-serving'), 'INFO', 'image.ready', 'Runtime image ready for dynamic execution')
    networks:
      - mlops_paas_network

  # 2.3 Traefik API Gateway for Model Server
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    command:
      - "--ping=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:5000"
    ports:
      - "5002:5000"
      - "8080:8080" # Dashboard Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mlops_paas_network

  # 3. Model Package (Image Builder)
  model-packager:
    build:
      context: ./services/model-packager
      dockerfile: Dockerfile
    image: mlops-paas-model-packager
    container_name: model_packager
    restart: "no"
    command:
      - python
      - -c
      - >-
        from src.logging_utils import configure, log_event;
        log_event(configure('model-packager'), 'INFO', 'image.ready', 'Runtime image ready for dynamic execution')
    environment:
      PYTHONUNBUFFERED: 1
      LOG_FORMAT: ${LOG_FORMAT:-console}
    networks:
      - mlops_paas_network

  # 4. Evidently Drift Monitor (Image Builder)
  evidently:
    build:
      context: ./services/evidently
      dockerfile: Dockerfile
    image: mlops-paas-evidently
    container_name: evidently
    restart: "no"
    command:
      - python
      - -c
      - >-
        from src.logging_utils import configure, log_event;
        log_event(configure('evidently'), 'INFO', 'image.ready', 'Runtime image ready for dynamic execution')
    environment:
      PYTHONUNBUFFERED: 1
      LOG_FORMAT: ${LOG_FORMAT:-console}
    networks:
      - mlops_paas_network

  # 5. Training Runner (Image Builder)
  training-runner:
    build:
      context: ./services/training-runner
      dockerfile: Dockerfile
    image: mlops-paas-training-runner:latest
    container_name: training_runner
    restart: "no"
    command:
      - python
      - -c
      - >-
        from src.logging_utils import configure, log_event;
        log_event(configure('training-runner'), 'INFO', 'image.ready', 'Runtime image ready for dynamic execution')
    environment:
      LOG_FORMAT: ${LOG_FORMAT:-console}
    networks:
      - mlops_paas_network

  # 6. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mlops_paas_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 6.1 Init Container để tạo schema cho Control Plane và MLflow
  schema-init:
    image: postgres:15-alpine
    container_name: postgres_schema_init
    restart: "no"
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    command: >
      sh -c "until pg_isready -h postgres -U ${DB_USER} -d ${DB_NAME}; do sleep 2; done;
      psql -h postgres -U ${DB_USER} -d ${DB_NAME} -v ON_ERROR_STOP=1
      -c 'CREATE SCHEMA IF NOT EXISTS ${DB_SCHEMA:-control_plane}; CREATE SCHEMA IF NOT EXISTS mlflow;'"
    depends_on:
      postgres:
        condition: service_healthy
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - mlops_paas_network

  # 7. Redpanda Kafka Broker
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "-X", "brokers=localhost:9092"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --mode dev-container
    ports:
      - "19092:19092"
      - "18082:18082"
      - "19644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - mlops_paas_network

  # 7.1 Redpanda Init Kafka Topic
  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda_init
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until rpk topic create "$$KAFKA_TOPIC" \
          --if-not-exists \
          --partitions "$$KAFKA_TOPIC_PARTITIONS" \
          --replicas 1 \
          -X brokers=redpanda:9092; do
          echo "Waiting for Redpanda Kafka API to become ready..."
          sleep 2
        done
        if [ -n "$$KAFKA_DLQ_TOPIC" ]; then
          rpk topic create "$$KAFKA_DLQ_TOPIC" \
            --if-not-exists \
            --partitions 1 \
            --replicas 1 \
            -X brokers=redpanda:9092
        fi
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:-mlops_paas_production_data}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC-mlops_paas_production_data.dlq}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
    depends_on:
      redpanda:
        condition: service_started
    tmpfs:
      - /var/lib/redpanda/data
    networks:
      - mlops_paas_network

  # 7.2 Redpanda Consumer
  consumer:
    build:
      context: ./services/consumer
      dockerfile: Dockerfile
    image: mlops-paas-consumer
    container_name: consumer
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: 1
      LOG_FORMAT: ${LOG_FORMAT:-console}
      LOG_SUMMARY_INTERVAL_SECONDS: ${LOG_SUMMARY_INTERVAL_SECONDS:-60}
      DB_HOST_RW: postgres
      DB_HOST_RO: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_SCHEMA: ${DB_SCHEMA:-control_plane}
      REDPANDA_BROKERS: redpanda:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-mlops_paas_production_data}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC-mlops_paas_production_data.dlq}
      KAFKA_TOPIC_RETRY_SECONDS: ${KAFKA_TOPIC_RETRY_SECONDS:-5}
      KAFKA_BATCH_SIZE: ${KAFKA_BATCH_SIZE:-500}
      KAFKA_DB_RETRY_INITIAL_SECONDS: ${KAFKA_DB_RETRY_INITIAL_SECONDS:-5}
      KAFKA_DB_RETRY_MAX_SECONDS: ${KAFKA_DB_RETRY_MAX_SECONDS:-60}
      CONTROL_PLANE_AUTOMATIC_DRIFT_WEBHOOK_URL: ${CONTROL_PLANE_AUTOMATIC_DRIFT_WEBHOOK_URL:-http://control-plane:8000/internal/webhooks/automatic-drift/}
      CONTROL_PLANE_WEBHOOK_SECRET: ${CONTROL_PLANE_WEBHOOK_SECRET:-super-secret-key}
      AUTOMATIC_DRIFT_OUTBOX_POLL_SECONDS: ${AUTOMATIC_DRIFT_OUTBOX_POLL_SECONDS:-5}
      AUTOMATIC_DRIFT_OUTBOX_BATCH_SIZE: ${AUTOMATIC_DRIFT_OUTBOX_BATCH_SIZE:-50}
      AUTOMATIC_DRIFT_OUTBOX_LEASE_SECONDS: ${AUTOMATIC_DRIFT_OUTBOX_LEASE_SECONDS:-60}
      AUTOMATIC_DRIFT_OUTBOX_RETRY_INITIAL_SECONDS: ${AUTOMATIC_DRIFT_OUTBOX_RETRY_INITIAL_SECONDS:-5}
      AUTOMATIC_DRIFT_OUTBOX_RETRY_MAX_SECONDS: ${AUTOMATIC_DRIFT_OUTBOX_RETRY_MAX_SECONDS:-300}
      AUTOMATIC_DRIFT_OUTBOX_REQUEST_TIMEOUT_SECONDS: ${AUTOMATIC_DRIFT_OUTBOX_REQUEST_TIMEOUT_SECONDS:-10}
      GITHUB_REPO: ${GITHUB_REPO}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
      - ./services/consumer:/app
    command: python -m src.main
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    networks:
      - mlops_paas_network

  # 8. Redis
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"
    tmpfs:
      - /data
    networks:
      - mlops_paas_network

  # 9. MLflow Tracking Server
  mlflow:
    build:
      context: ./services/mlflow
      dockerfile: Dockerfile
    image: mlops-paas-mlflow:v2.14.1
    container_name: mlflow
    restart: unless-stopped
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@postgres:${DB_PORT:-5432}/${DB_NAME}?options=-c%20search_path%3Dmlflow
      --serve-artifacts
      --artifacts-destination s3://${AWS_BUCKET_NAME:-mlops-paas-artifacts}
    ports:
      - "5003:5000"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT:-5432}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-mlops-paas-artifacts}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
      MLFLOW_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully
    networks:
      - mlops_paas_network

# Mạng nội bộ cho các container
networks:
  mlops_paas_network:
    name: ${DOCKER_NETWORK_NAME:-mlops_paas_network}
    driver: bridge

# Volume để lưu trữ dữ liệu của PostgreSQL và Redpanda
volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-postgres_data}
  redpanda_data:
    name: redpanda_data

name: CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        required: true
        default: all
        type: choice
        options:
          - all
          - frontend
          - control_plane
          - consumer
          - packager
          - evidently
          - mlflow
          - model_server
          - machine_learning_serving
          - deep_learning_serving
          - training_runner

permissions:
  contents: read

jobs:
  detect-changes:
    name: "Detect Changed Components"
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ (github.event_name != 'workflow_dispatch' && steps.filter.outputs.frontend == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.component == 'all' || inputs.component == 'frontend')) }}
      control_plane: ${{ (github.event_name != 'workflow_dispatch' && steps.filter.outputs.control_plane == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.component == 'all' || inputs.component == 'control_plane')) }}
      consumer: ${{ (github.event_name != 'workflow_dispatch' && steps.filter.outputs.consumer == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.component == 'all' || inputs.component == 'consumer')) }}
      packager: ${{ (github.event_name != 'workflow_dispatch' && steps.filter.outputs.packager == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.component == 'all' || inputs.component == 'packager')) }}
      evidently: ${{ (github.event_name != 'workflow_dispatch' && steps.filter.outputs.evidently == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.component == 'all' || inputs.component == 'evidently')) }}
      mlflow: ${{ (github.event_name != 'workflow_dispatch' && steps.filter.outputs.mlflow == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.component == 'all' || inputs.component == 'mlflow')) }}
      model_server: ${{ (github.event_name != 'workflow_dispatch' && steps.filter.outputs.model_server == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.component == 'all' || inputs.component == 'model_server')) }}
      machine_learning_serving: ${{ (github.event_name != 'workflow_dispatch' && steps.filter.outputs.machine_learning_serving == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.component == 'all' || inputs.component == 'machine_learning_serving')) }}
      deep_learning_serving: ${{ (github.event_name != 'workflow_dispatch' && steps.filter.outputs.deep_learning_serving == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.component == 'all' || inputs.component == 'deep_learning_serving')) }}
      training_runner: ${{ (github.event_name != 'workflow_dispatch' && steps.filter.outputs.training_runner == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.component == 'all' || inputs.component == 'training_runner')) }}
      matrix_targets: ${{ steps.matrix.outputs.targets }}
      gitops_promotion: ${{ steps.matrix.outputs.gitops_promotion }}
    steps:
      - uses: actions/checkout@v4
      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'web/**'
            control_plane:
              - 'services/control-plane/**'
            consumer:
              - 'services/consumer/**'
            packager:
              - 'services/model-packager/**'
            evidently:
              - 'services/evidently/**'
            mlflow:
              - 'services/mlflow/**'
            model_server:
              - 'services/model-server/**'
            machine_learning_serving:
              - 'services/machine-learning-serving/**'
            deep_learning_serving:
              - 'services/deep-learning-serving/**'
            training_runner:
              - 'services/training-runner/**'
      - name: Generate Dynamic Matrix
        id: matrix
        run: |
          python3 - <<'PY'
          import os, json
          manual_component = "${{ inputs.component || '' }}"
          is_manual = "${{ github.event_name }}" == "workflow_dispatch"
          def selected(component):
              return manual_component in ("all", component)
          changed = {
              "frontend": selected("frontend") if is_manual else "${{ steps.filter.outputs.frontend }}" == "true",
              "control_plane": selected("control_plane") if is_manual else "${{ steps.filter.outputs.control_plane }}" == "true",
              "consumer": selected("consumer") if is_manual else "${{ steps.filter.outputs.consumer }}" == "true",
              "packager": selected("packager") if is_manual else "${{ steps.filter.outputs.packager }}" == "true",
              "evidently": selected("evidently") if is_manual else "${{ steps.filter.outputs.evidently }}" == "true",
              "mlflow": selected("mlflow") if is_manual else "${{ steps.filter.outputs.mlflow }}" == "true",
              "model_server": selected("model_server") if is_manual else "${{ steps.filter.outputs.model_server }}" == "true",
              "machine_learning_serving": selected("machine_learning_serving") if is_manual else "${{ steps.filter.outputs.machine_learning_serving }}" == "true",
              "deep_learning_serving": selected("deep_learning_serving") if is_manual else "${{ steps.filter.outputs.deep_learning_serving }}" == "true",
              "training_runner": selected("training_runner") if is_manual else "${{ steps.filter.outputs.training_runner }}" == "true",
          }
          configs = {
              "frontend": {"name": "Frontend Web", "id": "frontend", "context": "web", "dockerfile": "web/Dockerfile", "image": "mlops-paas-web"},
              "control_plane": {"name": "Control Plane", "id": "control_plane", "context": "services/control-plane", "dockerfile": "services/control-plane/Dockerfile", "image": "mlops-paas-control-plane"},
              "consumer": {"name": "Redpanda Consumer", "id": "consumer", "context": "services/consumer", "dockerfile": "services/consumer/Dockerfile", "image": "mlops-paas-consumer"},
              "packager": {"name": "Model Packager", "id": "packager", "context": "services/model-packager", "dockerfile": "services/model-packager/Dockerfile", "image": "mlops-paas-model-packager"},
              "evidently": {"name": "Evidently Drift", "id": "evidently", "context": "services/evidently", "dockerfile": "services/evidently/Dockerfile", "image": "mlops-paas-evidently"},
              "mlflow": {"name": "MLflow Tracking Server", "id": "mlflow", "context": "services/mlflow", "dockerfile": "services/mlflow/Dockerfile", "image": "mlops-paas-mlflow"},
              "model_server": {"name": "Model Server", "id": "model_server", "context": "services/model-server", "dockerfile": "services/model-server/Dockerfile", "image": "mlops-paas-model-server"},
              "machine_learning_serving": {"name": "Machine Learning Serving Base Image", "id": "machine_learning_serving", "context": "services/machine-learning-serving", "dockerfile": "services/machine-learning-serving/Dockerfile", "image": "machine-learning-serving"},
              "deep_learning_serving": {"name": "Deep Learning Serving Base Image", "id": "deep_learning_serving", "context": "services/deep-learning-serving", "dockerfile": "services/deep-learning-serving/Dockerfile", "image": "deep-learning-serving"},
              "training_runner": {"name": "Training Runner", "id": "training_runner", "context": "services/training-runner", "dockerfile": "services/training-runner/Dockerfile", "image": "mlops-paas-training-runner"}
          }
          targets = [configs[k] for k, v in changed.items() if v]
          gitops_components = {
              "frontend", "control_plane", "consumer", "packager", "evidently",
              "mlflow", "model_server", "training_runner",
          }
          gitops_promotion = any(changed[key] for key in gitops_components)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"targets={json.dumps(targets)}\n")
              f.write(f"gitops_promotion={'true' if gitops_promotion else 'false'}\n")
          PY

  build-and-push:
    name: "Build & Push (${{ matrix.target.name }})"
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix_targets != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.detect-changes.outputs.matrix_targets) }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Fetch Secrets from AWS
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            SECRETS, mlops/github-actions-secrets
          parse-json-secrets: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Push qua ALB Ingress (registry domain - DNS Only)
      - name: Login to Harbor Registry
        uses: docker/login-action@v3
        with:
          registry: registry.mlops-nids-nt114.id.vn
          username: ${{ env.SECRETS_HARBOR_GITHUB_USERNAME }}
          password: ${{ env.SECRETS_HARBOR_GITHUB_PASSWORD }}

      - name: Build and Push Image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.target.context }}
          file: ${{ matrix.target.dockerfile }}
          push: true
          provenance: false
          tags: |
            registry.mlops-nids-nt114.id.vn/mlops-paas/${{ matrix.target.image }}:${{ github.sha }}
            registry.mlops-nids-nt114.id.vn/mlops-paas/${{ matrix.target.image }}:latest
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
            VITE_GITHUB_CLIENT_ID=${{ vars.VITE_GITHUB_CLIENT_ID }}
            VITE_GITHUB_REDIRECT_URI=${{ vars.VITE_GITHUB_REDIRECT_URI }}
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Keylessly sign and verify the published Docker image
        env:
          REGISTRY_HOST: "registry.mlops-nids-nt114.id.vn"
          IMAGE: "${{ matrix.target.image }}"
        run: |
          DIGEST="${{ steps.build-and-push.outputs.digest }}"
          IMAGE_REFERENCE="${REGISTRY_HOST}/mlops-paas/${IMAGE}@${DIGEST}"
          for attempt in 1 2 3 4 5; do
            if cosign sign --yes "${IMAGE_REFERENCE}" && \
              cosign verify "${IMAGE_REFERENCE}" \
                --certificate-identity="https://github.com/Viet-Hoang-2005/MLOps-paas-system/.github/workflows/cd.yml@refs/heads/main" \
                --certificate-oidc-issuer="https://token.actions.githubusercontent.com"; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Cosign signing attempt $attempt failed; retrying in $((attempt * 10)) seconds."
              sleep $((attempt * 10))
            fi
          done
          exit 1

  gitops-promotion:
    name: "GitOps: Update Kustomize & Create PR"
    needs: [detect-changes, build-and-push]
    if: needs.detect-changes.outputs.gitops_promotion == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update Image Tags in Kustomization & WorkflowTemplates
        run: |
          REG="registry.mlops-nids-nt114.id.vn/mlops-paas"
          SHA="${{ github.sha }}"
          
          # 1. Promote each independently reconciled workload.
          if [ "${{ needs.detect-changes.outputs.frontend }}" == "true" ]; then
            (cd k8s/apps/overlays/production/web && kustomize edit set image mlops-paas-web=$REG/mlops-paas-web:$SHA)
          fi
          
          if [ "${{ needs.detect-changes.outputs.control_plane }}" == "true" ]; then
            (cd k8s/apps/overlays/production/control-plane && kustomize edit set image mlops-paas-control-plane=$REG/mlops-paas-control-plane:$SHA)
          fi
          
          if [ "${{ needs.detect-changes.outputs.consumer }}" == "true" ]; then
            (cd k8s/apps/overlays/production/consumer && kustomize edit set image mlops-paas-consumer=$REG/mlops-paas-consumer:$SHA)
          fi

          if [ "${{ needs.detect-changes.outputs.model_server }}" == "true" ]; then
            (cd k8s/apps/overlays/production/model-server && kustomize edit set image mlops-paas-model-server=$REG/mlops-paas-model-server:$SHA)
          fi
          
          if [ "${{ needs.detect-changes.outputs.mlflow }}" == "true" ]; then
            (cd k8s/platform/mlflow && kustomize edit set image mlops-paas-mlflow=$REG/mlops-paas-mlflow:$SHA)
          fi
          
          # 2. Update Argo Workflow Templates (packager and evidently)
          if [ "${{ needs.detect-changes.outputs.packager }}" == "true" ]; then
            yq e -i '(.spec.templates[] | select(.name == "prepare-package" or .name == "notify-success") | .container.image) = "'$REG'/mlops-paas-model-packager:'$SHA'"' k8s/argo/workflows/build-workflowtemplate.yaml
          fi

          if [ "${{ needs.detect-changes.outputs.evidently }}" == "true" ]; then
            yq e -i '(.spec.templates[] | select(.name == "run-evidently") | .container.image) = "'$REG'/mlops-paas-evidently:'$SHA'"' k8s/argo/workflows/evidently-workflowtemplate.yaml
          fi

          if [ "${{ needs.detect-changes.outputs.training_runner }}" == "true" ]; then
            yq e -i '(.spec.templates[] | select(.name == "cpu-pytorch-job") | .resource.manifest) |= sub("image: registry.mlops-nids-nt114.id.vn/mlops-paas/mlops-paas-training-runner:[^\\n]+", "image: '$REG'/mlops-paas-training-runner:'$SHA'")' k8s/argo/workflows/training-workflowtemplate.yaml
            yq e -i '(.spec.templates[] | select(.name == "gpu-pytorch-job") | .resource.manifest) |= sub("image: registry.mlops-nids-nt114.id.vn/mlops-paas/mlops-paas-training-runner:[^\\n]+", "image: '$REG'/mlops-paas-training-runner:'$SHA'")' k8s/argo/workflows/training-workflowtemplate.yaml
          fi

      - name: Generate Summary Table
        id: summary
        run: |
          SHA="${{ github.sha }}"
          REG="registry.mlops-nids-nt114.id.vn/mlops-paas"
          
          WEB_TAG="no change"
          DJANGO_TAG="no change"
          CONSUMER_TAG="no change"
          PACKAGER_TAG="no change"
          EVIDENTLY_TAG="no change"
          MLFLOW_TAG="no change"
          MODEL_SERVER_TAG="no change"
          MACHINE_LEARNING_SERVING_TAG="no change"
          DEEP_LEARNING_SERVING_TAG="no change"
          TRAINING_RUNNER_TAG="no change"
          
          if [ "${{ needs.detect-changes.outputs.frontend }}" == "true" ]; then
            WEB_TAG="$REG/mlops-paas-web:$SHA"
          fi
          
          if [ "${{ needs.detect-changes.outputs.control_plane }}" == "true" ]; then
            DJANGO_TAG="$REG/mlops-paas-control-plane:$SHA"
          fi
          
          if [ "${{ needs.detect-changes.outputs.consumer }}" == "true" ]; then
            CONSUMER_TAG="$REG/mlops-paas-consumer:$SHA"
          fi
          
          if [ "${{ needs.detect-changes.outputs.packager }}" == "true" ]; then
            PACKAGER_TAG="$REG/mlops-paas-model-packager:$SHA"
          fi

          if [ "${{ needs.detect-changes.outputs.evidently }}" == "true" ]; then
            EVIDENTLY_TAG="$REG/mlops-paas-evidently:$SHA"
          fi

          if [ "${{ needs.detect-changes.outputs.mlflow }}" == "true" ]; then
            MLFLOW_TAG="$REG/mlops-paas-mlflow:$SHA"
          fi

          if [ "${{ needs.detect-changes.outputs.model_server }}" == "true" ]; then
            MODEL_SERVER_TAG="$REG/mlops-paas-model-server:$SHA"
          fi

          if [ "${{ needs.detect-changes.outputs.machine_learning_serving }}" == "true" ]; then
            MACHINE_LEARNING_SERVING_TAG="$REG/machine-learning-serving:$SHA"
          fi

          if [ "${{ needs.detect-changes.outputs.deep_learning_serving }}" == "true" ]; then
            DEEP_LEARNING_SERVING_TAG="$REG/deep-learning-serving:$SHA"
          fi

          if [ "${{ needs.detect-changes.outputs.training_runner }}" == "true" ]; then
            TRAINING_RUNNER_TAG="$REG/mlops-paas-training-runner:$SHA"
          fi
          
          EOF_DELIM=$(openssl rand -hex 8)
          
          RAW_SUMMARY="### Delivery Summary
          | Component | Image Tag | Delivery |
          | :--- | :--- | :--- |
          | **Frontend Web** (\`mlops-paas-web\`) | \`$WEB_TAG\` | GitOps promotion |
          | **Control Plane** (\`mlops-paas-control-plane\`) | \`$DJANGO_TAG\` | GitOps promotion |
          | **Redpanda Consumer** (\`mlops-paas-consumer\`) | \`$CONSUMER_TAG\` | GitOps promotion |
          | **Model Packager** (\`mlops-paas-model-packager\`) | \`$PACKAGER_TAG\` | GitOps promotion |
          | **Evidently Drift** (\`mlops-paas-evidently\`) | \`$EVIDENTLY_TAG\` | GitOps promotion |
          | **MLflow Tracking Server** (\`mlops-paas-mlflow\`) | \`$MLFLOW_TAG\` | GitOps promotion |
          | **Model Server** (\`mlops-paas-model-server\`) | \`$MODEL_SERVER_TAG\` | GitOps promotion |
          | **Machine Learning Serving Base** (\`machine-learning-serving\`) | \`$MACHINE_LEARNING_SERVING_TAG\` | Registry base image |
          | **Deep Learning Serving Base** (\`deep-learning-serving\`) | \`$DEEP_LEARNING_SERVING_TAG\` | Registry base image |
          | **Training Runner** (\`mlops-paas-training-runner\`) | \`$TRAINING_RUNNER_TAG\` | GitOps promotion |"
          
          SUMMARY_CONTENT=$(echo "$RAW_SUMMARY" | sed 's/^ *//')
          
          echo "$SUMMARY_CONTENT" >> $GITHUB_STEP_SUMMARY
          
          echo "pr_body<<$EOF_DELIM" >> $GITHUB_OUTPUT
          echo "$SUMMARY_CONTENT" >> $GITHUB_OUTPUT
          echo "$EOF_DELIM" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(gitops): update image tags to ${{ github.sha }} [skip ci]"
          title: "GitOps: Promote images to Production (${{ github.sha }}) [skip ci]"
          body: |
            This PR is automatically generated by CD pipeline.
            It promotes newly built Docker images to Kubernetes Production manifests.

            ${{ steps.summary.outputs.pr_body }}

            Merge this PR to trigger ArgoCD deployment.
          branch: "gitops-promote-${{ github.sha }}"
          base: "main"

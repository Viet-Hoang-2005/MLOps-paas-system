name: CI Pipeline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: "Detect Changed Components"
    runs-on: ubuntu-latest
    outputs:
      quality_targets: ${{ steps.matrix.outputs.quality_targets }}
      unit_test_targets: ${{ steps.matrix.outputs.unit_test_targets }}
      image_targets: ${{ steps.matrix.outputs.image_targets }}
      infra_targets: ${{ steps.matrix.outputs.infra_targets }}
    steps:
      - uses: actions/checkout@v4
      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'web/**'
            control_plane:
              - 'services/control-plane/**'
            consumer:
              - 'services/consumer/**'
            packager:
              - 'services/model-packager/**'
            evidently:
              - 'services/evidently/**'
            model_server:
              - 'services/model-server/**'
            machine_learning_serving:
              - 'services/machine-learning-serving/**'
            deep_learning_serving:
              - 'services/deep-learning-serving/**'
            training_runner:
              - 'services/training-runner/**'
            ci_workflow:
              - '.github/workflows/ci.yml'
            service_test_shared:
              - 'services/requirements-test.txt'
            service_lint_shared:
              - 'services/ruff.toml'
              - 'services/requirements-lint.txt'
            k8s:
              - 'k8s/**'
            ansible:
              - 'ansible/**'
            terraform:
              - 'infra/**'

      - name: Generate Dynamic Matrix
        id: matrix
        run: |
          python3 - <<'PY'
          import os, json
          is_manual = "${{ github.event_name }}" == "workflow_dispatch"
          is_ci_workflow_change = "${{ steps.filter.outputs.ci_workflow }}" == "true"
          shared_tests = "${{ steps.filter.outputs.service_test_shared }}" == "true"
          shared_quality = "${{ steps.filter.outputs.service_lint_shared }}" == "true"
          run_all = is_ci_workflow_change or is_manual
          changed = {
              "frontend": "${{ steps.filter.outputs.frontend }}" == "true",
              "control_plane": "${{ steps.filter.outputs.control_plane }}" == "true",
              "consumer": "${{ steps.filter.outputs.consumer }}" == "true",
              "packager": "${{ steps.filter.outputs.packager }}" == "true",
              "evidently": "${{ steps.filter.outputs.evidently }}" == "true",
              "model_server": "${{ steps.filter.outputs.model_server }}" == "true",
              "machine_learning_serving": "${{ steps.filter.outputs.machine_learning_serving }}" == "true",
              "deep_learning_serving": "${{ steps.filter.outputs.deep_learning_serving }}" == "true",
              "training_runner": "${{ steps.filter.outputs.training_runner }}" == "true",
          }
          configs = {
              "frontend": {"name": "Frontend Web", "id": "frontend", "context": "web", "dockerfile": "web/Dockerfile", "image": "mlops-paas-web"},
              "control_plane": {"name": "Control Plane", "id": "control_plane", "context": "services/control-plane", "dockerfile": "services/control-plane/Dockerfile", "image": "mlops-paas-control-plane"},
              "consumer": {"name": "Redpanda Consumer", "id": "consumer", "context": "services/consumer", "dockerfile": "services/consumer/Dockerfile", "image": "mlops-paas-consumer"},
              "packager": {"name": "Model Packager", "id": "packager", "context": "services/model-packager", "dockerfile": "services/model-packager/Dockerfile", "image": "mlops-paas-model-packager"},
              "evidently": {"name": "Evidently Drift", "id": "evidently", "context": "services/evidently", "dockerfile": "services/evidently/Dockerfile", "image": "mlops-paas-evidently"},
              "model_server": {"name": "Model Server", "id": "model_server", "context": "services/model-server", "dockerfile": "services/model-server/Dockerfile", "image": "mlops-paas-model-server"},
              "machine_learning_serving": {"name": "Machine Learning Serving", "id": "machine_learning_serving", "context": "services/machine-learning-serving", "dockerfile": "services/machine-learning-serving/Dockerfile", "image": "mlops-paas-machine-learning-serving"},
              "deep_learning_serving": {"name": "Deep Learning Serving", "id": "deep_learning_serving", "context": "services/deep-learning-serving", "dockerfile": "services/deep-learning-serving/Dockerfile", "image": "mlops-paas-deep-learning-serving"},
              "training_runner": {"name": "Training Runner", "id": "training_runner", "context": "services/training-runner", "dockerfile": "services/training-runner/Dockerfile", "image": "mlops-paas-training-runner"}
          }
          backend_keys = ["control_plane", "consumer", "packager", "evidently", "model_server", "machine_learning_serving", "deep_learning_serving", "training_runner"]
          quality_targets = [configs[k] for k, value in changed.items() if value or (k != "frontend" and shared_quality)]
          unit_test_targets = [configs[k] for k in backend_keys if changed[k] or shared_tests]
          image_targets = [configs[k] for k, value in changed.items() if value]
          infra_changed = {
              "kubernetes": "${{ steps.filter.outputs.k8s }}" == "true",
              "ansible": "${{ steps.filter.outputs.ansible }}" == "true",
              "terraform": "${{ steps.filter.outputs.terraform }}" == "true",
          }
          infra_configs = [
              {"id": "kubernetes", "name": "Kubernetes"},
              {"id": "ansible", "name": "Ansible"},
              {"id": "terraform", "name": "Terraform"},
          ]
          infra_targets = [target for target in infra_configs if infra_changed[target["id"]] or run_all]
          if run_all:
              quality_targets = [configs[k] for k in configs]
              unit_test_targets = [configs[k] for k in backend_keys]
              image_targets = [configs[k] for k in configs]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"quality_targets={json.dumps(quality_targets)}\n")
              f.write(f"unit_test_targets={json.dumps(unit_test_targets)}\n")
              f.write(f"image_targets={json.dumps(image_targets)}\n")
              f.write(f"infra_targets={json.dumps(infra_targets)}\n")
          PY

  secret-scan:
    name: "Secret Scan (GitLeaks)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: GitLeaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LOG_OPTS: ${{ github.event_name != 'pull_request' && '--max-count=1' || '' }}

  workflow-lint:
    name: "GitHub Actions Workflow Lint (actionlint)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint v1.7.12
        run: |
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install /tmp/actionlint /usr/local/bin/actionlint
      - name: Lint CI and CD workflows
        run: actionlint -color .github/workflows/ci.yml .github/workflows/cd.yml

  code-quality:
    name: "Code Quality (${{ matrix.target.name }})"
    needs: [detect-changes, workflow-lint]
    if: needs.detect-changes.result == 'success' && needs.workflow-lint.result == 'success' && needs.detect-changes.outputs.quality_targets != '[]'
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.detect-changes.outputs.quality_targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: matrix.target.id == 'frontend'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: matrix.target.id == 'frontend'
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        id: frontend_install
        if: matrix.target.id == 'frontend'
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and build
        id: frontend_build
        if: matrix.target.id == 'frontend'
        working-directory: web
        run: pnpm run build
      - name: Frontend ESLint (report)
        id: eslint
        if: always() && matrix.target.id == 'frontend' && steps.frontend_install.outcome == 'success'
        working-directory: web
        run: |
          set +e
          pnpm exec eslint . --format json > eslint_report.json
          eslint_exit=$?
          set -e
          cat eslint_report.json
          read -r err_count warning_count < <(python3 - <<'PY'
          import json

          with open("eslint_report.json", encoding="utf-8") as report:
              results = json.load(report)
          print(sum(item.get("errorCount", 0) for item in results), sum(item.get("warningCount", 0) for item in results))
          PY
          )
          echo "errors=$err_count" >> "$GITHUB_OUTPUT"
          echo "warnings=$warning_count" >> "$GITHUB_OUTPUT"
          echo "exit_code=$eslint_exit" >> "$GITHUB_OUTPUT"
          if [ "$err_count" != "0" ]; then
            echo "::error::ESLint found $err_count errors!"
            exit 1
          fi
          exit "$eslint_exit"
      - name: Setup Python for Ruff
        if: matrix.target.id != 'frontend'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: services/requirements-lint.txt
      - name: Install Ruff
        if: matrix.target.id != 'frontend'
        run: python -m pip install -r services/requirements-lint.txt
      - name: Run Ruff (report only)
        id: ruff
        if: matrix.target.id != 'frontend'
        working-directory: ${{ matrix.target.context }}
        run: |
          set +e
          python -m ruff check . --output-format=json > ruff_report.json
          ruff_exit=$?
          set -e
          RUFF_EXIT="$ruff_exit" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = Path("ci-quality-${{ matrix.target.id }}.json")

          def write_summary(display):
              summary.write_text(json.dumps({"display": display}), encoding="utf-8")

          def fail(message):
              write_summary("Warning (Ruff execution error)")
              print(f"::warning::{message}")
              raise SystemExit(0)

          exit_code = int(os.environ["RUFF_EXIT"])
          if exit_code not in (0, 1):
              fail(f"Ruff failed with exit code {exit_code}")
          try:
              findings = json.loads(Path("ruff_report.json").read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              fail(f"Cannot read Ruff JSON report: {exc}")
          if not isinstance(findings, list) or (exit_code == 0) != (len(findings) == 0):
              fail("Ruff exit code and JSON report disagree")

          def escape(value):
              return str(value).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          for finding in findings:
              try:
                  path = Path(finding["filename"]).resolve().relative_to(workspace).as_posix()
                  location = finding["location"]
                  code = finding["code"]
                  message = finding["message"]
                  row = int(location["row"])
                  column = int(location["column"])
              except (KeyError, TypeError, ValueError) as exc:
                  fail(f"Invalid Ruff JSON finding: {exc}")
              print(f"::warning file={escape(path)},line={row},col={column},title=Ruff {escape(code)}::{escape(message)}")
          count = len(findings)
          write_summary(f"Warning ({count} Ruff violations)" if count else "Passed (0 Ruff violations)")
          PY
      - name: Write Ruff execution fallback summary
        if: always() && matrix.target.id != 'frontend'
        working-directory: ${{ matrix.target.context }}
        env:
          RUFF_RESULT: ${{ steps.ruff.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = Path("ci-quality-${{ matrix.target.id }}.json")
          if os.environ.get("RUFF_RESULT") != "success" and not summary.exists():
              summary.write_text(json.dumps({"display": "Warning (Ruff execution error)"}), encoding="utf-8")
          PY
      - name: Write frontend quality summary
        if: always() && matrix.target.id == 'frontend'
        env:
          BUILD_RESULT: ${{ steps.frontend_build.outcome }}
          INSTALL_RESULT: ${{ steps.frontend_install.outcome }}
          ESLINT_RESULT: ${{ steps.eslint.outcome }}
          ESLINT_ERRORS: ${{ steps.eslint.outputs.errors }}
          ESLINT_WARNINGS: ${{ steps.eslint.outputs.warnings }}
        working-directory: web
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          build = os.environ.get("BUILD_RESULT", "skipped")
          install = os.environ.get("INSTALL_RESULT", "skipped")
          eslint = os.environ.get("ESLINT_RESULT", "skipped")
          errors = int(os.environ.get("ESLINT_ERRORS") or 0)
          warnings = int(os.environ.get("ESLINT_WARNINGS") or 0)
          if build != "success" or install != "success" or eslint != "success" or errors:
              display = f"Failed (typecheck/build: {build}, ESLint: {eslint}, {errors} errors, {warnings} warnings)"
          elif warnings:
              display = f"Warning ({warnings} ESLint warnings)"
          else:
              display = "Passed (typecheck, build, ESLint)"
          Path("ci-quality-frontend.json").write_text(json.dumps({"display": display}), encoding="utf-8")
          PY
      - name: Upload code-quality summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary-quality-${{ matrix.target.id }}
          path: ${{ matrix.target.context }}/ci-quality-${{ matrix.target.id }}.json
          if-no-files-found: ignore
      - name: Upload Ruff report
        if: always() && matrix.target.id != 'frontend'
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report-${{ matrix.target.id }}
          path: ${{ matrix.target.context }}/ruff_report.json
          if-no-files-found: ignore

  services-unit-tests:
    name: "Unit Tests (${{ matrix.target.name }})"
    needs: [detect-changes, workflow-lint, code-quality]
    if: always() && needs.detect-changes.result == 'success' && needs.workflow-lint.result == 'success' && needs.detect-changes.outputs.unit_test_targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.detect-changes.outputs.unit_test_targets) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            ${{ matrix.target.context }}/requirements.txt
            ${{ matrix.target.context }}/requirements-test.txt
            services/requirements-test.txt
      - name: Install dependencies
        working-directory: ${{ matrix.target.context }}
        run: |
          if [ -f requirements-test.txt ]; then
            pip install -r requirements.txt -r requirements-test.txt
          else
            pip install -r requirements.txt -r ../requirements-test.txt
          fi
      - name: Control Plane Django checks
        if: matrix.target.id == 'control_plane'
        working-directory: ${{ matrix.target.context }}
        run: |
          python manage.py check --settings=config.settings.test
          python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Run Control Plane unit tests with coverage
        id: control_plane_tests
        if: matrix.target.id == 'control_plane'
        continue-on-error: true
        working-directory: ${{ matrix.target.context }}
        run: python -m pytest src --junitxml=test-results.xml --cov=src/apps --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - name: Run runtime service unit tests with coverage
        id: runtime_service_tests
        if: matrix.target.id != 'control_plane'
        continue-on-error: true
        working-directory: ${{ matrix.target.context }}
        run: python -m pytest tests --junitxml=test-results.xml --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - name: Write unit test summary
        if: always()
        working-directory: ${{ matrix.target.context }}
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          test_result = "${{ steps.control_plane_tests.outcome }}"
          if test_result == "skipped":
              test_result = "${{ steps.runtime_service_tests.outcome }}"
          junit_path = Path("test-results.xml")
          coverage_path = Path("coverage.xml")
          if not junit_path.exists() or not coverage_path.exists():
              display = "Failed (test execution error)"
          else:
              suite = ET.parse(junit_path).getroot()
              tests = int(suite.attrib.get("tests", 0))
              failures = int(suite.attrib.get("failures", 0))
              errors = int(suite.attrib.get("errors", 0))
              skipped = int(suite.attrib.get("skipped", 0))
              passed = tests - failures - errors - skipped
              coverage = float(ET.parse(coverage_path).getroot().attrib["line-rate"]) * 100
              status = "Passed" if test_result == "success" else "Failed"
              display = f"{status} ({passed} passed, {coverage:.2f}% coverage)"
          Path("ci-unit-${{ matrix.target.id }}.json").write_text(
              json.dumps({"display": display}), encoding="utf-8"
          )
          PY
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.target.id }}
          path: ${{ matrix.target.context }}/coverage.xml
          if-no-files-found: ignore
      - name: Upload unit test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary-unit-${{ matrix.target.id }}
          path: ${{ matrix.target.context }}/ci-unit-${{ matrix.target.id }}.json
          if-no-files-found: ignore
      - name: Enforce unit test result
        if: always()
        run: |
          if [ "${{ steps.control_plane_tests.outcome }}" = "failure" ] || [ "${{ steps.runtime_service_tests.outcome }}" = "failure" ]; then
            exit 1
          fi

  infra-validate:
    name: "Infrastructure Validation (${{ matrix.target.name }})"
    needs: [detect-changes, workflow-lint]
    if: needs.detect-changes.result == 'success' && needs.workflow-lint.result == 'success' && needs.detect-changes.outputs.infra_targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.detect-changes.outputs.infra_targets) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python for Kubernetes validation
        if: matrix.target.id == 'kubernetes'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Kubernetes validation dependencies
        if: matrix.target.id == 'kubernetes'
        run: pip install -r k8s/validate/requirements.txt
      - name: Setup Kustomize
        if: matrix.target.id == 'kubernetes'
        uses: imranismail/setup-kustomize@v2
      - name: Setup Helm
        if: matrix.target.id == 'kubernetes'
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Install Kubeconform v0.7.0
        if: matrix.target.id == 'kubernetes'
        run: |
          wget -q https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate Kubernetes manifests
        id: validate_kubernetes
        if: matrix.target.id == 'kubernetes'
        run: |
          echo "Building every Kustomize package to check syntax..."
          mapfile -t targets < <(find k8s -name kustomization.yaml -printf '%h\n' | sort -u)
          for target in "${targets[@]}"; do
            output="$(echo "$target" | tr '/' '-')-manifest.yaml"
            for i in 1 2 3; do
              kustomize build --enable-helm "$target" > "$output" && break || sleep 10
            done
            if [ ! -s "$output" ]; then
              echo "::error::Kustomize build failed for $target after 3 retries."
              exit 1
            fi
            echo "Validating $target with Kubeconform..."
            kubeconform -ignore-missing-schemas -summary "$output"
          done
          python -m unittest discover -s k8s/validate/tests -p 'test_*.py'
          python -m k8s.validate.run_all
      - name: Setup Python for Ansible validation
        if: matrix.target.id == 'ansible'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible dependencies and collections
        if: matrix.target.id == 'ansible'
        run: |
          pip install -r ansible/requirements.txt
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: Validate Ansible
        id: validate_ansible
        if: matrix.target.id == 'ansible'
        run: |
          ansible-playbook -i 'localhost,' ansible/site.yml --syntax-check
          ansible-lint ansible/
      - name: Setup Terraform
        if: matrix.target.id == 'terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - name: Validate Terraform
        id: validate_terraform
        if: matrix.target.id == 'terraform'
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Write infrastructure summary
        if: always()
        env:
          TARGET_ID: ${{ matrix.target.id }}
          KUBERNETES_RESULT: ${{ steps.validate_kubernetes.outcome }}
          ANSIBLE_RESULT: ${{ steps.validate_ansible.outcome }}
          TERRAFORM_RESULT: ${{ steps.validate_terraform.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result_key = {
              "kubernetes": "KUBERNETES_RESULT",
              "ansible": "ANSIBLE_RESULT",
              "terraform": "TERRAFORM_RESULT",
          }[os.environ["TARGET_ID"]]
          result = os.environ.get(result_key, "skipped")
          display = "Passed" if result == "success" else "Failed (validation or setup error)"
          Path(f"ci-infra-{os.environ['TARGET_ID']}.json").write_text(
              json.dumps({"display": display}), encoding="utf-8"
          )
          PY
      - name: Upload infrastructure summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary-infra-${{ matrix.target.id }}
          path: ci-infra-${{ matrix.target.id }}.json
          if-no-files-found: ignore

  images-scan:
    name: "Image Build & Trivy (${{ matrix.target.name }})"
    needs:
      - detect-changes
      - workflow-lint
      - services-unit-tests
    if: >-
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.workflow-lint.result == 'success' &&
      needs.detect-changes.outputs.image_targets != '[]' &&
      (needs.services-unit-tests.result == 'success' || needs.services-unit-tests.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.detect-changes.outputs.image_targets) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Test Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.target.context }}
          file: ${{ matrix.target.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.target.image }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Vulnerability Scan
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ matrix.target.image }}:test"
          format: "json"
          output: "trivy-report.json"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
      - name: Write Trivy summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = Path("trivy-report.json")
          if not report.exists() or "${{ steps.trivy.outcome }}" != "success":
              display = "Failed (scan execution error)"
          else:
              payload = json.loads(report.read_text(encoding="utf-8"))
              vulnerabilities = [
                  vulnerability
                  for result in payload.get("Results", [])
                  for vulnerability in result.get("Vulnerabilities") or []
              ]
              critical = sum(item.get("Severity") == "CRITICAL" for item in vulnerabilities)
              high = sum(item.get("Severity") == "HIGH" for item in vulnerabilities)
              status = "Warning" if critical or high else "Passed"
              display = f"{status} ({critical} critical, {high} high)"
          Path("ci-trivy-${{ matrix.target.id }}.json").write_text(
              json.dumps({"display": display}), encoding="utf-8"
          )
          PY
      - name: Upload Trivy summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary-trivy-${{ matrix.target.id }}
          path: ci-trivy-${{ matrix.target.id }}.json
          if-no-files-found: ignore

  ci-summary:
    name: "CI Pipeline Summary Table"
    needs:
      [
        detect-changes,
        workflow-lint,
        secret-scan,
        code-quality,
        services-unit-tests,
        infra-validate,
        images-scan,
      ]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download matrix summaries
        if: >-
          needs.detect-changes.result == 'success' &&
          (needs.detect-changes.outputs.quality_targets != '[]' ||
           needs.detect-changes.outputs.unit_test_targets != '[]' ||
           needs.detect-changes.outputs.image_targets != '[]' ||
           needs.detect-changes.outputs.infra_targets != '[]')
        uses: actions/download-artifact@v4
        with:
          pattern: ci-summary-*
          path: ci-results
          merge-multiple: true
      - name: Generate Unified CI Summary Table
        env:
          QUALITY_TARGETS: ${{ needs.detect-changes.outputs.quality_targets }}
          UNIT_TEST_TARGETS: ${{ needs.detect-changes.outputs.unit_test_targets }}
          IMAGE_TARGETS: ${{ needs.detect-changes.outputs.image_targets }}
          INFRA_TARGETS: ${{ needs.detect-changes.outputs.infra_targets }}
          IMAGE_SCAN_RESULT: ${{ needs.images-scan.result }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def scheduled_ids(name):
              return {target["id"] for target in json.loads(os.environ.get(name) or "[]")}

          quality_ids = scheduled_ids("QUALITY_TARGETS")
          unit_ids = scheduled_ids("UNIT_TEST_TARGETS")
          image_ids = scheduled_ids("IMAGE_TARGETS")
          infra_ids = scheduled_ids("INFRA_TARGETS")
          image_scan_result = os.environ.get("IMAGE_SCAN_RESULT", "unknown")

          secret_res = "${{ needs.secret-scan.result }}" == "success"
          workflow_lint_res = "${{ needs.workflow-lint.result }}" == "success"

          fmt = lambda ok: "Passed" if ok else "Failed"

          result_files = Path("ci-results")
          def service_result(kind, service_id, scheduled):
              if service_id not in scheduled:
                  if kind == "unit" and service_id == "frontend":
                      return "N/A (frontend has no unit-test matrix)"
                  return "Skipped (no changes)"
              if kind == "trivy" and image_scan_result == "skipped":
                  return "Skipped (unit tests failed)"
              artifact_kind = {"quality": "quality", "unit": "unit", "trivy": "trivy"}[kind]
              path = result_files / f"ci-{artifact_kind}-{service_id}.json"
              if not path.exists():
                  if kind == "quality" and service_id != "frontend":
                      return "Warning (Ruff execution error)"
                  return f"Failed ({kind} execution error)"
              display = json.loads(path.read_text(encoding="utf-8"))["display"]
              if kind == "quality" and service_id != "frontend" and display.startswith("Failed"):
                  return display.replace("Failed", "Warning", 1)
              return display

          def infrastructure_result(component):
              if component not in infra_ids:
                  return "Skipped (no changes)"
              path = result_files / f"ci-infra-{component}.json"
              if not path.exists():
                  return "Failed (infrastructure validation execution error)"
              return json.loads(path.read_text(encoding="utf-8"))["display"]

          summary = ["### Unified CI Pipeline Results\n"]
          summary.append(f"**Workflow syntax (actionlint)**: {fmt(workflow_lint_res)}\n")
          summary.append(f"**Secret Security (GitLeaks)**: {fmt(secret_res)}\n")

          rows = []
          if "frontend" in quality_ids or "frontend" in image_ids:
              rows.append(
                  f"| **Frontend Web** | {service_result('quality', 'frontend', quality_ids)} | "
                  f"{service_result('unit', 'frontend', unit_ids)} | "
                  f"{service_result('trivy', 'frontend', image_ids)} |"
              )

          backend_services = [
              ("control_plane", "Control Plane"),
              ("consumer", "Redpanda Consumer"),
              ("packager", "Model Packager"),
              ("evidently", "Evidently Drift"),
              ("model_server", "Model Server"),
              ("machine_learning_serving", "Machine Learning Serving"),
              ("deep_learning_serving", "Deep Learning Serving"),
              ("training_runner", "Training Runner"),
          ]
          scheduled_backends = quality_ids | unit_ids | image_ids
          for service_id, label in backend_services:
              if service_id in scheduled_backends:
                  rows.append(
                      f"| **{label}** | {service_result('quality', service_id, quality_ids)} | "
                      f"{service_result('unit', service_id, unit_ids)} | "
                      f"{service_result('trivy', service_id, image_ids)} |"
                  )

          if rows:
              summary.append("#### Application Services (FE & BE)")
              summary.append("| Services | Code quality | Unit tests | Trivy |")
              summary.append("| :--- | :--- | :--- | :--- |")
              summary.extend(rows)
              summary.append("\n")

          summary.append("#### Infrastructure")
          summary.append("| Component | Result |")
          summary.append("| :--- | :--- |")
          summary.append(f"| **Kubernetes (Kustomize, Kubeconform, GitOps)** | {infrastructure_result('kubernetes')} |")
          summary.append(f"| **Ansible (Syntax, Lint)** | {infrastructure_result('ansible')} |")
          summary.append(f"| **Terraform (Fmt, Init, Validate)** | {infrastructure_result('terraform')} |")
          summary.append("\n")

          if not rows and not infra_ids:
              summary.append("*No application components changed in this run.*")

          content = "\n".join(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(content + "\n")
          with open("pr_comment.md", "w") as f:
              f.write(content + "\n")
          PY

      - name: Comment CI Summary on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ci-summary
          path: pr_comment.md

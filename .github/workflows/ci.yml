name: CI Pipeline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  detect-changes:
    name: "Detect Changed Components"
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs.ci_workflow == 'true' || github.event_name == 'workflow_dispatch' }}
      control_plane: ${{ steps.filter.outputs.control_plane == 'true' || steps.filter.outputs.ci_workflow == 'true' || github.event_name == 'workflow_dispatch' }}
      consumer: ${{ steps.filter.outputs.consumer == 'true' || steps.filter.outputs.ci_workflow == 'true' || github.event_name == 'workflow_dispatch' }}
      packager: ${{ steps.filter.outputs.packager == 'true' || steps.filter.outputs.ci_workflow == 'true' || github.event_name == 'workflow_dispatch' }}
      evidently: ${{ steps.filter.outputs.evidently == 'true' || steps.filter.outputs.ci_workflow == 'true' || github.event_name == 'workflow_dispatch' }}
      model_server: ${{ steps.filter.outputs.model_server == 'true' || steps.filter.outputs.ci_workflow == 'true' || github.event_name == 'workflow_dispatch' }}
      machine_learning_serving: ${{ steps.filter.outputs.machine_learning_serving == 'true' || steps.filter.outputs.ci_workflow == 'true' || github.event_name == 'workflow_dispatch' }}
      deep_learning_serving: ${{ steps.filter.outputs.deep_learning_serving == 'true' || steps.filter.outputs.ci_workflow == 'true' || github.event_name == 'workflow_dispatch' }}
      training_runner: ${{ steps.filter.outputs.training_runner == 'true' || steps.filter.outputs.ci_workflow == 'true' || github.event_name == 'workflow_dispatch' }}
      k8s: ${{ steps.filter.outputs.k8s == 'true' || steps.filter.outputs.ci_workflow == 'true' || github.event_name == 'workflow_dispatch' }}
      ansible: ${{ steps.filter.outputs.ansible == 'true' || steps.filter.outputs.ci_workflow == 'true' || github.event_name == 'workflow_dispatch' }}
      terraform: ${{ steps.filter.outputs.terraform == 'true' || steps.filter.outputs.ci_workflow == 'true' || github.event_name == 'workflow_dispatch' }}
      matrix_targets: ${{ steps.matrix.outputs.targets }}
      unit_test_targets: ${{ steps.matrix.outputs.unit_test_targets }}
      lint_targets: ${{ steps.matrix.outputs.lint_targets }}
    steps:
      - uses: actions/checkout@v4
      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'web/**'
            control_plane:
              - 'services/control-plane/**'
            consumer:
              - 'services/consumer/**'
            packager:
              - 'services/model-packager/**'
            evidently:
              - 'services/evidently/**'
            model_server:
              - 'services/model-server/**'
            machine_learning_serving:
              - 'services/machine-learning-serving/**'
            deep_learning_serving:
              - 'services/deep-learning-serving/**'
            training_runner:
              - 'services/training-runner/**'
            ci_workflow:
              - '.github/workflows/ci.yml'
              - '.github/workflows/cd.yml'
            service_test_shared:
              - 'services/requirements-test.txt'
            service_lint_shared:
              - 'services/ruff.toml'
              - 'services/requirements-lint.txt'
            k8s:
              - 'k8s/**'
            ansible:
              - 'ansible/**'
            terraform:
              - 'infra/**'

      - name: Generate Dynamic Matrix
        id: matrix
        run: |
          python3 - <<'PY'
          import os, json
          is_manual = "${{ github.event_name }}" == "workflow_dispatch"
          is_ci_workflow_change = "${{ steps.filter.outputs.ci_workflow }}" == "true"
          shared_tests = "${{ steps.filter.outputs.service_test_shared }}" == "true"
          shared_lint = "${{ steps.filter.outputs.service_lint_shared }}" == "true"
          changed = {
              "frontend": "${{ steps.filter.outputs.frontend }}" == "true" or is_ci_workflow_change or is_manual,
              "control_plane": "${{ steps.filter.outputs.control_plane }}" == "true" or is_ci_workflow_change or is_manual,
              "consumer": "${{ steps.filter.outputs.consumer }}" == "true" or is_ci_workflow_change or is_manual,
              "packager": "${{ steps.filter.outputs.packager }}" == "true" or is_ci_workflow_change or is_manual,
              "evidently": "${{ steps.filter.outputs.evidently }}" == "true" or is_ci_workflow_change or is_manual,
              "model_server": "${{ steps.filter.outputs.model_server }}" == "true" or is_ci_workflow_change or is_manual,
              "machine_learning_serving": "${{ steps.filter.outputs.machine_learning_serving }}" == "true" or is_ci_workflow_change or is_manual,
              "deep_learning_serving": "${{ steps.filter.outputs.deep_learning_serving }}" == "true" or is_ci_workflow_change or is_manual,
              "training_runner": "${{ steps.filter.outputs.training_runner }}" == "true" or is_ci_workflow_change or is_manual,
          }
          configs = {
              "frontend": {"name": "Frontend Web", "id": "frontend", "context": "web", "dockerfile": "web/Dockerfile", "image": "mlops-paas-web"},
              "control_plane": {"name": "Control Plane", "id": "control_plane", "context": "services/control-plane", "dockerfile": "services/control-plane/Dockerfile", "image": "mlops-paas-control-plane"},
              "consumer": {"name": "Redpanda Consumer", "id": "consumer", "context": "services/consumer", "dockerfile": "services/consumer/Dockerfile", "image": "mlops-paas-consumer"},
              "packager": {"name": "Model Packager", "id": "packager", "context": "services/model-packager", "dockerfile": "services/model-packager/Dockerfile", "image": "mlops-paas-model-packager"},
              "evidently": {"name": "Evidently Drift", "id": "evidently", "context": "services/evidently", "dockerfile": "services/evidently/Dockerfile", "image": "mlops-paas-evidently"},
              "model_server": {"name": "Model Server", "id": "model_server", "context": "services/model-server", "dockerfile": "services/model-server/Dockerfile", "image": "mlops-paas-model-server"},
              "machine_learning_serving": {"name": "Machine Learning Serving", "id": "machine_learning_serving", "context": "services/machine-learning-serving", "dockerfile": "services/machine-learning-serving/Dockerfile", "image": "mlops-paas-machine-learning-serving"},
              "deep_learning_serving": {"name": "Deep Learning Serving", "id": "deep_learning_serving", "context": "services/deep-learning-serving", "dockerfile": "services/deep-learning-serving/Dockerfile", "image": "mlops-paas-deep-learning-serving"},
              "training_runner": {"name": "Training Runner", "id": "training_runner", "context": "services/training-runner", "dockerfile": "services/training-runner/Dockerfile", "image": "mlops-paas-training-runner"}
          }
          targets = [configs[k] for k, v in changed.items() if v]
          unit_keys = ["control_plane", "consumer", "packager", "evidently", "model_server", "machine_learning_serving", "deep_learning_serving", "training_runner"]
          unit_test_targets = [configs[k] for k in unit_keys if changed[k] or shared_tests]
          lint_targets = [configs[k] for k in unit_keys if changed[k] or shared_lint]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"targets={json.dumps(targets)}\n")
              f.write(f"unit_test_targets={json.dumps(unit_test_targets)}\n")
              f.write(f"lint_targets={json.dumps(lint_targets)}\n")
          PY

  secret-scan:
    name: "Secret Scan (GitLeaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: GitLeaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LOG_OPTS: ${{ github.event_name != 'pull_request' && '--max-count=1' || '' }}
  lint-frontend:
    name: "Frontend Typecheck, Build & Code Quality"
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    outputs:
      errors: ${{ steps.eslint.outputs.errors }}
      warnings: ${{ steps.eslint.outputs.warnings }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        working-directory: web
        run: pnpm run build
      - name: Run ESLint
        id: eslint
        working-directory: web
        run: |
          set +e
          pnpm exec eslint . --format json > eslint_report.json
          eslint_exit=$?
          set -e
          cat eslint_report.json
          read -r err_count warning_count < <(python3 - <<'PY'
          import json

          with open("eslint_report.json", encoding="utf-8") as report:
              results = json.load(report)
          print(sum(item.get("errorCount", 0) for item in results), sum(item.get("warningCount", 0) for item in results))
          PY
          )
          echo "errors=$err_count" >> $GITHUB_OUTPUT
          echo "warnings=$warning_count" >> $GITHUB_OUTPUT
          if [ "$err_count" != "0" ]; then
            echo "::error::ESLint found $err_count errors!"
            exit 1
          fi
          exit "$eslint_exit"

  lint-backend:
    name: "Backend Code Quality (${{ matrix.target.name }})"
    needs: detect-changes
    if: needs.detect-changes.outputs.lint_targets != '[]'
    # Ruff is report-only; even an execution/setup failure is surfaced in the
    # summary but must not prevent unit tests or image scanning from running.
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.detect-changes.outputs.lint_targets) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: services/requirements-lint.txt
      - name: Install Ruff
        run: python -m pip install -r services/requirements-lint.txt
      - name: Run Ruff (Report Only)
        working-directory: ${{ matrix.target.context }}
        run: |
          set +e
          python -m ruff check . --output-format=json > ruff_report.json
          ruff_exit=$?
          set -e
          RUFF_EXIT="$ruff_exit" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = Path("ci-lint-${{ matrix.target.id }}.json")

          def write_summary(display):
              summary.write_text(json.dumps({"display": display}), encoding="utf-8")

          def fail(message):
              write_summary("Failed (Ruff execution error)")
              print(f"::error::{message}")
              raise SystemExit(1)

          exit_code = int(os.environ["RUFF_EXIT"])
          if exit_code not in (0, 1):
              fail(f"Ruff failed with exit code {exit_code}")

          try:
              findings = json.loads(Path("ruff_report.json").read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              fail(f"Cannot read Ruff JSON report: {exc}")
          if not isinstance(findings, list) or (exit_code == 0) != (len(findings) == 0):
              fail("Ruff exit code and JSON report disagree")

          def escape(value):
              return str(value).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          for finding in findings:
              try:
                  path = Path(finding["filename"]).resolve().relative_to(workspace).as_posix()
                  location = finding["location"]
                  code = finding["code"]
                  message = finding["message"]
                  row = int(location["row"])
                  column = int(location["column"])
              except (KeyError, TypeError, ValueError) as exc:
                  fail(f"Invalid Ruff JSON finding: {exc}")
              print(
                  f"::warning file={escape(path)},line={row},col={column},"
                  f"title=Ruff {escape(code)}::{escape(message)}"
              )

          count = len(findings)
          write_summary(f"Warning ({count} Ruff violations)" if count else "Passed (0 Ruff violations)")
          PY
      - name: Upload lint summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary-lint-${{ matrix.target.id }}
          path: ${{ matrix.target.context }}/ci-lint-${{ matrix.target.id }}.json
          if-no-files-found: ignore
      - name: Upload Ruff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report-${{ matrix.target.id }}
          path: ${{ matrix.target.context }}/ruff_report.json
          if-no-files-found: ignore

  service-unit-tests:
    name: "Unit Tests (${{ matrix.target.name }})"
    needs: [detect-changes, lint-backend]
    if: always() && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.unit_test_targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.detect-changes.outputs.unit_test_targets) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            ${{ matrix.target.context }}/requirements.txt
            ${{ matrix.target.context }}/requirements-test.txt
            services/requirements-test.txt
      - name: Install dependencies
        working-directory: ${{ matrix.target.context }}
        run: |
          if [ -f requirements-test.txt ]; then
            pip install -r requirements.txt -r requirements-test.txt
          else
            pip install -r requirements.txt -r ../requirements-test.txt
          fi
      - name: Control Plane Django checks
        if: matrix.target.id == 'control_plane'
        working-directory: ${{ matrix.target.context }}
        run: |
          python manage.py check --settings=config.settings.test
          python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Run Control Plane unit tests with coverage
        id: control_plane_tests
        if: matrix.target.id == 'control_plane'
        continue-on-error: true
        working-directory: ${{ matrix.target.context }}
        run: python -m pytest src --junitxml=test-results.xml --cov=src/apps --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - name: Run runtime service unit tests with coverage
        id: runtime_service_tests
        if: matrix.target.id != 'control_plane'
        continue-on-error: true
        working-directory: ${{ matrix.target.context }}
        run: python -m pytest tests --junitxml=test-results.xml --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - name: Write unit test summary
        if: always()
        working-directory: ${{ matrix.target.context }}
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          test_result = "${{ steps.control_plane_tests.outcome }}"
          if test_result == "skipped":
              test_result = "${{ steps.runtime_service_tests.outcome }}"
          junit_path = Path("test-results.xml")
          coverage_path = Path("coverage.xml")
          if not junit_path.exists() or not coverage_path.exists():
              display = "Failed (test execution error)"
          else:
              suite = ET.parse(junit_path).getroot()
              tests = int(suite.attrib.get("tests", 0))
              failures = int(suite.attrib.get("failures", 0))
              errors = int(suite.attrib.get("errors", 0))
              skipped = int(suite.attrib.get("skipped", 0))
              passed = tests - failures - errors - skipped
              coverage = float(ET.parse(coverage_path).getroot().attrib["line-rate"]) * 100
              status = "Passed" if test_result == "success" else "Failed"
              display = f"{status} ({passed} passed, {coverage:.2f}% coverage)"
          Path("ci-unit-${{ matrix.target.id }}.json").write_text(
              json.dumps({"display": display}), encoding="utf-8"
          )
          PY
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.target.id }}
          path: ${{ matrix.target.context }}/coverage.xml
          if-no-files-found: ignore
      - name: Upload unit test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary-unit-${{ matrix.target.id }}
          path: ${{ matrix.target.context }}/ci-unit-${{ matrix.target.id }}.json
          if-no-files-found: ignore
      - name: Enforce unit test result
        if: always()
        run: |
          if [ "${{ steps.control_plane_tests.outcome }}" = "failure" ] || [ "${{ steps.runtime_service_tests.outcome }}" = "failure" ]; then
            exit 1
          fi

  validate-k8s:
    name: "Kubernetes Validation (Kustomize & Kubeconform)"
    needs: detect-changes
    if: needs.detect-changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python for GitOps validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GitOps validation dependencies
        run: pip install -r k8s/validate/requirements.txt
      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Install Kubeconform v0.7.0
        run: |
          wget -q https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate K8s Manifests
        run: |
          echo "Building every Kustomize package to check syntax..."
          mapfile -t targets < <(find k8s -name kustomization.yaml -printf '%h\n' | sort -u)
          for target in "${targets[@]}"; do
            output="$(echo "$target" | tr '/' '-')-manifest.yaml"
            for i in 1 2 3; do
              kustomize build --enable-helm "$target" > "$output" && break || sleep 10
            done
            if [ ! -s "$output" ]; then
              echo "::error::Kustomize build failed for $target after 3 retries."
              exit 1
            fi
            echo "Validating $target with Kubeconform..."
            kubeconform -ignore-missing-schemas -summary "$output"
          done
          python -m unittest discover -s k8s/validate/tests -p 'test_*.py'
          python -m k8s.validate.run_all

  validate-ansible:
    name: "Ansible Validation (Syntax & Lint)"
    needs: detect-changes
    if: needs.detect-changes.outputs.ansible == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible dependencies and collections
        run: |
          pip install -r ansible/requirements.txt
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: Validate Ansible syntax
        run: ansible-playbook -i 'localhost,' ansible/site.yml --syntax-check
      - name: Lint Ansible
        run: ansible-lint ansible/

  validate-terraform:
    name: "Terraform Validation (Fmt, Init & Validate)"
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Initialize providers without backend
        run: terraform init -backend=false -input=false
      - name: Validate configuration
        run: terraform validate

  build-and-scan:
    name: "Build & Scan (${{ matrix.target.name }})"
    needs:
      [
        detect-changes,
        lint-frontend,
        lint-backend,
        service-unit-tests,
        validate-k8s,
        validate-ansible,
        validate-terraform,
        secret-scan,
      ]
    if: >-
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.matrix_targets != '[]' &&
      (needs.service-unit-tests.result == 'success' || needs.service-unit-tests.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.detect-changes.outputs.matrix_targets) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Test Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.target.context }}
          file: ${{ matrix.target.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.target.image }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Vulnerability Scan
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ matrix.target.image }}:test"
          format: "json"
          output: "trivy-report.json"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
      - name: Write Trivy summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = Path("trivy-report.json")
          if not report.exists() or "${{ steps.trivy.outcome }}" != "success":
              display = "Failed (scan execution error)"
          else:
              payload = json.loads(report.read_text(encoding="utf-8"))
              vulnerabilities = [
                  vulnerability
                  for result in payload.get("Results", [])
                  for vulnerability in result.get("Vulnerabilities") or []
              ]
              critical = sum(item.get("Severity") == "CRITICAL" for item in vulnerabilities)
              high = sum(item.get("Severity") == "HIGH" for item in vulnerabilities)
              status = "Warning" if critical or high else "Passed"
              display = f"{status} ({critical} critical, {high} high)"
          Path("ci-trivy-${{ matrix.target.id }}.json").write_text(
              json.dumps({"display": display}), encoding="utf-8"
          )
          PY
      - name: Upload Trivy summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary-trivy-${{ matrix.target.id }}
          path: ci-trivy-${{ matrix.target.id }}.json
          if-no-files-found: ignore

  ci-summary:
    name: "CI Pipeline Summary Table"
    needs:
      [
        detect-changes,
        secret-scan,
        lint-frontend,
        lint-backend,
        service-unit-tests,
        validate-k8s,
        validate-ansible,
        validate-terraform,
        build-and-scan,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download service summaries
        if: needs.lint-backend.result != 'skipped' || needs.service-unit-tests.result != 'skipped' || needs.build-and-scan.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          pattern: ci-summary-*
          path: ci-results
          merge-multiple: true
      - name: Generate Unified CI Summary Table
        env:
          LINT_TARGETS: ${{ needs.detect-changes.outputs.lint_targets }}
          UNIT_TEST_TARGETS: ${{ needs.detect-changes.outputs.unit_test_targets }}
          MATRIX_TARGETS: ${{ needs.detect-changes.outputs.matrix_targets }}
          IMAGE_SCAN_RESULT: ${{ needs.build-and-scan.result }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          k8s_changed = "${{ needs.detect-changes.outputs.k8s }}" == "true"
          ansible_changed = "${{ needs.detect-changes.outputs.ansible }}" == "true"
          terraform_changed = "${{ needs.detect-changes.outputs.terraform }}" == "true"

          def scheduled_ids(name):
              return {target["id"] for target in json.loads(os.environ.get(name) or "[]")}

          lint_ids = scheduled_ids("LINT_TARGETS")
          unit_ids = scheduled_ids("UNIT_TEST_TARGETS")
          image_ids = scheduled_ids("MATRIX_TARGETS")
          image_scan_result = os.environ.get("IMAGE_SCAN_RESULT", "unknown")

          secret_res = "${{ needs.secret-scan.result }}" == "success"
          eslint_res = "${{ needs.lint-frontend.result }}" == "success"
          eslint_errs = "${{ needs.lint-frontend.outputs.errors }}"
          eslint_warnings = "${{ needs.lint-frontend.outputs.warnings }}"
          k8s_result = "${{ needs.validate-k8s.result }}"
          ansible_result = "${{ needs.validate-ansible.result }}"
          terraform_result = "${{ needs.validate-terraform.result }}"

          fmt = lambda ok: "Passed" if ok else "Failed"
          def infrastructure_result(changed, result):
              if not changed:
                  return "Skipped (no changes)"
              return {
                  "success": "Passed",
                  "failure": "Failed",
                  "cancelled": "Cancelled",
                  "skipped": "Skipped",
              }.get(result, f"Failed ({result or 'unknown'} job result)")
          eslint_errs = int(eslint_errs or 0)
          eslint_warnings = int(eslint_warnings or 0)
          eslint_status = "Failed" if not eslint_res or eslint_errs else "Warning" if eslint_warnings else "Passed"
          eslint_fmt = f"{eslint_status} ({eslint_errs} error, {eslint_warnings} warning)"

          result_files = Path("ci-results")
          def service_result(kind, service_id, scheduled):
              if service_id not in scheduled:
                  return "Skipped (no changes)"
              if kind == "trivy" and image_scan_result == "skipped":
                  return "Skipped (unit tests failed)"
              path = result_files / f"ci-{kind}-{service_id}.json"
              if not path.exists():
                  if kind == "lint":
                      return "Warning (Ruff execution error)"
                  return f"Failed ({kind} execution error)"
              display = json.loads(path.read_text(encoding="utf-8"))["display"]
              if kind == "lint" and display.startswith("Failed"):
                  return display.replace("Failed", "Warning", 1)
              return display

          summary = ["### Unified CI Pipeline Results\n"]
          summary.append(f"**Secret Security (GitLeaks)**: {fmt(secret_res)}\n")

          rows = []
          if "frontend" in image_ids:
              rows.append(f"| **Frontend Web** | {eslint_fmt} | N/A | {service_result('trivy', 'frontend', image_ids)} |")

          backend_services = [
              ("control_plane", "Control Plane"),
              ("consumer", "Redpanda Consumer"),
              ("packager", "Model Packager"),
              ("evidently", "Evidently Drift"),
              ("model_server", "Model Server"),
              ("machine_learning_serving", "Machine Learning Serving"),
              ("deep_learning_serving", "Deep Learning Serving"),
              ("training_runner", "Training Runner"),
          ]
          scheduled_backends = lint_ids | unit_ids | image_ids
          for service_id, label in backend_services:
              if service_id in scheduled_backends:
                  rows.append(
                      f"| **{label}** | {service_result('lint', service_id, lint_ids)} | "
                      f"{service_result('unit', service_id, unit_ids)} | "
                      f"{service_result('trivy', service_id, image_ids)} |"
                  )

          if rows:
              summary.append("#### Application Services (FE & BE)")
              summary.append("| Services | Lint | Unit tests | Trivy |")
              summary.append("| :--- | :--- | :--- | :--- |")
              summary.extend(rows)
              summary.append("\n")

          summary.append("#### Infrastructure")
          summary.append("| Component | Result |")
          summary.append("| :--- | :--- |")
          summary.append(f"| **Kubernetes (Kustomize, Kubeconform, GitOps)** | {infrastructure_result(k8s_changed, k8s_result)} |")
          summary.append(f"| **Ansible (Syntax, Lint)** | {infrastructure_result(ansible_changed, ansible_result)} |")
          summary.append(f"| **Terraform (Fmt, Init, Validate)** | {infrastructure_result(terraform_changed, terraform_result)} |")
          summary.append("\n")

          if not rows and not (k8s_changed or ansible_changed or terraform_changed):
              summary.append("*No application components changed in this run.*")

          content = "\n".join(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(content + "\n")
          with open("pr_comment.md", "w") as f:
              f.write(content + "\n")
          PY

      - name: Comment CI Summary on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ci-summary
          path: pr_comment.md

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-mlops-paas-control-plane
  labels:
    app.kubernetes.io/name: mlops-paas-control-plane
    app.kubernetes.io/instance: mlops-paas-control-plane
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: backend
    app.kubernetes.io/tier: app
    mlops.io/domain: control-plane
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mlops-paas-control-plane
  policyTypes:
    - Ingress
  ingress:
    # Traefik Ingress nhận traffic bên ngoài vào API
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8000
    # Consumer và Workflows gọi Webhook đồng bộ trạng thái
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mlops-paas-consumer
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlops-paas-execution
      ports:
        - protocol: TCP
          port: 8000
    # Prometheus cào metrics
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-mlops-paas-celery-worker
  labels:
    app.kubernetes.io/name: mlops-paas-celery-worker
    app.kubernetes.io/instance: mlops-paas-celery-worker
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: worker
    app.kubernetes.io/tier: jobs
    mlops.io/domain: control-plane
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mlops-paas-celery-worker
  policyTypes:
    - Ingress
  ingress: []


apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mlops-paas-control-plane-pdb
  namespace: mlops-paas-core
  labels:
    app.kubernetes.io/name: mlops-paas-control-plane
    app.kubernetes.io/instance: mlops-paas-control-plane
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: workload
    mlops-paas.io/domain: control-plane
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlops-paas-control-plane
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mlops-paas-celery-worker-pdb
  namespace: mlops-paas-core
  labels:
    app.kubernetes.io/name: mlops-paas-celery-worker
    app.kubernetes.io/instance: mlops-paas-celery-worker
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: worker
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: workload
    mlops-paas.io/domain: control-plane
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlops-paas-celery-worker


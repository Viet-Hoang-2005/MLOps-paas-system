apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-paas-celery-worker
  labels:
    app.kubernetes.io/name: mlops-paas-celery-worker
    app.kubernetes.io/instance: mlops-paas-celery-worker
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: worker
    app.kubernetes.io/tier: jobs
    mlops.io/domain: control-plane
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mlops-paas-celery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlops-paas-celery-worker
        app.kubernetes.io/instance: mlops-paas-celery-worker
        app.kubernetes.io/part-of: mlops-paas
        app.kubernetes.io/component: worker
        app.kubernetes.io/tier: jobs
        mlops.io/domain: control-plane
        app.kubernetes.io/managed-by: kustomize
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload-type: worker
      containers:
        - name: worker
          image: mlops-paas-control-plane
          imagePullPolicy: IfNotPresent
          command: ["celery"]
          args: ["-A", "config", "worker", "-Q", "celery", "--concurrency=2"]
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: celery-worker-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: celery-worker-secret
                  key: DB_PASSWORD
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: celery-worker-secret
                  key: DJANGO_SECRET_KEY
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: celery-worker-secret
                  key: JWT_PRIVATE_KEY
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: celery-worker-secret
                  key: JWT_PUBLIC_KEY
            - name: CONTROL_PLANE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: celery-worker-secret
                  key: CONTROL_PLANE_WEBHOOK_SECRET
            - name: ARGO_EVENTS_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: celery-worker-secret
                  key: ARGO_EVENTS_WEBHOOK_TOKEN
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: celery-worker-secret
                  key: REDIS_PASSWORD
            - name: REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: celery-worker-secret
                  key: REDIS_SENTINEL_PASSWORD
            - name: HARBOR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: celery-worker-secret
                  key: HARBOR_USERNAME
            - name: HARBOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: celery-worker-secret
                  key: HARBOR_PASSWORD
          envFrom:
            - configMapRef:
                name: mlops-paas-control-plane-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 768Mi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-paas-celery-beat
  labels:
    app.kubernetes.io/name: mlops-paas-celery-beat
    app.kubernetes.io/instance: mlops-paas-celery-beat
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/tier: jobs
    mlops.io/domain: control-plane
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mlops-paas-celery-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlops-paas-celery-beat
        app.kubernetes.io/instance: mlops-paas-celery-beat
        app.kubernetes.io/part-of: mlops-paas
        app.kubernetes.io/component: scheduler
        app.kubernetes.io/tier: jobs
        mlops.io/domain: control-plane
        app.kubernetes.io/managed-by: kustomize
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload-type: worker
      containers:
        - name: celery-beat
          image: mlops-paas-control-plane
          imagePullPolicy: IfNotPresent
          command: ["celery"]
          args: ["-A", "config", "beat", "--schedule=/tmp/celerybeat-schedule"]
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: config.settings.health
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: celery-worker-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: celery-worker-secret
                  key: DB_PASSWORD
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: celery-worker-secret
                  key: DJANGO_SECRET_KEY
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: celery-worker-secret
                  key: REDIS_PASSWORD
            - name: REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: celery-worker-secret
                  key: REDIS_SENTINEL_PASSWORD
          envFrom:
            - configMapRef:
                name: mlops-paas-control-plane-config
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-paas-control-plane
  labels:
    app.kubernetes.io/name: mlops-paas-control-plane
    app.kubernetes.io/instance: mlops-paas-control-plane
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: workload
    mlops-paas.io/domain: control-plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mlops-paas-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlops-paas-control-plane
        app.kubernetes.io/instance: mlops-paas-control-plane
        app.kubernetes.io/part-of: mlops-paas
        app.kubernetes.io/component: backend
        app.kubernetes.io/managed-by: kustomize
        mlops-paas.io/plane: workload
        mlops-paas.io/domain: control-plane
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        workload-type: worker
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mlops-paas-control-plane
      volumes:
        - name: staticfiles
          emptyDir: {}
      initContainers:
        - name: collect-static
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: mlops-paas-control-plane
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "collectstatic", "--noinput"]
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: DJANGO_SECRET_KEY
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: JWT_PRIVATE_KEY
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: JWT_PUBLIC_KEY
            - name: CONTROL_PLANE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: CONTROL_PLANE_WEBHOOK_SECRET
            - name: ARGO_EVENTS_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: ARGO_EVENTS_WEBHOOK_TOKEN
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: REDIS_PASSWORD
            - name: REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: REDIS_SENTINEL_PASSWORD
          envFrom:
            - configMapRef:
                name: mlops-paas-control-plane-config
          volumeMounts:
            - name: staticfiles
              mountPath: /app/staticfiles
      containers:
        - name: control-plane
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: mlops-paas-control-plane
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - "gunicorn config.wsgi:application --config python:common.gunicorn_conf --bind 0.0.0.0:8000 --workers 3 --timeout 120 --graceful-timeout 30"
          ports:
            - containerPort: 8000
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: DB_PASSWORD
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: DJANGO_SECRET_KEY
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: JWT_PRIVATE_KEY
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: JWT_PUBLIC_KEY
            - name: CONTROL_PLANE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: CONTROL_PLANE_WEBHOOK_SECRET
            - name: ARGO_EVENTS_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: ARGO_EVENTS_WEBHOOK_TOKEN
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: REDIS_PASSWORD
            - name: REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: REDIS_SENTINEL_PASSWORD
            - name: GOOGLE_OAUTH2_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: GOOGLE_OAUTH2_CLIENT_ID
            - name: GITHUB_OAUTH2_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: GITHUB_OAUTH2_CLIENT_ID
            - name: GITHUB_OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: GITHUB_OAUTH2_CLIENT_SECRET
            - name: EMAIL_HOST_USER
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: EMAIL_HOST_USER
            - name: EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: EMAIL_HOST_PASSWORD
            - name: HARBOR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: HARBOR_USERNAME
            - name: HARBOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: HARBOR_PASSWORD
          envFrom:
            - configMapRef:
                name: mlops-paas-control-plane-config
          volumeMounts:
            - name: staticfiles
              mountPath: /app/staticfiles
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 20

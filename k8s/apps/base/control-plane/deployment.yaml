apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-paas-control-plane
  labels:
    app: mlops-paas-control-plane
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: mlops-paas-control-plane
  template:
    metadata:
      labels:
        app: mlops-paas-control-plane
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload-type: worker
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - mlops-paas-control-plane
                topologyKey: "kubernetes.io/hostname"
      volumes:
        - name: staticfiles
          emptyDir: {}
      initContainers:
        - name: db-migrate
          image: mlops-paas-control-plane
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - "python manage.py migrate && python manage.py collectstatic --noinput"
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: control-plane-api-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: control-plane-api-secret
                  key: DB_PASSWORD
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: control-plane-api-secret
                  key: DJANGO_SECRET_KEY
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: control-plane-api-secret
                  key: JWT_PRIVATE_KEY
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: control-plane-api-secret
                  key: JWT_PUBLIC_KEY
            - name: CONTROL_PLANE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: control-plane-api-secret
                  key: CONTROL_PLANE_WEBHOOK_SECRET
            - name: ARGO_EVENTS_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: control-plane-api-secret
                  key: ARGO_EVENTS_WEBHOOK_TOKEN
          envFrom:
            - configMapRef:
                name: mlops-paas-control-plane-config
          volumeMounts:
            - name: staticfiles
              mountPath: /app/staticfiles
      containers:
        - name: control-plane
          image: mlops-paas-control-plane
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - "gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --graceful-timeout 30 --access-logfile -"
          ports:
            - containerPort: 8000
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: control-plane-api-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: control-plane-api-secret
                  key: DB_PASSWORD
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: control-plane-api-secret
                  key: DJANGO_SECRET_KEY
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: control-plane-api-secret
                  key: JWT_PRIVATE_KEY
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: control-plane-api-secret
                  key: JWT_PUBLIC_KEY
            - name: CONTROL_PLANE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: control-plane-api-secret
                  key: CONTROL_PLANE_WEBHOOK_SECRET
            - name: ARGO_EVENTS_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: control-plane-api-secret
                  key: ARGO_EVENTS_WEBHOOK_TOKEN
            - name: GOOGLE_OAUTH2_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: control-plane-api-secret
                  key: GOOGLE_OAUTH2_CLIENT_ID
            - name: GITHUB_OAUTH2_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: control-plane-api-secret
                  key: GITHUB_OAUTH2_CLIENT_ID
            - name: GITHUB_OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: control-plane-api-secret
                  key: GITHUB_OAUTH2_CLIENT_SECRET
            - name: EMAIL_HOST_USER
              valueFrom:
                secretKeyRef:
                  name: control-plane-api-secret
                  key: EMAIL_HOST_USER
            - name: EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: control-plane-api-secret
                  key: EMAIL_HOST_PASSWORD
          envFrom:
            - configMapRef:
                name: mlops-paas-control-plane-config
          volumeMounts:
            - name: staticfiles
              mountPath: /app/staticfiles
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 20

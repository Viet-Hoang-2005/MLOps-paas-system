apiVersion: batch/v1
kind: Job
metadata:
  name: mlops-paas-control-plane-migration
  labels:
    app.kubernetes.io/name: mlops-paas-control-plane-migration
    app.kubernetes.io/instance: mlops-paas-control-plane
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: migration
    app.kubernetes.io/tier: backend
    mlops.io/domain: control-plane
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlops-paas-control-plane-migration
        app.kubernetes.io/instance: mlops-paas-control-plane
        app.kubernetes.io/part-of: mlops-paas
        app.kubernetes.io/component: migration
        app.kubernetes.io/tier: backend
        mlops.io/domain: control-plane
        app.kubernetes.io/managed-by: kustomize
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        workload-type: worker
      containers:
        - name: migrate
          image: mlops-paas-control-plane
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "migrate", "--noinput"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: DB_PASSWORD
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: DJANGO_SECRET_KEY
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: JWT_PRIVATE_KEY
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: JWT_PUBLIC_KEY
            - name: CONTROL_PLANE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: CONTROL_PLANE_WEBHOOK_SECRET
            - name: ARGO_EVENTS_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: ARGO_EVENTS_WEBHOOK_TOKEN
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: REDIS_PASSWORD
            - name: REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-control-plane-secret
                  key: REDIS_SENTINEL_PASSWORD
          envFrom:
            - configMapRef:
                name: mlops-paas-control-plane-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi


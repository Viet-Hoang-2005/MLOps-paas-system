apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-paas-celery-beat
  labels:
    app: mlops-paas-celery-beat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mlops-paas-celery-beat
  template:
    metadata:
      labels:
        app: mlops-paas-celery-beat
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload-type: worker
      containers:
        - name: celery-beat
          image: mlops-paas-control-plane
          imagePullPolicy: IfNotPresent
          command: ["celery"]
          args: ["-A", "config", "beat", "--schedule=/tmp/celerybeat-schedule"]
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: config.settings.health
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: celery-worker-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: celery-worker-secret
                  key: DB_PASSWORD
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: celery-worker-secret
                  key: DJANGO_SECRET_KEY
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: celery-worker-secret
                  key: REDIS_PASSWORD
            - name: REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: celery-worker-secret
                  key: REDIS_SENTINEL_PASSWORD
          envFrom:
            - configMapRef:
                name: mlops-paas-control-plane-config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-paas-celery-health-worker
  labels:
    app: mlops-paas-celery-health-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlops-paas-celery-health-worker
  template:
    metadata:
      labels:
        app: mlops-paas-celery-health-worker
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload-type: worker
      containers:
        - name: celery-health-worker
          image: mlops-paas-control-plane
          imagePullPolicy: IfNotPresent
          command: ["celery"]
          args: ["-A", "config", "worker", "-Q", "runtime-health", "--concurrency=2"]
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: config.settings.health
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: celery-worker-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: celery-worker-secret
                  key: DB_PASSWORD
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: celery-worker-secret
                  key: DJANGO_SECRET_KEY
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: celery-worker-secret
                  key: REDIS_PASSWORD
            - name: REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: celery-worker-secret
                  key: REDIS_SENTINEL_PASSWORD
          envFrom:
            - configMapRef:
                name: mlops-paas-control-plane-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi

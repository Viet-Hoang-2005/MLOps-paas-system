apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mlops-paas-control-plane-monitor
  labels:
    app.kubernetes.io/name: mlops-paas-control-plane
    app.kubernetes.io/instance: mlops-paas-control-plane
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: workload
    mlops-paas.io/domain: control-plane
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - mlops-paas-core
  selector:
    matchLabels:
      app.kubernetes.io/name: mlops-paas-control-plane
  endpoints:
    - port: http
      path: /health/metrics
      interval: 15s
      scrapeTimeout: 10s


apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mlops-paas-model-server-hpa
  labels:
    app.kubernetes.io/name: mlops-paas-model-server
    app.kubernetes.io/instance: mlops-paas-model-server
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: gateway
    app.kubernetes.io/tier: gateway
    mlops.io/domain: serving
    app.kubernetes.io/managed-by: kustomize
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mlops-paas-model-server
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75


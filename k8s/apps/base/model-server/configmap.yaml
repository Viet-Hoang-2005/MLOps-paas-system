apiVersion: v1
kind: ConfigMap
metadata:
  name: mlops-paas-model-server-config
  labels:
    app.kubernetes.io/name: mlops-paas-model-server
    app.kubernetes.io/instance: mlops-paas-model-server
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: gateway
    app.kubernetes.io/tier: gateway
    mlops.io/domain: serving
    app.kubernetes.io/managed-by: kustomize
data:
  LOG_FORMAT: "console"
  LOG_SUMMARY_INTERVAL_SECONDS: "60"
  DB_HOST_RO: "postgresql-ro.mlops-paas-data.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "mlops_paas_db"
  CONTROL_PLANE_DB_SCHEMA: "control_plane"
  JWKS_URL: "http://mlops-paas-control-plane.mlops-paas-core.svc.cluster.local:8000/api/auth/.well-known/jwks.json"
  REDPANDA_BROKERS: "redpanda.mlops-paas-data.svc.cluster.local:9092"
  KAFKA_TOPIC: "mlops_paas_production_data"
  REDIS_CONNECTION_MODE: "sentinel"
  REDIS_SENTINEL_MASTER_NAME: "redis-master"
  REDIS_SENTINEL_HOSTS: "redis-ha-sentinel-0.redis-ha-sentinel-headless.mlops-paas-data.svc.cluster.local:26379,redis-ha-sentinel-1.redis-ha-sentinel-headless.mlops-paas-data.svc.cluster.local:26379,redis-ha-sentinel-2.redis-ha-sentinel-headless.mlops-paas-data.svc.cluster.local:26379"
  MODEL_RUNTIME_NAMESPACE: "mlops-paas-serving"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-paas-model-server
  labels:
    app: mlops-paas-model-server
    component: model-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mlops-paas-model-server
  template:
    metadata:
      labels:
        app: mlops-paas-model-server
        component: model-gateway
    spec:
      volumes:
        - name: prometheus-multiprocess
          emptyDir: {}
      nodeSelector:
        workload-type: worker
      containers:
        - name: model-server
          image: mlops-paas-model-server
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /var/run/model-server-metrics
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: model-server-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: model-server-secret
                  key: DB_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: model-server-secret
                  key: REDIS_PASSWORD
            - name: REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: model-server-secret
                  key: REDIS_SENTINEL_PASSWORD
          envFrom:
            - configMapRef:
                name: mlops-paas-model-server-config
          volumeMounts:
            - name: prometheus-multiprocess
              mountPath: /var/run/model-server-metrics
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-paas-model-server
  labels:
    app.kubernetes.io/name: mlops-paas-model-server
    app.kubernetes.io/instance: mlops-paas-model-server
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: gateway
    app.kubernetes.io/tier: gateway
    mlops.io/domain: serving
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mlops-paas-model-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlops-paas-model-server
        app.kubernetes.io/instance: mlops-paas-model-server
        app.kubernetes.io/part-of: mlops-paas
        app.kubernetes.io/component: gateway
        app.kubernetes.io/tier: gateway
        mlops.io/domain: serving
        app.kubernetes.io/managed-by: kustomize
    spec:
      volumes:
        - name: prometheus-multiprocess
          emptyDir: {}
      nodeSelector:
        workload-type: worker
      containers:
        - name: model-server
          image: mlops-paas-model-server
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /var/run/model-server-metrics
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-model-server-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-model-server-secret
                  key: DB_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-model-server-secret
                  key: REDIS_PASSWORD
            - name: REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-model-server-secret
                  key: REDIS_SENTINEL_PASSWORD
          envFrom:
            - configMapRef:
                name: mlops-paas-model-server-config
          volumeMounts:
            - name: prometheus-multiprocess
              mountPath: /var/run/model-server-metrics
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi

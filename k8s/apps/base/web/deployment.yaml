apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-paas-web
  labels:
    app.kubernetes.io/name: mlops-paas-web
    app.kubernetes.io/instance: mlops-paas-web
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: frontend
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: workload
    mlops-paas.io/domain: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlops-paas-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlops-paas-web
        app.kubernetes.io/instance: mlops-paas-web
        app.kubernetes.io/part-of: mlops-paas
        app.kubernetes.io/component: frontend
        app.kubernetes.io/managed-by: kustomize
        mlops-paas.io/plane: workload
        mlops-paas.io/domain: frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        workload-type: worker
      containers:
        - name: web
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
                - CHOWN
                - SETGID
                - SETUID
          image: mlops-paas-web
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mlops-paas-core

resources:
  - ../../../base/control-plane
  - external-secrets.yaml

images:
  - name: mlops-paas-control-plane
    newName: registry.mlops-nids-nt114.id.vn/mlops-paas/mlops-paas-control-plane
    newTag: 09998848067dd8853133854b656240dee431988d


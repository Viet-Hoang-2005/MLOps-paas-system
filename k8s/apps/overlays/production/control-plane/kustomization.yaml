      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: mlops-paas-control-plane-config
        annotations:
          argocd.argoproj.io/sync-wave: "-1"
  - target:
      kind: Job
      name: mlops-paas-control-plane-migration

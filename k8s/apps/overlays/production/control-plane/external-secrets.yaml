apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: control-plane-api-secret-sync
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: "1h"
  secretStoreRef: {name: aws-secrets-manager, kind: ClusterSecretStore}
  target:
    name: control-plane-api-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - {secretKey: DB_USER, remoteRef: {key: mlops/production-secrets, property: DB_USER, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None, nullBytePolicy: Ignore}}
    - {secretKey: DB_PASSWORD, remoteRef: {key: mlops/production-secrets, property: DB_PASSWORD, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None, nullBytePolicy: Ignore}}
    - {secretKey: REDIS_PASSWORD, remoteRef: {key: mlops/production-secrets, property: REDIS_PASSWORD}}
    - {secretKey: REDIS_SENTINEL_PASSWORD, remoteRef: {key: mlops/production-secrets, property: REDIS_SENTINEL_PASSWORD}}
    - {secretKey: DJANGO_SECRET_KEY, remoteRef: {key: mlops/production-secrets, property: DJANGO_SECRET_KEY, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None, nullBytePolicy: Ignore}}
    - {secretKey: JWT_PRIVATE_KEY, remoteRef: {key: mlops/production-secrets, property: JWT_PRIVATE_KEY, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None, nullBytePolicy: Ignore}}
    - {secretKey: JWT_PUBLIC_KEY, remoteRef: {key: mlops/production-secrets, property: JWT_PUBLIC_KEY, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None, nullBytePolicy: Ignore}}
    - {secretKey: CONTROL_PLANE_WEBHOOK_SECRET, remoteRef: {key: mlops/production-secrets, property: CONTROL_PLANE_WEBHOOK_SECRET, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None, nullBytePolicy: Ignore}}
    - {secretKey: ARGO_EVENTS_WEBHOOK_TOKEN, remoteRef: {key: mlops/production-secrets, property: ARGO_EVENTS_WEBHOOK_TOKEN, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None, nullBytePolicy: Ignore}}
    - {secretKey: GOOGLE_OAUTH2_CLIENT_ID, remoteRef: {key: mlops/production-secrets, property: GOOGLE_OAUTH2_CLIENT_ID, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None, nullBytePolicy: Ignore}}
    - {secretKey: GITHUB_OAUTH2_CLIENT_ID, remoteRef: {key: mlops/production-secrets, property: GITHUB_OAUTH2_CLIENT_ID, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None, nullBytePolicy: Ignore}}
    - {secretKey: GITHUB_OAUTH2_CLIENT_SECRET, remoteRef: {key: mlops/production-secrets, property: GITHUB_OAUTH2_CLIENT_SECRET, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None, nullBytePolicy: Ignore}}
    - {secretKey: EMAIL_HOST_USER, remoteRef: {key: mlops/production-secrets, property: EMAIL_HOST_USER, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None, nullBytePolicy: Ignore}}
    - {secretKey: EMAIL_HOST_PASSWORD, remoteRef: {key: mlops/production-secrets, property: EMAIL_HOST_PASSWORD, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None, nullBytePolicy: Ignore}}
    - {secretKey: HARBOR_USERNAME, remoteRef: {key: mlops/production-secrets, property: HARBOR_USERNAME, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None, nullBytePolicy: Ignore}}
    - {secretKey: HARBOR_PASSWORD, remoteRef: {key: mlops/production-secrets, property: HARBOR_PASSWORD, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None, nullBytePolicy: Ignore}}
---

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlops-paas-consumer-secret-sync
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: mlops-paas-consumer
    app.kubernetes.io/instance: mlops-paas-consumer
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: worker
    app.kubernetes.io/tier: app
    mlops.io/domain: streaming
    app.kubernetes.io/managed-by: kustomize
spec:
  refreshInterval: "1h"
  secretStoreRef: {name: aws-secrets-manager, kind: ClusterSecretStore}
  target:
    name: mlops-paas-consumer-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - {secretKey: DB_USER, remoteRef: {key: mlops/production-secrets, property: DB_USER, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None, nullBytePolicy: Ignore}}
    - {secretKey: DB_PASSWORD, remoteRef: {key: mlops/production-secrets, property: DB_PASSWORD, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None, nullBytePolicy: Ignore}}
    - {secretKey: CONTROL_PLANE_WEBHOOK_SECRET, remoteRef: {key: mlops/production-secrets, property: CONTROL_PLANE_WEBHOOK_SECRET, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None, nullBytePolicy: Ignore}}

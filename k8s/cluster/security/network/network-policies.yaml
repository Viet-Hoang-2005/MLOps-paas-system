# 1. Bảo vệ Database PostgreSQL (Namespace: mlops-paas-data)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-postgresql
  namespace: mlops-paas-data
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: database
    app.kubernetes.io/tier: data
    mlops.io/domain: storage
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgresql
  policyTypes:
    - Ingress
  ingress:
    # 1.1. Nội bộ các Pod Postgres đồng bộ Replication (cùng namespace)
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgresql
    # 1.2. CloudNativePG Operator quản lý cluster
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
    # 1.3. Core platform workloads (Control Plane, Consumer, Model Server) truy cập DB (cổng 5432)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlops-paas-core
      ports:
        - protocol: TCP
          port: 5432
    # 1.4. Prometheus cào metrics (cổng 9187)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9187

---
# 2. Bảo vệ Redis & Sentinel (Namespace: mlops-paas-data)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-redis-ha
  namespace: mlops-paas-data
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: cache
    app.kubernetes.io/tier: data
    mlops.io/domain: cache
spec:
  podSelector:
    matchLabels:
      app: redis-ha
  policyTypes:
    - Ingress
  ingress:
    # 2.1. Nội bộ Redis & Sentinel giao tiếp với nhau
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 26379
    # 2.2. Core platform workloads (Control Plane & Model Server) truy cập Redis & Sentinel
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlops-paas-core
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 26379
    # 2.3. Prometheus cào metrics exporter (cổng 9121)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9121

---
# 3. Bảo vệ message queue Redpanda Kafka (Namespace: mlops-paas-data)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-redpanda
  namespace: mlops-paas-data
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: message-broker
    app.kubernetes.io/tier: data
    mlops.io/domain: messaging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  policyTypes:
    - Ingress
  ingress:
    # 3.1. Nội bộ Redpanda
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redpanda
    # 3.2. Core apps (Model Server, Consumer) & Execution engine (Argo Workflows) đẩy/tiêu thụ data
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlops-paas-core
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlops-paas-execution
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 19092
    # 3.3. Prometheus cào metrics admin (cổng 9644)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9644

---
# 4. Bảo vệ Django Control Plane (Namespace: mlops-paas-core)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-mlops-paas-control-plane
  namespace: mlops-paas-core
  labels:
    app.kubernetes.io/name: mlops-paas-control-plane
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: backend
    app.kubernetes.io/tier: app
    mlops.io/domain: control-plane
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mlops-paas-control-plane
  policyTypes:
    - Ingress
  ingress:
    # 4.1. Traefik Ingress nhận traffic bên ngoài vào API
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8000
    # 4.2. Consumer và Workflows gọi Webhook đồng bộ trạng thái
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mlops-paas-consumer
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlops-paas-execution
      ports:
        - protocol: TCP
          port: 8000
    # 4.3. Prometheus cào metrics
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000

---
# 5. Bảo vệ Frontend Web (Namespace: mlops-paas-core)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-mlops-paas-web
  namespace: mlops-paas-core
  labels:
    app.kubernetes.io/name: mlops-paas-web
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: frontend
    app.kubernetes.io/tier: frontend
    mlops.io/domain: frontend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mlops-paas-web
  policyTypes:
    - Ingress
  ingress:
    # 5.1. Traefik Ingress (từ kube-system)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 80
    # 5.2. Cloudflare Tunnel (từ namespace mlops-paas-routing)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlops-paas-routing
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
      ports:
        - protocol: TCP
          port: 80

---
# 6. Bảo vệ Model Server Gateway (Namespace: mlops-paas-core)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-mlops-paas-model-server
  namespace: mlops-paas-core
  labels:
    app.kubernetes.io/name: mlops-paas-model-server
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: gateway
    app.kubernetes.io/tier: gateway
    mlops.io/domain: serving
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mlops-paas-model-server
  policyTypes:
    - Ingress
  ingress:
    # 6.1. Traefik Ingress chuyển tiếp traffic suy luận (/predict, /feedback)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 5000
    # 6.2. Control Plane gọi test model (cùng namespace mlops-paas-core)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mlops-paas-control-plane
      ports:
        - protocol: TCP
          port: 5000
    # 6.3. Prometheus cào metrics
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 5000

---
# 7. Khóa hoàn toàn ingress của Consumer (Namespace: mlops-paas-core)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-mlops-paas-consumer
  namespace: mlops-paas-core
  labels:
    app.kubernetes.io/name: mlops-paas-consumer
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: worker
    app.kubernetes.io/tier: app
    mlops.io/domain: streaming
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mlops-paas-consumer
  policyTypes:
    - Ingress
  # ingress: [] (để trống đồng nghĩa chặn 100% kết nối đến nó, chỉ cho phép nó gọi ra ngoài)
# pod-disruption-budgets.yaml: Bảo vệ các service khỏi downtime khi bảo trì node (kubectl drain / rolling update)

# NHÓM 1: CÁC DỊCH VỤ HIGH AVAILABILITY (2 REPLICAS)
# 1. PDB cho Django Control Plane API
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mlops-paas-control-plane-pdb
  namespace: mlops-paas-core
  labels:
    app.kubernetes.io/name: mlops-paas-control-plane
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: backend
    app.kubernetes.io/tier: app
    mlops.io/domain: control-plane
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlops-paas-control-plane

# 2. PDB cho Celery Worker (Xử lý tác vụ nền & MLOps Pipelines)
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mlops-paas-celery-worker-pdb
  namespace: mlops-paas-core
  labels:
    app.kubernetes.io/name: mlops-paas-celery-worker
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: worker
    app.kubernetes.io/tier: jobs
    mlops.io/domain: control-plane
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlops-paas-celery-worker

# 3. PDB cho Model Server Gateway (Phục vụ suy luận thời gian thực)

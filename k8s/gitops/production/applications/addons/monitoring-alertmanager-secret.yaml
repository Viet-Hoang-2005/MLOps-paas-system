apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-control-plane-webhook-sync
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-41"
  labels:
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: monitoring
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: alertmanager-control-plane-webhook
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: CONTROL_PLANE_WEBHOOK_SECRET
      remoteRef:
        key: mlops/production-secrets
        property: CONTROL_PLANE_WEBHOOK_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

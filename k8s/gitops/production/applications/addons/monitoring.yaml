apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-prod-addon-monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
  labels:
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: monitoring
    mlops-paas.io/plane: addon
spec:
  project: mlops-addons
  info:
    - name: Owner
      value: Platform Engineering
    - name: Source
      value: prometheus-community.github.io/helm-charts/kube-prometheus-stack@93.1.1
    - name: Runbook
      value: https://github.com/Viet-Hoang-2005/MLOps-paas-system/blob/main/k8s/README.md#addons
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 93.1.1
    helm:
      releaseName: monitoring
      values: |
        prometheus:
          prometheusSpec:
            retention: 3d
            scrapeInterval: 30s
            nodeSelector:
              workload-type: worker
            resources:
              requests:
                cpu: 90m
                memory: 1Gi
              limits:
                cpu: 1000m
                memory: 2Gi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  resources:
                    requests:
                      storage: 10Gi
            podMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            ruleNamespaceSelector: {}
            podMonitorNamespaceSelector: {}
            serviceMonitorNamespaceSelector: {}
        grafana:
          sidecar:
            resources:
              requests: {cpu: 10m, memory: 128Mi}
              limits: {cpu: 200m, memory: 256Mi}
          resources:
            requests:
              cpu: 30m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          additionalDataSources:
            - name: Runtime logs
              type: loki
              uid: runtime-logs
              access: proxy
              url: http://loki.mlops-logging.svc.cluster.local:3100
              isDefault: false
          nodeSelector:
            workload-type: worker
          persistence:
            enabled: true
            storageClassName: local-path
            size: 5Gi
          service:
            type: ClusterIP
          grafana.ini:
            server:
              root_url: https://grafana.mlops-nids-nt114.id.vn
              serve_from_sub_path: false
        alertmanager:
          config:
            global:
              resolve_timeout: 5m
            route:
              group_by: ["alertname", "project_id", "severity"]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              receiver: control-plane-webhook
              routes:
                - receiver: "null"
                  matchers:
                    - alertname = "Watchdog"
            receivers:
              - name: "null"
              - name: control-plane-webhook
                webhook_configs:
                  - url: http://mlops-paas-control-plane.mlops-paas-core.svc.cluster.local:8000/internal/webhooks/alerts/
                    send_resolved: true
                    http_config:
                      authorization:
                        type: Bearer
                        credentials_file: /etc/alertmanager/secrets/alertmanager-control-plane-webhook/CONTROL_PLANE_WEBHOOK_SECRET
          alertmanagerSpec:
            secrets:
              - alertmanager-control-plane-webhook
            nodeSelector:
              workload-type: worker
            resources:
              requests:
                cpu: 15m
                memory: 64Mi
              limits:
                cpu: 250m
                memory: 256Mi
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  resources:
                    requests:
                      storage: 2Gi
        prometheusOperator:
          prometheusConfigReloader:
            resources:
              requests: {cpu: 10m, memory: 32Mi}
              limits: {cpu: 100m, memory: 128Mi}
          nodeSelector:
            workload-type: worker
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          admissionWebhooks:
            enabled: false
          tls:
            enabled: false
        prometheus-node-exporter:
          namespaceOverride: monitoring-node-exporter
          resources:
            requests: {cpu: 15m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
        kube-state-metrics:
          metricLabelsAllowlist:
            - pods=[mlops-paas.io/deployment-id,mlops-paas.io/tenant-id,mlops-paas.io/project-id,mlops-paas.io/model-version-id,mlops-paas.io/training-job-id]
          nodeSelector:
            workload-type: worker
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-prod-addon-karpenter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-24"
  labels:
    app.kubernetes.io/part-of: mlops-paas
    mlops-paas.io/environment: production
    mlops-paas.io/plane: addon
    mlops-paas.io/component: karpenter
spec:
  project: mlops-addons
  info:
    - name: Owner
      value: Platform Engineering
    - name: Source
      value: public.ecr.aws/karpenter/karpenter@1.13.0
    - name: Runbook
      value: https://github.com/Viet-Hoang-2005/MLOps-paas-system/blob/main/k8s/README.md#addons
  source:
    repoURL: public.ecr.aws/karpenter
    chart: karpenter
    targetRevision: 1.13.0
    helm:
      releaseName: karpenter
      values: |
        replicas: 1
        nodeSelector:
          workload-type: worker
        settings:
          clusterName: mlops-paas-cluster
          clusterEndpoint: https://k3s-api.internal.mlops-nids-nt114.id.vn:6443
          interruptionQueue: mlops-paas-cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - PruneLast=true
      - FailOnSharedResource=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-prod-addon-aws-ebs-csi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-40"
  labels:
    app.kubernetes.io/name: aws-ebs-csi
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: aws-ebs-csi
    mlops-paas.io/plane: addon
spec:
  project: mlops-addons
  info:
    - name: Owner
      value: Platform Engineering
    - name: Source
      value: kubernetes-sigs.github.io/aws-ebs-csi-driver@2.40.1
    - name: Runbook
      value: https://github.com/Viet-Hoang-2005/MLOps-paas-system/blob/main/k8s/README.md#addons
  source:
    repoURL: https://kubernetes-sigs.github.io/aws-ebs-csi-driver
    chart: aws-ebs-csi-driver
    targetRevision: 2.40.1
    helm:
      releaseName: aws-ebs-csi-driver
      values: |
        controller:
          replicaCount: 1
          nodeSelector:
            workload-type: worker
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
        node:
          nodeSelector:
            workload-type: worker
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

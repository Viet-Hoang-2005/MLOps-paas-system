apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-prod-addon-kubeflow-training
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-24"
  labels:
    app.kubernetes.io/name: kubeflow-training
    app.kubernetes.io/managed-by: argocd
    mlops-paas.io/plane: addon
    mlops-paas.io/component: kubeflow-training
spec:
  project: mlops-addons
  info:
    - name: Owner
      value: Platform Engineering
    - name: Source
      value: k8s/addons/kubeflow-training
    - name: Runbook
      value: https://github.com/Viet-Hoang-2005/MLOps-paas-system/blob/main/k8s/README.md#addons
  source:
    repoURL: https://github.com/Viet-Hoang-2005/MLOps-paas-system.git
    targetRevision: main
    path: k8s/addons/kubeflow-training
  destination:
    server: https://kubernetes.default.svc
    namespace: kubeflow

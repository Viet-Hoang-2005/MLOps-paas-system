apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-prod-addon-argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-40"
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: argocd
    mlops-paas.io/plane: addon
spec:
  project: mlops-addons
  info:
    - name: Owner
      value: Platform Engineering
    - name: Source
      value: "argoproj.github.io/argo-helm/argo-cd@7.8.23 + $values/k8s/argocd/values.yaml"
    - name: Runbook
      value: https://github.com/Viet-Hoang-2005/MLOps-paas-system/blob/main/k8s/README.md#addons
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 7.8.23
      helm:
        releaseName: argocd
        valueFiles:
          - $values/k8s/argocd/values.yaml
    - repoURL: https://github.com/Viet-Hoang-2005/MLOps-paas-system.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-prod-addon-monitoring-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-28"
  labels:
    app.kubernetes.io/name: monitoring-secrets
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: monitoring
    mlops-paas.io/plane: addon
spec:
  project: mlops-addons
  source:
    repoURL: https://github.com/Viet-Hoang-2005/MLOps-paas-system.git
    targetRevision: main
    path: k8s/platform/observability/monitoring-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /metadata/annotations/force-sync

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-prod-platform-mlflow
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    mlops-paas.io/plane: platform
    mlops-paas.io/component: mlflow
spec:
  project: mlops-platform
  info:
    - name: Owner
      value: Platform Engineering
    - name: Source
      value: k8s/platform/mlflow
    - name: Runbook
      value: https://github.com/Viet-Hoang-2005/MLOps-paas-system/blob/main/k8s/README.md#mlflow
  source:
    repoURL: https://github.com/Viet-Hoang-2005/MLOps-paas-system.git
    targetRevision: main
    path: k8s/platform/mlflow
  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow-server
  # ESO remoteRef defaults are declared in the manifests instead of ignored here:
  # RespectIgnoreDifferences copies live values of ignored paths into the target,
  # and for a .spec.data[] path that replaces the whole array, dropping new keys.
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /metadata/annotations/force-sync

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-prod-platform-redpanda
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    mlops-paas.io/plane: platform
    mlops-paas.io/component: redpanda
spec:
  project: mlops-platform
  info:
    - name: Owner
      value: Platform Engineering
    - name: Source
      value: k8s/platform/redpanda
    - name: Runbook
      value: https://github.com/Viet-Hoang-2005/MLOps-paas-system/blob/main/k8s/README.md#redpanda
  source:
    repoURL: https://github.com/Viet-Hoang-2005/MLOps-paas-system.git
    targetRevision: main
    path: k8s/platform/redpanda
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops-redpanda
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: redpanda
      namespace: mlops-redpanda
      jsonPointers:
        - /spec/persistentVolumeClaimRetentionPolicy
        - /spec/podManagementPolicy
        - /spec/revisionHistoryLimit
        - /spec/template/spec/dnsPolicy
        - /spec/template/spec/restartPolicy
        - /spec/template/spec/schedulerName
        - /spec/template/spec/securityContext
        - /spec/template/spec/terminationGracePeriodSeconds
        - /spec/template/spec/containers/0/imagePullPolicy
        - /spec/template/spec/containers/0/terminationMessagePath
        - /spec/template/spec/containers/0/terminationMessagePolicy
        - /spec/template/spec/containers/0/ports/0/protocol
        - /spec/template/spec/containers/0/ports/1/protocol
        - /spec/template/spec/containers/0/ports/2/protocol
        - /spec/updateStrategy
        - /spec/volumeClaimTemplates/0/apiVersion
        - /spec/volumeClaimTemplates/0/kind
        - /spec/volumeClaimTemplates/0/spec/volumeMode

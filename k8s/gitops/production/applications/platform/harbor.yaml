apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-prod-platform-harbor
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: harbor
    mlops-paas.io/plane: platform
spec:
  project: mlops-platform
  info:
    - name: Owner
      value: Platform Engineering
    - name: Source
      value: k8s/platform/harbor
    - name: Runbook
      value: https://github.com/Viet-Hoang-2005/MLOps-paas-system/blob/main/k8s/README.md#harbor
  source:
    repoURL: https://github.com/Viet-Hoang-2005/MLOps-paas-system.git
    targetRevision: main
    path: k8s/platform/harbor
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops-paas-harbor
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: harbor-database
      namespace: mlops-paas-harbor
      jsonPointers:
        - /spec/persistentVolumeClaimRetentionPolicy
        - /spec/podManagementPolicy
        - /spec/revisionHistoryLimit
        - /spec/template/spec/containers/0/livenessProbe/failureThreshold
        - /spec/template/spec/containers/0/livenessProbe/successThreshold
        - /spec/template/spec/containers/0/readinessProbe/failureThreshold
        - /spec/template/spec/containers/0/readinessProbe/successThreshold
        - /spec/template/spec/containers/0/resources
        - /spec/template/spec/containers/0/terminationMessagePath
        - /spec/template/spec/containers/0/terminationMessagePolicy
        - /spec/template/spec/containers/0/volumeMounts/0/subPath
        - /spec/template/spec/dnsPolicy
        - /spec/template/spec/initContainers/0/resources
        - /spec/template/spec/initContainers/0/terminationMessagePath
        - /spec/template/spec/initContainers/0/terminationMessagePolicy
        - /spec/template/spec/initContainers/0/volumeMounts/0/subPath
        - /spec/template/spec/restartPolicy
        - /spec/template/spec/schedulerName
        - /spec/updateStrategy
        - /spec/volumeClaimTemplates/0/apiVersion
        - /spec/volumeClaimTemplates/0/kind
        - /spec/volumeClaimTemplates/0/metadata/annotations
        - /spec/volumeClaimTemplates/0/spec/volumeMode
        - /spec/volumeClaimTemplates/0/status
    - group: apps
      kind: StatefulSet
      name: harbor-redis
      namespace: mlops-paas-harbor
      jsonPointers:
        - /spec/persistentVolumeClaimRetentionPolicy
        - /spec/podManagementPolicy
        - /spec/revisionHistoryLimit
        - /spec/template/spec/containers/0/livenessProbe/failureThreshold
        - /spec/template/spec/containers/0/livenessProbe/successThreshold
        - /spec/template/spec/containers/0/livenessProbe/timeoutSeconds
        - /spec/template/spec/containers/0/readinessProbe/failureThreshold
        - /spec/template/spec/containers/0/readinessProbe/successThreshold
        - /spec/template/spec/containers/0/readinessProbe/timeoutSeconds
        - /spec/template/spec/containers/0/resources
        - /spec/template/spec/containers/0/terminationMessagePath
        - /spec/template/spec/containers/0/terminationMessagePolicy
        - /spec/template/spec/containers/0/volumeMounts/0/subPath
        - /spec/template/spec/dnsPolicy
        - /spec/template/spec/restartPolicy
        - /spec/template/spec/schedulerName
        - /spec/updateStrategy
        - /spec/volumeClaimTemplates/0/apiVersion
        - /spec/volumeClaimTemplates/0/kind
        - /spec/volumeClaimTemplates/0/metadata/annotations
        - /spec/volumeClaimTemplates/0/spec/volumeMode
        - /spec/volumeClaimTemplates/0/status
    # The chart regenerates these secrets on every render; keep the first values to avoid restart loops.
    - kind: Secret
      name: harbor-core
      namespace: mlops-paas-harbor
      jsonPointers:
        - /data
    - kind: Secret
      name: harbor-jobservice
      namespace: mlops-paas-harbor
      jsonPointers:
        - /data
    - kind: Secret
      name: harbor-registry
      namespace: mlops-paas-harbor
      jsonPointers:
        - /data
    - kind: Secret
      name: harbor-registry-htpasswd
      namespace: mlops-paas-harbor
      jsonPointers:
        - /data
    - kind: Secret
      name: harbor-registryctl
      namespace: mlops-paas-harbor
      jsonPointers:
        - /data
    - group: apps
      kind: Deployment
      name: harbor-core
      namespace: mlops-paas-harbor
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
        - /spec/template/metadata/annotations/checksum~1secret-jobservice
    - group: apps
      kind: Deployment
      name: harbor-jobservice
      namespace: mlops-paas-harbor
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
        - /spec/template/metadata/annotations/checksum~1secret-core
    - group: apps
      kind: Deployment
      name: harbor-registry
      namespace: mlops-paas-harbor
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
        - /spec/template/metadata/annotations/checksum~1secret-core
        - /spec/template/metadata/annotations/checksum~1secret-jobservice

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-prod-platform-routing
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: routing
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: routing
    mlops-paas.io/plane: platform
spec:
  project: mlops-platform
  info:
    - name: Owner
      value: Platform Engineering
    - name: Source
      value: k8s/platform/routing
    - name: Runbook
      value: https://github.com/Viet-Hoang-2005/MLOps-paas-system/blob/main/k8s/README.md#cloudflare-and-routing
  source:
    repoURL: https://github.com/Viet-Hoang-2005/MLOps-paas-system.git
    targetRevision: main
    path: k8s/platform/routing
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops-paas-routing

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-prod-workload-web
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
  labels:
    mlops-paas.io/plane: workload
    mlops-paas.io/component: web
spec:
  project: mlops-workloads
  info:
    - name: Owner
      value: Application Engineering
    - name: Source
      value: k8s/apps/overlays/production/web
    - name: Runbook
      value: https://github.com/Viet-Hoang-2005/MLOps-paas-system/blob/main/k8s/README.md#workloads
  source:
    repoURL: https://github.com/Viet-Hoang-2005/MLOps-paas-system.git
    targetRevision: main
    path: k8s/apps/overlays/production/web
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops-web

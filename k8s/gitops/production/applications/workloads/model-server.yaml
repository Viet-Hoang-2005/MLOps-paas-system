apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-prod-workload-model-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
  labels:
    mlops-paas.io/plane: workload
    mlops-paas.io/component: model-server
spec:
  project: mlops-workloads
  info:
    - name: Owner
      value: Application Engineering
    - name: Source
      value: k8s/apps/overlays/production/model-server
    - name: Runbook
      value: https://github.com/Viet-Hoang-2005/MLOps-paas-system/blob/main/k8s/README.md#workloads
  source:
    repoURL: https://github.com/Viet-Hoang-2005/MLOps-paas-system.git
    targetRevision: main
    path: k8s/apps/overlays/production/model-server
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops-paas-core
  # ESO remoteRef defaults are declared in the manifests instead of ignored here:
  # RespectIgnoreDifferences copies live values of ignored paths into the target,
  # and for a .spec.data[] path that replaces the whole array, dropping new keys.
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /metadata/annotations/force-sync
    # Owned by mlops-paas-model-server-hpa; self-heal would otherwise reset it and
    # restart the scale-up/scale-down cycle.
    - group: apps
      kind: Deployment
      name: mlops-paas-model-server
      jsonPointers:
        - /spec/replicas

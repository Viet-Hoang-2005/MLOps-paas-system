apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-prod-execution-argo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    mlops-paas.io/plane: execution
    mlops-paas.io/component: argo
spec:
  project: mlops-execution
  info:
    - name: Owner
      value: Platform Engineering
    - name: Source
      value: k8s/argo
    - name: Runbook
      value: https://github.com/Viet-Hoang-2005/MLOps-paas-system/blob/main/k8s/README.md#execution
  source:
    repoURL: https://github.com/Viet-Hoang-2005/MLOps-paas-system.git
    targetRevision: main
    path: k8s/argo
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops-execution
  # ESO remoteRef defaults are declared in the manifests instead of ignored here:
  # RespectIgnoreDifferences copies live values of ignored paths into the target,
  # and for a .spec.data[] path that replaces the whole array, dropping new keys.
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /metadata/annotations/force-sync

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-prod-cluster-image-verification
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-29"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  labels:
    app.kubernetes.io/name: image-verification
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: image-verification
    mlops-paas.io/plane: cluster
spec:
  project: mlops-cluster
  info:
    - name: Owner
      value: Platform Engineering
    - name: Source
      value: k8s/cluster/image
    - name: Runbook
      value: https://github.com/Viet-Hoang-2005/MLOps-paas-system/blob/main/k8s/README.md#image-verification
  source:
    repoURL: https://github.com/Viet-Hoang-2005/MLOps-paas-system.git
    targetRevision: main
    path: k8s/cluster/image
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  # ESO remoteRef defaults are declared in the manifests instead of ignored here:
  # RespectIgnoreDifferences copies live values of ignored paths into the target,
  # and for a .spec.data[] path that replaces the whole array, dropping new keys.
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /metadata/annotations/force-sync

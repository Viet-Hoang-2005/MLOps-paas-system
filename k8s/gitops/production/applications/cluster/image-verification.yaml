apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-prod-cluster-image-verification
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-29"
  labels:
    mlops-paas.io/plane: cluster
    mlops-paas.io/component: image-verification
spec:
  project: mlops-cluster
  info:
    - name: Owner
      value: Platform Engineering
    - name: Source
      value: k8s/cluster/policies/image-verification
    - name: Runbook
      value: https://github.com/Viet-Hoang-2005/MLOps-paas-system/blob/main/k8s/README.md#image-verification
  source:
    repoURL: https://github.com/Viet-Hoang-2005/MLOps-paas-system.git
    targetRevision: main
    path: k8s/cluster/policies/image-verification
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /metadata/annotations/force-sync
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.data[].remoteRef.nullBytePolicy

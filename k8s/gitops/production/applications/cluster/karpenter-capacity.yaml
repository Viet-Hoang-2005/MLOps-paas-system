apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-prod-cluster-karpenter-capacity
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-23"
  labels:
    app.kubernetes.io/part-of: mlops-paas
    mlops-paas.io/environment: production
    mlops-paas.io/plane: cluster
    mlops-paas.io/component: karpenter-capacity
spec:
  project: mlops-cluster
  info:
    - name: Owner
      value: Platform Engineering
    - name: Source
      value: k8s/cluster/capacity/karpenter
    - name: Runbook
      value: https://github.com/Viet-Hoang-2005/MLOps-paas-system/blob/main/k8s/README.md#cluster
  source:
    repoURL: https://github.com/Viet-Hoang-2005/MLOps-paas-system.git
    targetRevision: main
    path: k8s/cluster/capacity/karpenter
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - PruneLast=true
      - FailOnSharedResource=true

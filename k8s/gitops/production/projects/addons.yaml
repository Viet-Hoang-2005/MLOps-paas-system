apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mlops-addons
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: mlops-paas
    mlops-paas.io/environment: production
    mlops-paas.io/plane: addon
spec:
  description: Pinned upstream controllers, CRDs and drivers for the production K3s environment.
  sourceRepos:
    - https://github.com/Viet-Hoang-2005/MLOps-paas-system.git
    - https://github.com/kubeflow/trainer.git
    - https://kubernetes-sigs.github.io/aws-ebs-csi-driver
    - https://charts.external-secrets.io
    - https://cloudnative-pg.github.io/charts
    - https://kedacore.github.io/charts
    - https://argoproj.github.io/argo-helm
    - https://prometheus-community.github.io/helm-charts
    - https://kyverno.github.io/kyverno
    - public.ecr.aws/karpenter
    - registry.k8s.io/nfd/charts
    - https://helm.ngc.nvidia.com/nvidia
  destinations:
    - namespace: kubeflow
      server: https://kubernetes.default.svc
    - namespace: karpenter
      server: https://kubernetes.default.svc
    - namespace: kube-system
      server: https://kubernetes.default.svc
    - namespace: gpu-operator
      server: https://kubernetes.default.svc
    - namespace: external-secrets
      server: https://kubernetes.default.svc
    - namespace: cnpg-system
      server: https://kubernetes.default.svc
    - namespace: keda
      server: https://kubernetes.default.svc
    - namespace: argo
      server: https://kubernetes.default.svc
    - namespace: argo-events
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: kyverno
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  orphanedResources:
    warn: true

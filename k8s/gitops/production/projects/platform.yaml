apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mlops-platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: mlops-paas
    mlops-paas.io/environment: production
    mlops-paas.io/plane: platform
spec:
  description: Production shared data, registry, observability and edge services.
  sourceRepos:
    - https://github.com/Viet-Hoang-2005/MLOps-paas-system.git
  destinations:
    - namespace: mlops-postgres
      server: https://kubernetes.default.svc
    - namespace: mlops-redis
      server: https://kubernetes.default.svc
    - namespace: mlops-redpanda
      server: https://kubernetes.default.svc
    - namespace: mlops-routing
      server: https://kubernetes.default.svc
    - namespace: cloudflare
      server: https://kubernetes.default.svc
    - namespace: harbor
      server: https://kubernetes.default.svc
    - namespace: mlflow-server
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
  clusterResourceBlacklist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
    ignore:
      # Runtime/bootstrap resources generated by platform controllers.
      - group: ""
        kind: ConfigMap
        name: cnpg-default-monitoring
      - group: discovery.k8s.io
        kind: EndpointSlice
        name: kubernetes
      - group: rbac.authorization.k8s.io
        kind: Role
        name: argo-workflows-workflow
      - group: rbac.authorization.k8s.io
        kind: RoleBinding
        name: argo-workflows-workflow

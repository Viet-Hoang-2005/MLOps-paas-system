apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mlops-workloads
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: mlops-paas
    mlops-paas.io/environment: production
    mlops-paas.io/plane: workload
spec:
  description: Static production workloads in dedicated owner namespaces.
  sourceRepos:
    - https://github.com/Viet-Hoang-2005/MLOps-paas-system.git
  destinations:
    - namespace: mlops-control-plane
      server: https://kubernetes.default.svc
    - namespace: mlops-consumer
      server: https://kubernetes.default.svc
    - namespace: mlops-model-server
      server: https://kubernetes.default.svc
    - namespace: mlops-web
      server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: keda.sh
      kind: ScaledObject
    - group: external-secrets.io
      kind: ExternalSecret
  orphanedResources:
    warn: true
    ignore:
      # Generated by the CloudNativePG operator for PostgreSQL monitoring.
      - group: ""
        kind: ConfigMap
        name: cnpg-default-monitoring

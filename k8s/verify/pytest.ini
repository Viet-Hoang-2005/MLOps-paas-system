[pytest]
minversion = 8.0
addopts = -v -ra --tb=short
pythonpath = . ../..
testpaths = validate test
python_files = validate_*.py test_*.py
python_classes = Test* *Tests
python_functions = test_* validate_*
markers =
    validate: Static offline validation checks (no cluster required)
    cluster: Online verification tests against a live K3s cluster


apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-eventsource-sa
  namespace: argo-events
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-sensor-sa
  namespace: argo-events
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-sensor-workflow-submit
  namespace: mlops-paas-execution
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["create", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-sensor-workflow-submit
  namespace: mlops-paas-execution
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-sensor-workflow-submit
subjects:
  - kind: ServiceAccount
    name: argo-sensor-sa
    namespace: argo-events


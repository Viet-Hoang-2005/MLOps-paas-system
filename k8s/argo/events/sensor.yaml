apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: model-sensor
  namespace: argo-events
spec:
  template:
    serviceAccountName: argo-sensor-sa
    container:
      resources:
        requests:
          cpu: 15m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
  dependencies:
    - name: build-dep
      eventSourceName: webhook-eventsource
      eventName: build
      filters:
        data:
          - path: body.build_id
            type: string
            value: ['^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$']
          - path: body.project_id
            type: string
            value: ['^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$']
          - path: body.tenant_id
            type: string
            value: ['^T-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$']
          - path: body.image_repository
            type: string
            value: ['^registry\.mlops-nids-nt114\.id\.vn/user-images/image-[0-9a-f-]{36}$']
          - path: body.image_tag
            type: string
            value: ['^build-[0-9a-f-]{36}$']
          - path: body.task_type
            type: string
            value: ['^(BUILD|TEST_ZIP)$']
          - path: body.source_type
            type: string
            value: ['^(manual_upload|training_job)$']
          - path: body.control_plane_webhook_url
            type: string
            value: ['^http://mlops-paas-control-plane(:8000|\.mlops-paas-core\.svc\.cluster\.local:8000)/internal/webhooks/builds/[0-9a-f-]{36}/$']
        exprs:
          - expr: callback =~ build_id && image_repository =~ project_id && image_tag =~ build_id
            fields:
              - {name: callback, path: body.control_plane_webhook_url}
              - {name: build_id, path: body.build_id}
              - {name: project_id, path: body.project_id}
              - {name: image_repository, path: body.image_repository}
              - {name: image_tag, path: body.image_tag}
    - name: deploy-dep
      eventSourceName: webhook-eventsource
      eventName: deploy
      filters:
        data:
          - path: body.deployment_id
            type: string
            value: ['^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$']
          - path: body.control_plane_webhook_url
            type: string
            value: ['^http://mlops-paas-control-plane(:8000|\.mlops-paas-core\.svc\.cluster\.local:8000)/internal/webhooks/deployments/[0-9a-f-]{36}/$']
          - path: body.callback_token
            type: string
            value: ['^[0-9]{10}\.[0-9a-f]{64}$']
          - path: body.project_id
            type: string
            value: ['^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$']
          - path: body.model_version_id
            type: string
            value: ['^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$']
          - path: body.tenant_id
            type: string
            value: ['^T-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$']
          - path: body.image_name
            type: string
            value: ['^registry\.mlops-nids-nt114\.id\.vn/user-images/image-[0-9a-f-]{36}@sha256:[0-9a-f]{64}$']
          - path: body.container_name
            type: string
            value: ['^deploy-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$']
          - path: body.model_type
            type: string
            value: ['^(ml|dl)$']
          - path: body.target_port
            type: string
            value: ['^(5001|5002)$']
        exprs:
          - expr: image_name =~ project_id && callback =~ deployment_id && container_name == 'deploy-' + deployment_id
            fields:
              - {name: image_name, path: body.image_name}
              - {name: project_id, path: body.project_id}
              - {name: callback, path: body.control_plane_webhook_url}
              - {name: deployment_id, path: body.deployment_id}
              - {name: container_name, path: body.container_name}
    - name: drift-dep
      eventSourceName: webhook-eventsource
      eventName: drift
      filters:
        data:
          - path: body.job_id
            type: string
            value: ['^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$']
          - path: body.project_id
            type: string
            value: ['^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$']
          - path: body.model_version_id
            type: string
            value: ['^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$']
          - path: body.tenant_id
            type: string
            value: ['^T-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$']
          - path: body.control_plane_webhook_url
            type: string
            value: ['^http://mlops-paas-control-plane(:8000|\.mlops-paas-core\.svc\.cluster\.local:8000)/internal/webhooks/drift-runs/[0-9a-f-]{36}/$']
        exprs:
          - expr: callback =~ job_id
            fields:
              - {name: callback, path: body.control_plane_webhook_url}
              - {name: job_id, path: body.job_id}
    - name: train-dep
      eventSourceName: webhook-eventsource
      eventName: train
      filters:
        data:
          - path: body.input_contract
            type: string
            value: ['^(legacy|workspace)$']
          - path: body.runtime_config_url
            type: string
            value: ['^http://mlops-paas-control-plane(:8000|\.mlops-paas-core\.svc\.cluster\.local:8000)/internal/training-jobs/[0-9a-f-]{36}/runtime-config/$']
          - path: body.job_id
            type: string
            value: ['^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$']
          - path: body.project_id
            type: string
            value: ['^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})?$']
          - path: body.tenant_id
            type: string
            value: ['^T-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$']
          - path: body.job_name
            type: string
            value: ['^training-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$']
          - path: body.accelerator_type
            type: string
            value: ['^(none|gpu)$']
          - path: body.accelerator_model
            type: string
            value: ['^(|t4|a10g)$']
          - path: body.control_plane_webhook_url
            type: string
            value: ['^http://mlops-paas-control-plane(:8000|\.mlops-paas-core\.svc\.cluster\.local:8000)/internal/webhooks/training-jobs/[0-9a-f-]{36}/$']
        exprs:
          - expr: callback =~ job_id && job_name =~ job_id && runtime_config =~ job_id
            fields:
              - {name: callback, path: body.control_plane_webhook_url}
              - {name: job_name, path: body.job_name}
              - {name: job_id, path: body.job_id}
              - {name: runtime_config, path: body.runtime_config_url}
          - expr: max_runtime_seconds > 0 && max_runtime_seconds <= 86400
            fields:
              - {name: max_runtime_seconds, path: body.max_runtime_seconds}
          - expr: >-
              (vcpu == 1 && memory == 2048) ||
              (vcpu == 2 && memory == 4096) ||
              (vcpu == 4 && memory == 8192)
            fields:
              - name: vcpu
                path: body.vcpu
              - name: memory
                path: body.memory
          - expr: >-
              (accelerator_type == "none" && accelerator_count == 0 && accelerator_model == "") ||
              (accelerator_type == "gpu" && accelerator_count == 1 && (accelerator_model == "t4" || accelerator_model == "a10g"))
            fields:
              - name: accelerator_type
                path: body.accelerator_type
              - name: accelerator_count
                path: body.accelerator_count
              - name: accelerator_model
                path: body.accelerator_model
    - name: reconcile-dep
      eventSourceName: webhook-eventsource
      eventName: reconcile
      filters:
        data:
          - path: body.kind
            type: string
            value: ['^(build|training|drift|deployment)$']
          - path: body.resource_id
            type: string
            value: ['^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$']
          - path: body.project_id
            type: string
            value: ['^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})?$']
          - path: body.tenant_id
            type: string
            value: ['^T-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$']
          - path: body.callback_url
            type: string
            value: ['^http://mlops-paas-control-plane(:8000|\.mlops-paas-core\.svc\.cluster\.local:8000)/internal/executions/((training|drift|build|deployment)/[0-9a-f-]{36}/observations|(build|drift|deployment)/[0-9a-f-]{36}/stops)/$']
        exprs:
          - expr: callback =~ resource_id && callback =~ kind
            fields:
              - {name: callback, path: body.callback_url}
              - {name: resource_id, path: body.resource_id}
              - {name: kind, path: body.kind}
  triggers:
    - template:
        name: build-workflow-trigger
        conditions: "build-dep"
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: build-submission-
                namespace: mlops-paas-execution
              spec:
                workflowTemplateRef:
                  name: mlops-paas-job-submit-template
                ttlStrategy:
                  secondsAfterCompletion: 300
                podGC:
                  strategy: OnPodCompletion
                arguments:
                  parameters:
                    - {name: execution_kind, value: "build"}
                    - {name: execution_payload, value: ""}
          parameters:
            - src:
                dependencyName: build-dep
                dataTemplate: '{{ .Input.body | toJson }}'
              dest: spec.arguments.parameters.1.value

    - template:
        name: deploy-workflow-trigger
        conditions: "deploy-dep"
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: deploy-submission-
                namespace: mlops-paas-execution
              spec:
                workflowTemplateRef:
                  name: mlops-paas-job-submit-template
                ttlStrategy:
                  secondsAfterCompletion: 300
                podGC:
                  strategy: OnPodCompletion
                arguments:
                  parameters:
                    - {name: execution_kind, value: "deployment"}
                    - {name: execution_payload, value: ""}
          parameters:
            - src:
                dependencyName: deploy-dep
                dataTemplate: '{{ .Input.body | toJson }}'
              dest: spec.arguments.parameters.1.value

    - template:
        name: drift-workflow-trigger
        conditions: "drift-dep"
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: drift-operation-
                namespace: mlops-paas-execution
              spec:
                workflowTemplateRef:
                  name: mlops-paas-job-submit-template
                ttlStrategy:
                  secondsAfterCompletion: 300
                podGC:
                  strategy: OnPodCompletion
                arguments:
                  parameters:
                    - {name: execution_kind, value: "drift"}
                    - {name: execution_payload, value: ""}
          parameters:
            - src:
                dependencyName: drift-dep
                dataTemplate: '{{ .Input.body | toJson }}'
              dest: spec.arguments.parameters.1.value

    - template:
        name: train-workflow-trigger
        conditions: "train-dep"
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: training-operation-
                namespace: mlops-paas-execution
              spec:
                workflowTemplateRef:
                  name: mlops-paas-job-submit-template
                ttlStrategy:
                  secondsAfterCompletion: 300
                podGC:
                  strategy: OnPodCompletion
                arguments:
                  parameters:
                    - {name: execution_kind, value: "training"}
                    - {name: execution_payload, value: ""}
          parameters:
            - src:
                dependencyName: train-dep
                dataTemplate: '{{ .Input.body | toJson }}'
              dest: spec.arguments.parameters.1.value

    - template:
        name: reconcile-job-trigger
        conditions: "reconcile-dep"
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: reconcile-operation-
                namespace: mlops-paas-execution
              spec:
                workflowTemplateRef:
                  name: mlops-paas-job-reconcile-template
                ttlStrategy:
                  secondsAfterCompletion: 300
                podGC:
                  strategy: OnPodCompletion
                arguments:
                  parameters:
                    - {name: execution_payload, value: ""}
          parameters:
            - src:
                dependencyName: reconcile-dep
                dataTemplate: '{{ .Input.body | toJson }}'
              dest: spec.arguments.parameters.0.value

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-events-webhook-server-sync
  namespace: argo-events
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: argo-events
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: events
    mlops-paas.io/domain: events
    app.kubernetes.io/managed-by: kustomize
spec:
  refreshInterval: "1h"
  secretStoreRef: {name: aws-secrets-manager, kind: ClusterSecretStore}
  target:
    name: argo-events-webhook-server
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - {secretKey: token, remoteRef: {key: mlops/production-secrets, property: ARGO_EVENTS_WEBHOOK_TOKEN, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None, nullBytePolicy: Ignore}}

apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: mlops-paas-training-pipeline-template
  namespace: mlops-paas-execution
spec:
  serviceAccountName: argo-workflow-training-sa
  entrypoint: training-pipeline
  onExit: report-status
  podMetadata:
    labels:
      mlops-paas.io/training-job-id: '{{workflow.parameters.job_id}}'
  arguments:
    parameters:
    - name: job_id
      value: ''
  templates:
  - name: training-pipeline
    inputs:
      parameters:
      - name: job_id
      - name: project_id
      - name: tenant_id
      - name: job_name
      - name: vcpu
      - name: memory
      - name: accelerator_type
      - name: accelerator_count
      - name: accelerator_model
      - name: s3_source_uri
      - name: s3_training_data_uri
      - name: output_upload_url
      - name: output_upload_capability
      - name: entry_point
      - name: model_version
      - name: control_plane_webhook_url
      - name: reporter_capability
      - name: requirements_text
        value: ''
      - name: max_runtime_seconds
      - name: dispatch_timeout_seconds
        value: '1800'
      - name: input_contract
        value: legacy
      - name: runtime_config_url
        value: ''
      - name: runtime_config_capability
        value: ''
      - name: input_download_url
      - name: input_download_capability
      - name: mlflow_tracking_uri
        value: ''
      - name: mlflow_tracking_token
        value: ''
    steps:
    - - name: run-cpu-train-job
        template: cpu-train-job
        when: '''{{inputs.parameters.accelerator_type}}'' != ''gpu'' || {{inputs.parameters.accelerator_count}} == 0'
        arguments:
          parameters:
          - name: job_id
            value: '{{inputs.parameters.job_id}}'
          - name: project_id
            value: '{{inputs.parameters.project_id}}'
          - name: tenant_id
            value: '{{inputs.parameters.tenant_id}}'
          - name: job_name
            value: '{{inputs.parameters.job_name}}'
          - name: vcpu
            value: '{{inputs.parameters.vcpu}}'
          - name: memory
            value: '{{inputs.parameters.memory}}'
          - name: s3_source_uri
            value: '{{inputs.parameters.s3_source_uri}}'
          - name: s3_training_data_uri
            value: '{{inputs.parameters.s3_training_data_uri}}'
          - name: output_upload_url
            value: '{{inputs.parameters.output_upload_url}}'
          - name: output_upload_capability
            value: '{{inputs.parameters.output_upload_capability}}'
          - name: entry_point
            value: '{{inputs.parameters.entry_point}}'
          - name: model_version
            value: '{{inputs.parameters.model_version}}'
          - name: requirements_text
            value: '{{inputs.parameters.requirements_text}}'
          - name: max_runtime_seconds
            value: '{{inputs.parameters.max_runtime_seconds}}'
          - name: dispatch_timeout_seconds
            value: '{{inputs.parameters.dispatch_timeout_seconds}}'
          - name: input_contract
            value: '{{inputs.parameters.input_contract}}'
          - name: runtime_config_url
            value: '{{inputs.parameters.runtime_config_url}}'
          - name: runtime_config_capability
            value: '{{inputs.parameters.runtime_config_capability}}'
          - name: input_download_url
            value: '{{inputs.parameters.input_download_url}}'
          - name: input_download_capability
            value: '{{inputs.parameters.input_download_capability}}'
          - name: mlflow_tracking_uri
            value: '{{inputs.parameters.mlflow_tracking_uri}}'
          - name: mlflow_tracking_token
            value: '{{inputs.parameters.mlflow_tracking_token}}'
      - name: run-gpu-train-job
        template: gpu-train-job
        when: '''{{inputs.parameters.accelerator_type}}'' == ''gpu'' && {{inputs.parameters.accelerator_count}} > 0'
        arguments:
          parameters:
          - name: job_id
            value: '{{inputs.parameters.job_id}}'
          - name: project_id
            value: '{{inputs.parameters.project_id}}'
          - name: tenant_id
            value: '{{inputs.parameters.tenant_id}}'
          - name: job_name
            value: '{{inputs.parameters.job_name}}'
          - name: vcpu
            value: '{{inputs.parameters.vcpu}}'
          - name: memory
            value: '{{inputs.parameters.memory}}'
          - name: accelerator_count
            value: '{{inputs.parameters.accelerator_count}}'
          - name: accelerator_model
            value: '{{inputs.parameters.accelerator_model}}'
          - name: s3_source_uri
            value: '{{inputs.parameters.s3_source_uri}}'
          - name: s3_training_data_uri
            value: '{{inputs.parameters.s3_training_data_uri}}'
          - name: output_upload_url
            value: '{{inputs.parameters.output_upload_url}}'
          - name: output_upload_capability
            value: '{{inputs.parameters.output_upload_capability}}'
          - name: entry_point
            value: '{{inputs.parameters.entry_point}}'
          - name: model_version
            value: '{{inputs.parameters.model_version}}'
          - name: requirements_text
            value: '{{inputs.parameters.requirements_text}}'
          - name: max_runtime_seconds
            value: '{{inputs.parameters.max_runtime_seconds}}'
          - name: dispatch_timeout_seconds
            value: '{{inputs.parameters.dispatch_timeout_seconds}}'
          - name: input_contract
            value: '{{inputs.parameters.input_contract}}'
          - name: runtime_config_url
            value: '{{inputs.parameters.runtime_config_url}}'
          - name: runtime_config_capability
            value: '{{inputs.parameters.runtime_config_capability}}'
          - name: input_download_url
            value: '{{inputs.parameters.input_download_url}}'
          - name: input_download_capability
            value: '{{inputs.parameters.input_download_capability}}'
          - name: mlflow_tracking_uri
            value: '{{inputs.parameters.mlflow_tracking_uri}}'
          - name: mlflow_tracking_token
            value: '{{inputs.parameters.mlflow_tracking_token}}'
    - - name: wait-training
        template: wait-training
        arguments:
          parameters:
          - name: job_id
            value: '{{inputs.parameters.job_id}}'
          - name: project_id
            value: '{{inputs.parameters.project_id}}'
          - name: tenant_id
            value: '{{inputs.parameters.tenant_id}}'
  - name: cpu-train-job
    inputs:
      parameters:
      - name: job_id
      - name: project_id
      - name: tenant_id
      - name: job_name
      - name: vcpu
      - name: memory
      - name: s3_source_uri
      - name: s3_training_data_uri
      - name: output_upload_url
      - name: output_upload_capability
      - name: entry_point
      - name: model_version
      - name: requirements_text
      - name: max_runtime_seconds
      - name: dispatch_timeout_seconds
      - name: input_contract
        value: legacy
      - name: runtime_config_url
        value: ''
      - name: runtime_config_capability
        value: ''
      - name: input_download_url
      - name: input_download_capability
      - name: mlflow_tracking_uri
        value: ''
      - name: mlflow_tracking_token
        value: ''
    resource:
      action: create
      setOwnerReference: false
      manifest: |
        apiVersion: trainer.kubeflow.org/v1alpha1
        kind: TrainJob
        metadata:
          name: {{=toJson(inputs.parameters.job_name)}}
          namespace: mlops-paas-training
          labels:
            app.kubernetes.io/name: mlops-paas-training-runner
            app.kubernetes.io/instance: {{=toJson(inputs.parameters.job_name)}}
            app.kubernetes.io/part-of: mlops-paas
            app.kubernetes.io/component: training
            mlops-paas.io/domain: training
            app.kubernetes.io/managed-by: argo-workflows
            mlops-paas.io/training-job-id: {{=toJson(inputs.parameters.job_id)}}
            mlops-paas.io/project-id: {{=toJson(inputs.parameters.project_id)}}
            mlops-paas.io/tenant-id: {{=toJson(inputs.parameters.tenant_id)}}
        spec:
          runtimeRef:
            apiGroup: trainer.kubeflow.org
            kind: ClusterTrainingRuntime
            name: mlops-paas-single-node
          activeDeadlineSeconds: {{=asInt(inputs.parameters.max_runtime_seconds) + asInt(inputs.parameters.dispatch_timeout_seconds) + 60}}
          trainer:
            numNodes: 1
            resourcesPerNode:
              requests:
                cpu: "{{inputs.parameters.vcpu}}"
                memory: {{inputs.parameters.memory}}Mi
              limits:
                cpu: "{{inputs.parameters.vcpu}}"
                memory: {{inputs.parameters.memory}}Mi
            env:
            - name: INPUT_CONTRACT
              value: {{=toJson(inputs.parameters.input_contract)}}
            - name: RUNTIME_CONFIG_URL
              value: {{=toJson(inputs.parameters.runtime_config_url)}}
            - name: RUNTIME_CONFIG_CAPABILITY
              value: {{=toJson(inputs.parameters.runtime_config_capability)}}
            - name: S3_SOURCE_URI
              value: {{=toJson(inputs.parameters.s3_source_uri)}}
            - name: S3_TRAINING_DATA_URI
              value: {{=toJson(inputs.parameters.s3_training_data_uri)}}
            - name: S3_OUTPUT_UPLOAD_URL
              value: {{=toJson(inputs.parameters.output_upload_url)}}
            - name: S3_OUTPUT_UPLOAD_CAPABILITY
              value: {{=toJson(inputs.parameters.output_upload_capability)}}
            - name: REQUIREMENTS_TEXT
              value: {{=toJson(inputs.parameters.requirements_text)}}
            - name: TRAINING_JOB_ID
              value: {{=toJson(inputs.parameters.job_id)}}
            - name: TENANT_ID
              value: {{=toJson(inputs.parameters.tenant_id)}}
            - name: MAX_RUNTIME_SECONDS
              value: {{=toJson(inputs.parameters.max_runtime_seconds)}}
            - name: S3_INPUT_DOWNLOAD_URL
              value: {{=toJson(inputs.parameters.input_download_url)}}
            - name: S3_INPUT_DOWNLOAD_CAPABILITY
              value: {{=toJson(inputs.parameters.input_download_capability)}}
            - name: ENTRY_POINT
              value: {{=toJson(inputs.parameters.entry_point)}}
            - name: MODEL_VERSION
              value: {{=toJson(inputs.parameters.model_version)}}
            - name: MLFLOW_TRACKING_URI
              value: {{=toJson(inputs.parameters.mlflow_tracking_uri)}}
            - name: MLFLOW_TRACKING_TOKEN
              value: {{=toJson(inputs.parameters.mlflow_tracking_token)}}
          runtimePatches:
          - manager: mlops-paas.io/control-plane
            trainingRuntimeSpec:
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: mlops-paas-training-runner
                    app.kubernetes.io/instance: {{=toJson(inputs.parameters.job_name)}}
                    app.kubernetes.io/part-of: mlops-paas
                    app.kubernetes.io/component: training
                    mlops-paas.io/domain: training
                    app.kubernetes.io/managed-by: argo-workflows
                    mlops-paas.io/training-job-id: {{=toJson(inputs.parameters.job_id)}}
                    mlops-paas.io/project-id: {{=toJson(inputs.parameters.project_id)}}
                    mlops-paas.io/tenant-id: {{=toJson(inputs.parameters.tenant_id)}}
                spec:
                  replicatedJobs:
                  - name: node
                    template:
                      metadata:
                        labels:
                          app.kubernetes.io/name: mlops-paas-training-runner
                          app.kubernetes.io/instance: {{=toJson(inputs.parameters.job_name)}}
                          app.kubernetes.io/part-of: mlops-paas
                          app.kubernetes.io/component: training
                          mlops-paas.io/domain: training
                          app.kubernetes.io/managed-by: argo-workflows
                          mlops-paas.io/training-job-id: {{=toJson(inputs.parameters.job_id)}}
                          mlops-paas.io/project-id: {{=toJson(inputs.parameters.project_id)}}
                          mlops-paas.io/tenant-id: {{=toJson(inputs.parameters.tenant_id)}}
                      spec:
                        template:
                          metadata:
                            labels:
                              app.kubernetes.io/name: mlops-paas-training-runner
                              app.kubernetes.io/instance: {{=toJson(inputs.parameters.job_name)}}
                              app.kubernetes.io/part-of: mlops-paas
                              app.kubernetes.io/component: training
                              mlops-paas.io/domain: training
                              app.kubernetes.io/managed-by: argo-workflows
                              mlops-paas.io/training-job-id: {{=toJson(inputs.parameters.job_id)}}
                              mlops-paas.io/project-id: {{=toJson(inputs.parameters.project_id)}}
                              mlops-paas.io/tenant-id: {{=toJson(inputs.parameters.tenant_id)}}
                          spec:
                            nodeSelector:
                              mlops-paas/nodepool: training-cpu
                            initContainers:
                            - name: prepare-input
                              env:
                              - name: INPUT_CONTRACT
                                value: {{=toJson(inputs.parameters.input_contract)}}
                              - name: S3_INPUT_DOWNLOAD_URL
                                value: {{=toJson(inputs.parameters.input_download_url)}}
                              - name: S3_INPUT_DOWNLOAD_CAPABILITY
                                value: {{=toJson(inputs.parameters.input_download_capability)}}
  - name: gpu-train-job
    inputs:
      parameters:
      - name: job_id
      - name: project_id
      - name: tenant_id
      - name: job_name
      - name: vcpu
      - name: memory
      - name: accelerator_count
      - name: accelerator_model
      - name: s3_source_uri
      - name: s3_training_data_uri
      - name: output_upload_url
      - name: output_upload_capability
      - name: entry_point
      - name: model_version
      - name: requirements_text
      - name: max_runtime_seconds
      - name: dispatch_timeout_seconds
      - name: input_contract
        value: legacy
      - name: runtime_config_url
        value: ''
      - name: runtime_config_capability
        value: ''
      - name: input_download_url
      - name: input_download_capability
      - name: mlflow_tracking_uri
        value: ''
      - name: mlflow_tracking_token
        value: ''
    resource:
      action: create
      setOwnerReference: false
      manifest: |
        apiVersion: trainer.kubeflow.org/v1alpha1
        kind: TrainJob
        metadata:
          name: {{=toJson(inputs.parameters.job_name)}}
          namespace: mlops-paas-training
          labels:
            app.kubernetes.io/name: mlops-paas-training-runner
            app.kubernetes.io/instance: {{=toJson(inputs.parameters.job_name)}}
            app.kubernetes.io/part-of: mlops-paas
            app.kubernetes.io/component: training
            mlops-paas.io/domain: training
            app.kubernetes.io/managed-by: argo-workflows
            mlops-paas.io/training-job-id: {{=toJson(inputs.parameters.job_id)}}
            mlops-paas.io/project-id: {{=toJson(inputs.parameters.project_id)}}
            mlops-paas.io/tenant-id: {{=toJson(inputs.parameters.tenant_id)}}
        spec:
          runtimeRef:
            apiGroup: trainer.kubeflow.org
            kind: ClusterTrainingRuntime
            name: mlops-paas-single-node
          activeDeadlineSeconds: {{=asInt(inputs.parameters.max_runtime_seconds) + asInt(inputs.parameters.dispatch_timeout_seconds) + 60}}
          trainer:
            numNodes: 1
            resourcesPerNode:
              requests:
                cpu: "{{inputs.parameters.vcpu}}"
                memory: {{inputs.parameters.memory}}Mi
                nvidia.com/gpu: "{{inputs.parameters.accelerator_count}}"
              limits:
                cpu: "{{inputs.parameters.vcpu}}"
                memory: {{inputs.parameters.memory}}Mi
                nvidia.com/gpu: "{{inputs.parameters.accelerator_count}}"
            env:
            - name: INPUT_CONTRACT
              value: {{=toJson(inputs.parameters.input_contract)}}
            - name: RUNTIME_CONFIG_URL
              value: {{=toJson(inputs.parameters.runtime_config_url)}}
            - name: RUNTIME_CONFIG_CAPABILITY
              value: {{=toJson(inputs.parameters.runtime_config_capability)}}
            - name: S3_SOURCE_URI
              value: {{=toJson(inputs.parameters.s3_source_uri)}}
            - name: S3_TRAINING_DATA_URI
              value: {{=toJson(inputs.parameters.s3_training_data_uri)}}
            - name: S3_OUTPUT_UPLOAD_URL
              value: {{=toJson(inputs.parameters.output_upload_url)}}
            - name: S3_OUTPUT_UPLOAD_CAPABILITY
              value: {{=toJson(inputs.parameters.output_upload_capability)}}
            - name: REQUIREMENTS_TEXT
              value: {{=toJson(inputs.parameters.requirements_text)}}
            - name: TRAINING_JOB_ID
              value: {{=toJson(inputs.parameters.job_id)}}
            - name: TENANT_ID
              value: {{=toJson(inputs.parameters.tenant_id)}}
            - name: MAX_RUNTIME_SECONDS
              value: {{=toJson(inputs.parameters.max_runtime_seconds)}}
            - name: S3_INPUT_DOWNLOAD_URL
              value: {{=toJson(inputs.parameters.input_download_url)}}
            - name: S3_INPUT_DOWNLOAD_CAPABILITY
              value: {{=toJson(inputs.parameters.input_download_capability)}}
            - name: ENTRY_POINT
              value: {{=toJson(inputs.parameters.entry_point)}}
            - name: MODEL_VERSION
              value: {{=toJson(inputs.parameters.model_version)}}
            - name: MLFLOW_TRACKING_URI
              value: {{=toJson(inputs.parameters.mlflow_tracking_uri)}}
            - name: MLFLOW_TRACKING_TOKEN
              value: {{=toJson(inputs.parameters.mlflow_tracking_token)}}
          runtimePatches:
          - manager: mlops-paas.io/control-plane
            trainingRuntimeSpec:
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: mlops-paas-training-runner
                    app.kubernetes.io/instance: {{=toJson(inputs.parameters.job_name)}}
                    app.kubernetes.io/part-of: mlops-paas
                    app.kubernetes.io/component: training
                    mlops-paas.io/domain: training
                    app.kubernetes.io/managed-by: argo-workflows
                    mlops-paas.io/training-job-id: {{=toJson(inputs.parameters.job_id)}}
                    mlops-paas.io/project-id: {{=toJson(inputs.parameters.project_id)}}
                    mlops-paas.io/tenant-id: {{=toJson(inputs.parameters.tenant_id)}}
                spec:
                  replicatedJobs:
                  - name: node
                    template:
                      metadata:
                        labels:
                          app.kubernetes.io/name: mlops-paas-training-runner
                          app.kubernetes.io/instance: {{=toJson(inputs.parameters.job_name)}}
                          app.kubernetes.io/part-of: mlops-paas
                          app.kubernetes.io/component: training
                          mlops-paas.io/domain: training
                          app.kubernetes.io/managed-by: argo-workflows
                          mlops-paas.io/training-job-id: {{=toJson(inputs.parameters.job_id)}}
                          mlops-paas.io/project-id: {{=toJson(inputs.parameters.project_id)}}
                          mlops-paas.io/tenant-id: {{=toJson(inputs.parameters.tenant_id)}}
                      spec:
                        template:
                          metadata:
                            labels:
                              app.kubernetes.io/name: mlops-paas-training-runner
                              app.kubernetes.io/instance: {{=toJson(inputs.parameters.job_name)}}
                              app.kubernetes.io/part-of: mlops-paas
                              app.kubernetes.io/component: training
                              mlops-paas.io/domain: training
                              app.kubernetes.io/managed-by: argo-workflows
                              mlops-paas.io/training-job-id: {{=toJson(inputs.parameters.job_id)}}
                              mlops-paas.io/project-id: {{=toJson(inputs.parameters.project_id)}}
                              mlops-paas.io/tenant-id: {{=toJson(inputs.parameters.tenant_id)}}
                          spec:
                            nodeSelector:
                              mlops-paas/nodepool: training-gpu
                            affinity:
                              nodeAffinity:
                                requiredDuringSchedulingIgnoredDuringExecution:
                                  nodeSelectorTerms:
                                  - matchExpressions:
                                    - key: node.kubernetes.io/instance-type
                                      operator: In
                                      values:
                                      - {{=inputs.parameters.accelerator_model == 't4' ? 'g4dn.xlarge' : inputs.parameters.accelerator_model == 'a10g' ? 'g5.xlarge' : 'invalid-gpu-model'}}
                                      - {{=inputs.parameters.accelerator_model == 't4' ? 'g4dn.2xlarge' : inputs.parameters.accelerator_model == 'a10g' ? 'g5.2xlarge' : 'invalid-gpu-model'}}
                            tolerations:
                            - key: nvidia.com/gpu
                              operator: Equal
                              value: 'true'
                              effect: NoSchedule
                            initContainers:
                            - name: prepare-input
                              env:
                              - name: INPUT_CONTRACT
                                value: {{=toJson(inputs.parameters.input_contract)}}
                              - name: S3_INPUT_DOWNLOAD_URL
                                value: {{=toJson(inputs.parameters.input_download_url)}}
                              - name: S3_INPUT_DOWNLOAD_CAPABILITY
                                value: {{=toJson(inputs.parameters.input_download_capability)}}
  - name: wait-training
    inputs:
      parameters:
      - name: job_id
      - name: project_id
      - name: tenant_id
    container:
      image: python:3.10-slim@sha256:fd76ade0c607f27677bc04be3c60749f400eedc941d9e72967e19a4cedff80c2
      command:
      - python
      - /ops/job_ops.py
      - wait-training
      env:
      - name: EXECUTION_PAYLOAD
        value: '{"kind":"training","job_id":"{{inputs.parameters.job_id}}","project_id":"{{inputs.parameters.project_id}}","tenant_id":"{{inputs.parameters.tenant_id}}"}'
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
      - name: operations
        mountPath: /ops
        readOnly: true
  - name: report-status
    container:
      image: curlimages/curl:8.7.1
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      args:
      - -sS
      - -X
      - POST
      - '{{workflow.parameters.control_plane_webhook_url}}'
      - -H
      - 'Content-Type: application/json'
      - -H
      - 'Authorization: Bearer {{workflow.parameters.reporter_capability}}'
      - -H
      - 'Idempotency-Key: {{workflow.uid}}'
      - --data
      - '{"workflow_status":"{{workflow.status}}"}'
  volumes:
  - name: operations
    configMap:
      name: argo-job-operations
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: mlops-paas-training-cancel-template
  namespace: mlops-paas-execution
spec:
  serviceAccountName: argo-job-operations-sa
  entrypoint: cancel-training
  onExit: report-cancellation
  ttlStrategy:
    secondsAfterCompletion: 300
  podGC:
    strategy: OnPodCompletion
  arguments:
    parameters:
    - name: job_id
    - name: job_name
    - name: control_plane_callback_url
    - name: cancel_reporter_capability
    - name: project_id
    - name: tenant_id
  templates:
  - name: cancel-training
    container:
      image: python:3.10-slim@sha256:fd76ade0c607f27677bc04be3c60749f400eedc941d9e72967e19a4cedff80c2
      command:
      - python
      - /ops/job_ops.py
      - cancel-training
      env:
      - name: EXECUTION_PAYLOAD
        value: '{"kind":"training","job_id":"{{workflow.parameters.job_id}}","project_id":"{{workflow.parameters.project_id}}","tenant_id":"{{workflow.parameters.tenant_id}}","stop":true}'
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
      - name: operations
        mountPath: /ops
        readOnly: true
  - name: report-cancellation
    container:
      image: curlimages/curl:8.7.1
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      command:
      - curl
      args:
      - --fail-with-body
      - --silent
      - --show-error
      - --request
      - POST
      - --header
      - 'Authorization: Bearer {{workflow.parameters.cancel_reporter_capability}}'
      - --header
      - 'Content-Type: application/json'
      - --header
      - 'Idempotency-Key: cancel-{{workflow.uid}}'
      - --data
      - '{"workflow_status":"{{workflow.status}}","job_id":"{{workflow.parameters.job_id}}"}'
      - '{{workflow.parameters.control_plane_callback_url}}'
  volumes:
  - name: operations
    configMap:
      name: argo-job-operations
  podMetadata:
    labels:
      app.kubernetes.io/name: mlops-paas-job-operations
      mlops-paas.io/domain: operations

apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-workflow-training-sa
  namespace: mlops-paas-execution
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-training-job-role
  namespace: mlops-paas-training
rules:
  - apiGroups: ["trainer.kubeflow.org"]
    resources: ["trainjobs"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-training-job-role-binding
  namespace: mlops-paas-training
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-training-job-role
subjects:
  - kind: ServiceAccount
    name: argo-workflow-training-sa
    namespace: mlops-paas-execution

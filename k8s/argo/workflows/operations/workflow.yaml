apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: mlops-paas-job-tombstone-template
  namespace: mlops-paas-execution
spec:
  serviceAccountName: argo-workflow-basic-sa
  entrypoint: stopped
  ttlStrategy:
    secondsAfterCompletion: 300
  podGC:
    strategy: OnPodCompletion
  podMetadata:
    labels:
      app.kubernetes.io/name: mlops-paas-job-operations
      app.kubernetes.io/part-of: mlops-paas
      app.kubernetes.io/component: operations
      app.kubernetes.io/managed-by: argo-workflows
      mlops-paas.io/domain: operations
  templates:
    - name: stopped
      nodeSelector: {workload-type: worker}
      container:
        image: python:3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
        command: ["true"]
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: mlops-paas-job-submit-template
  namespace: mlops-paas-execution
spec:
  serviceAccountName: argo-job-operations-sa
  entrypoint: submit
  activeDeadlineSeconds: 240
  ttlStrategy:
    secondsAfterCompletion: 300
  podGC:
    strategy: OnPodCompletion
  podMetadata:
    labels:
      app.kubernetes.io/name: mlops-paas-job-operations
      app.kubernetes.io/part-of: mlops-paas
      app.kubernetes.io/component: operations
      app.kubernetes.io/managed-by: argo-workflows
      mlops-paas.io/domain: operations
  templates:
    - name: submit
      nodeSelector: {workload-type: worker}
      retryStrategy:
        limit: "3"
        retryPolicy: Always
        backoff: {duration: "2s", factor: "2", maxDuration: "30s"}
      container:
        image: python:3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
        command: [python, /ops/job_ops.py, submit]
        env:
          - {name: EXECUTION_KIND, value: "{{workflow.parameters.execution_kind}}"}
          - {name: EXECUTION_PAYLOAD, value: "{{workflow.parameters.execution_payload}}"}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 250m, memory: 128Mi}
        volumeMounts:
          - {name: operations, mountPath: /ops, readOnly: true}
  volumes:
    - name: operations
      configMap: {name: argo-job-operations}
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: mlops-paas-job-reconcile-template
  namespace: mlops-paas-execution
spec:
  serviceAccountName: argo-job-operations-sa
  entrypoint: reconcile
  activeDeadlineSeconds: 240
  ttlStrategy:
    secondsAfterCompletion: 300
  podGC:
    strategy: OnPodCompletion
  podMetadata:
    labels:
      app.kubernetes.io/name: mlops-paas-job-operations
      app.kubernetes.io/part-of: mlops-paas
      app.kubernetes.io/component: operations
      mlops-paas.io/domain: operations
      app.kubernetes.io/managed-by: argo-workflows
  templates:
    - name: reconcile
      nodeSelector: {workload-type: worker}
      retryStrategy:
        limit: "3"
        retryPolicy: Always
        backoff: {duration: "2s", factor: "2", maxDuration: "30s"}
      container:
        image: python:3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
        command: [python, /ops/job_ops.py, reconcile]
        env:
          - {name: EXECUTION_PAYLOAD, value: "{{workflow.parameters.execution_payload}}"}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 250m, memory: 128Mi}
        volumeMounts:
          - {name: operations, mountPath: /ops, readOnly: true}
  volumes:
    - name: operations
      configMap: {name: argo-job-operations}

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - workflow.yaml
  - rbac.yaml
  - network-policy.yaml

configMapGenerator:
  - name: argo-job-operations
    namespace: mlops-paas-execution
    files:
      - scripts/job_ops.py

generatorOptions:
  disableNameSuffixHash: true

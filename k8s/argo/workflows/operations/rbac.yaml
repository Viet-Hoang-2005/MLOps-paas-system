apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-job-operations-sa
  namespace: mlops-paas-execution
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-job-operations
  namespace: mlops-paas-execution
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [get, list, create, patch]
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-job-operations
  namespace: mlops-paas-execution
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: argo-job-operations}
subjects:
  - {kind: ServiceAccount, name: argo-job-operations-sa, namespace: mlops-paas-execution}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-job-observation
  namespace: mlops-paas-training
rules:
  - apiGroups: [kubeflow.org]
    resources: [pytorchjobs]
    verbs: [get, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-job-observation
  namespace: mlops-paas-training
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: argo-job-observation}
subjects:
  - {kind: ServiceAccount, name: argo-job-operations-sa, namespace: mlops-paas-execution}

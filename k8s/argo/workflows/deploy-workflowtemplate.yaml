apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: mlops-paas-model-server-deploy-template
  namespace: mlops-execution
spec:
  serviceAccountName: argo-workflow-deploy-sa
  entrypoint: deploy-model
  onExit: report-deployment-result
  activeDeadlineSeconds: 1800
  podMetadata:
    labels:
      mlops.io/deployment-id: "{{workflow.parameters.deployment_id}}"
  arguments:
    parameters:
      - name: deployment_id
      - name: control_plane_webhook_url
      - name: callback_token
  templates:
    - name: deploy-model
      inputs:
        parameters:
          - name: tenant_id
          - name: project_id
          - name: model_version_id
          - name: version
          - name: image_name
          - name: container_name
          - name: model_type
            default: "ml"
          - name: target_port
            default: "5001"
          - name: model_uri
            default: ""
      steps:
        - - name: deployment
            template: apply-deployment
            arguments:
              parameters:
                - {name: tenant_id, value: "{{inputs.parameters.tenant_id}}"}
                - {name: project_id, value: "{{inputs.parameters.project_id}}"}
                - {name: model_version_id, value: "{{inputs.parameters.model_version_id}}"}
                - {name: version, value: "{{inputs.parameters.version}}"}
                - {name: image_name, value: "{{inputs.parameters.image_name}}"}
                - {name: container_name, value: "{{inputs.parameters.container_name}}"}
                - {name: target_port, value: "{{inputs.parameters.target_port}}"}
                - {name: model_type, value: "{{inputs.parameters.model_type}}"}
                - {name: model_uri, value: "{{inputs.parameters.model_uri}}"}
        - - name: service
            template: apply-service
            arguments:
              parameters:
                - {name: container_name, value: "{{inputs.parameters.container_name}}"}
                - {name: service_name, value: "{{inputs.parameters.container_name}}-svc"}
                - {name: model_type, value: "{{inputs.parameters.model_type}}"}
                - {name: target_port, value: "{{inputs.parameters.target_port}}"}

        - - name: model-ready
            template: await-model-ready
            arguments:
              parameters:
                - {name: container_name, value: "{{inputs.parameters.container_name}}"}

    - name: apply-deployment
      inputs:
        parameters:
          - name: tenant_id
          - name: project_id
          - name: model_version_id
          - name: version
          - name: image_name
          - name: container_name
          - name: target_port
          - name: model_type
          - name: model_uri
      resource:
        action: apply
        manifest: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: {{=toJson(inputs.parameters.container_name)}}
            namespace: mlops-model-runtimes
            labels:
              app: model-endpoint
              tenant: {{=toJson(inputs.parameters.tenant_id)}}
              project: {{=toJson(inputs.parameters.project_id)}}
              model-version: {{=toJson(inputs.parameters.model_version_id)}}
          spec:
            replicas: 1
            progressDeadlineSeconds: 1500
            selector:
              matchLabels:
                app: {{=toJson(inputs.parameters.container_name)}}
            template:
              metadata:
                labels:
                  app: {{=toJson(inputs.parameters.container_name)}}
                  mlops.io/deployment-id: "{{workflow.parameters.deployment_id}}"
              spec:
                automountServiceAccountToken: false
                nodeSelector:
                  workload-type: worker
                imagePullSecrets:
                  - name: harbor-registry-pull-secret
                containers:
                  - name: model-server
                    image: {{=toJson(inputs.parameters.image_name)}}
                    imagePullPolicy: Always
                    ports:
                      - containerPort: {{inputs.parameters.target_port}}
                    env:
                      - {name: LOG_FORMAT, value: "console"}
                      - {name: LOG_SUMMARY_INTERVAL_SECONDS, value: "60"}
                      - {name: MODEL_HEALTH_PORT, value: "{{inputs.parameters.target_port}}"}
                      - {name: MODEL_HEALTH_TYPE, value: "{{inputs.parameters.model_type}}"}
                      - {name: PROJECT_ID, value: {{=toJson(inputs.parameters.project_id)}}}
                      - {name: MODEL_VERSION_ID, value: {{=toJson(inputs.parameters.model_version_id)}}}
                      - {name: MODEL_VERSION, value: {{=toJson(inputs.parameters.version)}}}
                      - {name: MODEL_URI, value: {{=toJson(inputs.parameters.model_uri)}}}
                      - {name: PYTHONPATH, value: "/app/libs:/app"}
                    volumeMounts:
                      - {name: dynamic-libs, mountPath: /app/libs}
                      - {name: pip-cache, mountPath: /root/.cache/pip}
                    resources:
                      requests: {cpu: 250m, memory: 512Mi}
                      limits: {cpu: 1000m, memory: 1Gi}
                    startupProbe:
                      exec:
                        command:
                          - python
                          - -c
                          - 'import json,os,sys,urllib.request; r=urllib.request.Request("http://127.0.0.1:"+os.environ["MODEL_HEALTH_PORT"]+"/health",data=b"{}" if os.environ["MODEL_HEALTH_TYPE"]=="dl" else None,headers={"Content-Type":"application/json"}); p=json.load(urllib.request.urlopen(r,timeout=3)); sys.exit(0 if p.get("model_loaded") is True and p.get("status")!="unhealthy" else 1)'
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 150
                    readinessProbe:
                      exec:
                        command:
                          - python
                          - -c
                          - 'import json,os,sys,urllib.request; r=urllib.request.Request("http://127.0.0.1:"+os.environ["MODEL_HEALTH_PORT"]+"/health",data=b"{}" if os.environ["MODEL_HEALTH_TYPE"]=="dl" else None,headers={"Content-Type":"application/json"}); p=json.load(urllib.request.urlopen(r,timeout=3)); sys.exit(0 if p.get("model_loaded") is True and p.get("status")!="unhealthy" else 1)'
                      periodSeconds: 10
                      timeoutSeconds: 5
                volumes:
                  - {name: dynamic-libs, emptyDir: {}}
                  - {name: pip-cache, emptyDir: {}}

    - name: apply-service
      inputs:
        parameters:
          - name: container_name
          # Built by the caller: quoted literals inside {{=...}} are escaped when the
          # template is serialized, so the expression would be left unevaluated.
          - name: service_name
          - name: model_type
          - name: target_port
      resource:
        action: apply
        manifest: |
          apiVersion: v1
          kind: Service
          metadata:
            name: {{=toJson(inputs.parameters.service_name)}}
            namespace: mlops-model-runtimes
            labels:
              component: model-server
              serving-engine: {{=toJson(inputs.parameters.model_type)}}
          spec:
            selector:
              app: {{=toJson(inputs.parameters.container_name)}}
            ports:
              - name: http
                protocol: TCP
                port: {{inputs.parameters.target_port}}
                targetPort: {{inputs.parameters.target_port}}

    - name: await-model-ready
      nodeSelector: {workload-type: worker}
      inputs:
        parameters:
          - name: container_name
      container:
        image: registry.k8s.io/kubectl:v1.34.1
        command: [kubectl]
        args:
          - rollout
          - status
          - "deployment/{{inputs.parameters.container_name}}"
          - --namespace=mlops-model-runtimes
          - --timeout=25m
        resources:
          requests: {cpu: 25m, memory: 64Mi}
          limits: {cpu: 100m, memory: 128Mi}

    - name: report-deployment-result
      nodeSelector: {workload-type: worker}
      retryStrategy:
        limit: "5"
        retryPolicy: Always
        backoff: {duration: "2s", factor: "2", maxDuration: "120s"}
      container:
        image: curlimages/curl:8.8.0
        args:
          - --fail-with-body
          - --silent
          - --show-error
          - --connect-timeout
          - "5"
          - --max-time
          - "15"
          - --request
          - POST
          - "{{workflow.parameters.control_plane_webhook_url}}"
          - --header
          - "Content-Type: application/json"
          - --header
          - "X-Deployment-Callback-Token: {{workflow.parameters.callback_token}}"
          - --data
          - '{"status":"{{workflow.status}}","workflow_name":"{{workflow.name}}"}'
        resources:
          requests: {cpu: 25m, memory: 32Mi}
          limits: {cpu: 100m, memory: 64Mi}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-workflow-basic-sa
  namespace: mlops-paas-execution
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-workflow-executor
  namespace: mlops-paas-execution
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-workflow-executor
  namespace: mlops-paas-execution
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-workflow-executor
subjects:
  - kind: ServiceAccount
    name: argo-workflow-basic-sa
    namespace: mlops-paas-execution
  - kind: ServiceAccount
    name: argo-workflow-deploy-sa
    namespace: mlops-paas-execution
  - kind: ServiceAccount
    name: argo-workflow-delete-sa
    namespace: mlops-paas-execution
  - kind: ServiceAccount
    name: argo-workflow-training-sa
    namespace: mlops-paas-execution

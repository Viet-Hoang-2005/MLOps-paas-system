apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: mlops-paas-model-packager-template
  namespace: mlops-paas-execution
spec:
  serviceAccountName: argo-workflow-basic-sa
  entrypoint: build-model
  activeDeadlineSeconds: 14400
  podMetadata:
    labels:
      app.kubernetes.io/name: mlops-paas-model-packager
      app.kubernetes.io/part-of: mlops-paas
      app.kubernetes.io/component: packaging
      app.kubernetes.io/managed-by: argo-workflows
      mlops-paas.io/domain: packaging
      mlops-paas.io/build-id: "{{workflow.parameters.build_id}}"
  workflowMetadata:
    labelsFrom:
      mlops-paas.io/build-id: {expression: workflow.parameters.build_id}
      mlops-paas.io/project-id: {expression: workflow.parameters.project_id}
      mlops-paas.io/tenant-id: {expression: workflow.parameters.tenant_id}
  onExit: build-exit-handler
  ttlStrategy:
    secondsAfterCompletion: 3600
  podGC:
    strategy: OnPodCompletion
  volumeClaimGC:
    strategy: OnWorkflowCompletion
  arguments:
    parameters:
      - name: build_id
        value: ""
      - name: project_id
        value: ""
      - name: tenant_id
        value: ""
      - name: control_plane_webhook_url
      - name: result_upload_url
        default: ""
      - name: label_mapping_download_url
      - name: input_schema_download_url
        default: ""
      - name: label_mapping_filename
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
  volumes:
    - name: harbor-config
      secret:
        secretName: harbor-registry-dockerconfig
        items:
          - key: config.json
            path: config.json
  templates:
    - name: build-model
      inputs:
        parameters:
          - name: build_id
          - name: project_id
          - name: tenant_id
          - name: image_repository
          - name: image_tag
          - name: flavor
          - name: task_type
          - name: requirements_text
          - name: source_artifact_name
          - name: source_type
          - name: source_download_url
          - name: output_upload_url
          - name: control_plane_webhook_url
          - name: label_mapping_download_url
          - name: input_schema_download_url
            default: ""
          - name: label_mapping_filename
      steps:
        - - name: prepare-package
            template: prepare-package
            arguments:
              parameters:
                - {name: build_id, value: "{{inputs.parameters.build_id}}"}
                - {name: project_id, value: "{{inputs.parameters.project_id}}"}
                - {name: tenant_id, value: "{{inputs.parameters.tenant_id}}"}
                - {name: image_repository, value: "{{inputs.parameters.image_repository}}"}
                - {name: image_tag, value: "{{inputs.parameters.image_tag}}"}
                - {name: flavor, value: "{{inputs.parameters.flavor}}"}
                - {name: task_type, value: "{{inputs.parameters.task_type}}"}
                - {name: requirements_text, value: "{{inputs.parameters.requirements_text}}"}
                - {name: source_artifact_name, value: "{{inputs.parameters.source_artifact_name}}"}
                - {name: source_type, value: "{{inputs.parameters.source_type}}"}
                - {name: source_download_url, value: "{{inputs.parameters.source_download_url}}"}
                - {name: output_upload_url, value: "{{inputs.parameters.output_upload_url}}"}
                - {name: control_plane_webhook_url, value: "{{inputs.parameters.control_plane_webhook_url}}"}
                - {name: label_mapping_download_url, value: "{{inputs.parameters.label_mapping_download_url}}"}
                - {name: input_schema_download_url, value: "{{inputs.parameters.input_schema_download_url}}"}
                - {name: label_mapping_filename, value: "{{inputs.parameters.label_mapping_filename}}"}
        - - name: build-image
            template: build-image
            arguments:
              parameters:
                - {name: build_id, value: "{{inputs.parameters.build_id}}"}
                - {name: image_repository, value: "{{inputs.parameters.image_repository}}"}
                - {name: image_tag, value: "{{inputs.parameters.image_tag}}"}
        - - name: push-image
            template: push-image
            arguments:
              parameters:
                - {name: build_id, value: "{{inputs.parameters.build_id}}"}
                - {name: image_repository, value: "{{inputs.parameters.image_repository}}"}
                - {name: image_tag, value: "{{inputs.parameters.image_tag}}"}
        - - name: persist-result
            template: persist-result
            when: "{{=workflow.parameters.result_upload_url != ''}}"
            continueOn: {failed: true, error: true}
            arguments:
              parameters:
                - {name: image_repository, value: "{{inputs.parameters.image_repository}}"}
                - {name: image_tag, value: "{{inputs.parameters.image_tag}}"}
        - - name: notify-success
            template: notify-success
            continueOn: {failed: true, error: true}
            arguments:
              parameters:
                - {name: build_id, value: "{{inputs.parameters.build_id}}"}
                - {name: image_repository, value: "{{inputs.parameters.image_repository}}"}
                - {name: image_tag, value: "{{inputs.parameters.image_tag}}"}
                - {name: control_plane_webhook_url, value: "{{inputs.parameters.control_plane_webhook_url}}"}
    - name: prepare-package
      nodeSelector: {workload-type: worker}
      inputs:
        parameters:
          - {name: build_id}
          - {name: project_id}
          - {name: tenant_id}
          - {name: image_repository}
          - {name: image_tag}
          - {name: flavor}
          - {name: task_type}
          - {name: requirements_text}
          - {name: source_artifact_name}
          - {name: source_type}
          - {name: source_download_url}
          - {name: output_upload_url}
          - {name: control_plane_webhook_url}
          - {name: label_mapping_download_url}
          - {name: input_schema_download_url, default: ""}
          - {name: label_mapping_filename}
      container:
        image: registry.mlops-nids-nt114.id.vn/mlops-paas/mlops-paas-model-packager:9d670b5a05e16119a18e6564dc613ba0dd380504
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        imagePullPolicy: Always
        volumeMounts:
          - {name: workspace, mountPath: /workspace}
        env:
          - name: LOG_FORMAT
            valueFrom:
              configMapKeyRef: {name: mlops-paas-execution-config, key: LOG_FORMAT}
          - name: LOG_STORAGE_BACKEND
            valueFrom:
              configMapKeyRef: {name: mlops-paas-execution-config, key: LOG_STORAGE_BACKEND}
          - name: LOG_SUMMARY_INTERVAL_SECONDS
            valueFrom:
              configMapKeyRef: {name: mlops-paas-execution-config, key: LOG_SUMMARY_INTERVAL_SECONDS}
          - {name: REDIS_URL, value: ""}
          - name: HARBOR_REGISTRY_URL
            valueFrom:
              configMapKeyRef: {name: mlops-paas-execution-config, key: HARBOR_REGISTRY_URL}
          - {name: BUILD_ENGINE, value: kaniko}
          - {name: BUILD_WORKSPACE_DIR, value: /workspace}
          - {name: TASK_TYPE, value: "{{inputs.parameters.task_type}}"}
          - {name: BUILD_ID, value: "{{inputs.parameters.build_id}}"}
          - {name: PROJECT_ID, value: "{{inputs.parameters.project_id}}"}
          - {name: IMAGE_REPOSITORY, value: "{{inputs.parameters.image_repository}}"}
          - {name: IMAGE_TAG, value: "{{inputs.parameters.image_tag}}"}
          - {name: TENANT_ID, value: "{{inputs.parameters.tenant_id}}"}
          - {name: FLAVOR, value: "{{inputs.parameters.flavor}}"}
          - {name: REQUIREMENTS_TEXT, value: "{{inputs.parameters.requirements_text}}"}
          - {name: SOURCE_ARTIFACT_NAME, value: "{{inputs.parameters.source_artifact_name}}"}
          - {name: SOURCE_TYPE, value: "{{inputs.parameters.source_type}}"}
          - {name: SOURCE_DOWNLOAD_URL, value: "{{inputs.parameters.source_download_url}}"}
          - {name: LABEL_MAPPING_DOWNLOAD_URL, value: "{{inputs.parameters.label_mapping_download_url}}"}
          - {name: INPUT_SCHEMA_DOWNLOAD_URL, value: "{{inputs.parameters.input_schema_download_url}}"}
          - {name: LABEL_MAPPING_FILENAME, value: "{{inputs.parameters.label_mapping_filename}}"}
          - {name: OUTPUT_UPLOAD_URL, value: "{{inputs.parameters.output_upload_url}}"}
          - {name: CONTROL_PLANE_WEBHOOK_URL, value: "{{inputs.parameters.control_plane_webhook_url}}"}
    - name: build-image
      nodeSelector: {workload-type: worker}
      inputs:
        parameters:
          - {name: build_id}
          - {name: image_repository}
          - {name: image_tag}
      container:
        image: gcr.io/kaniko-project/executor:v1.23.2
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        args:
          - --context=dir:///workspace
          - --dockerfile=/workspace/Dockerfile
          - --destination={{inputs.parameters.image_repository}}:{{inputs.parameters.image_tag}}
          - --no-push
          - --tar-path=/workspace/image.tar
        volumeMounts:
          - {name: workspace, mountPath: /workspace}
    - name: push-image
      nodeSelector: {workload-type: worker}
      inputs:
        parameters:
          - {name: build_id}
          - {name: image_repository}
          - {name: image_tag}
      container:
        image: quay.io/skopeo/stable:v1.22.3
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 256Mi
        command: [skopeo]
        args:
          - copy
          - --dest-authfile=/auth/config.json
          - --digestfile=/workspace/image-digest
          - docker-archive:/workspace/image.tar
          - docker://{{inputs.parameters.image_repository}}:{{inputs.parameters.image_tag}}
        volumeMounts:
          - {name: workspace, mountPath: /workspace}
          - {name: harbor-config, mountPath: /auth, readOnly: true}
    - name: persist-result
      nodeSelector: {workload-type: worker}
      inputs:
        parameters:
          - {name: image_repository}
          - {name: image_tag}
      retryStrategy:
        limit: "3"
        retryPolicy: Always
        backoff: {duration: "2s", factor: "2", maxDuration: "30s"}
      script:
        image: python:3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
        command: [python]
        env:
          - {name: RESULT_UPLOAD_URL, value: "{{workflow.parameters.result_upload_url}}"}
          - {name: IMAGE_URI, value: "{{inputs.parameters.image_repository}}:{{inputs.parameters.image_tag}}"}
        volumeMounts:
          - {name: workspace, mountPath: /workspace, readOnly: true}
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 100m, memory: 128Mi}
        source: |
          import json
          import os
          import urllib.request
          from pathlib import Path

          workspace = Path("/workspace")
          result = json.loads((workspace / "webhook_payload.json").read_text(encoding="utf-8"))
          result["image_uri"] = os.environ["IMAGE_URI"]
          result["image_digest"] = (workspace / "image-digest").read_text(encoding="utf-8").strip()
          upload = urllib.request.Request(
              os.environ["RESULT_UPLOAD_URL"], data=json.dumps(result, allow_nan=False).encode(),
              headers={"Content-Type": "application/json"}, method="PUT",
          )
          with urllib.request.urlopen(upload, timeout=15):
              pass
    - name: notify-success
      nodeSelector: {workload-type: worker}
      inputs:
        parameters:
          - {name: build_id}
          - {name: image_repository}
          - {name: image_tag}
          - {name: control_plane_webhook_url}
      container:
        image: registry.mlops-nids-nt114.id.vn/mlops-paas/mlops-paas-model-packager:9d670b5a05e16119a18e6564dc613ba0dd380504
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        imagePullPolicy: Always
        volumeMounts:
          - {name: workspace, mountPath: /workspace}
        env:
          - name: LOG_FORMAT
            valueFrom:
              configMapKeyRef: {name: mlops-paas-execution-config, key: LOG_FORMAT}
          - name: LOG_STORAGE_BACKEND
            valueFrom:
              configMapKeyRef: {name: mlops-paas-execution-config, key: LOG_STORAGE_BACKEND}
          - name: LOG_SUMMARY_INTERVAL_SECONDS
            valueFrom:
              configMapKeyRef: {name: mlops-paas-execution-config, key: LOG_SUMMARY_INTERVAL_SECONDS}
          - {name: REDIS_URL, value: ""}
          - {name: TASK_TYPE, value: NOTIFY_BUILD}
          - {name: BUILD_WORKSPACE_DIR, value: /workspace}
          - {name: BUILD_ID, value: "{{inputs.parameters.build_id}}"}
          - {name: IMAGE_URI, value: "{{inputs.parameters.image_repository}}:{{inputs.parameters.image_tag}}"}
          - {name: CONTROL_PLANE_WEBHOOK_URL, value: "{{inputs.parameters.control_plane_webhook_url}}"}
          - name: CONTROL_PLANE_WEBHOOK_SECRET
            valueFrom:
              secretKeyRef: {name: argo-build-callback-secret, key: CONTROL_PLANE_WEBHOOK_SECRET}
    - name: build-exit-handler
      steps:
        - - name: notify-build-exit
            template: notify-build-exit
            when: "{{workflow.status}} != Succeeded"
    - name: notify-build-exit
      nodeSelector: {workload-type: worker}
      retryStrategy:
        limit: "3"
        retryPolicy: Always
        backoff:
          duration: "5s"
          factor: 2
          maxDuration: "1m"
      container:
        image: curlimages/curl:8.8.0
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        args:
          - -sS
          - --fail-with-body
          - --connect-timeout
          - "5"
          - --max-time
          - "15"
          - -X
          - POST
          - "{{workflow.parameters.control_plane_webhook_url}}"
          - -H
          - "Content-Type: application/json"
          - -H
          - "X-Control-Plane-Secret: $(CONTROL_PLANE_WEBHOOK_SECRET)"
          - --data
          - '{"status":"{{workflow.status}}","error_message":"Argo workflow {{workflow.name}} finished with {{workflow.status}}"}'
        env:
          - name: CONTROL_PLANE_WEBHOOK_SECRET
            valueFrom:
              secretKeyRef: {name: argo-build-callback-secret, key: CONTROL_PLANE_WEBHOOK_SECRET}

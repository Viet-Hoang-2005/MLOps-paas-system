apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-build-callback-secret-sync
  namespace: mlops-execution
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: "1h"
  secretStoreRef: {name: aws-secrets-manager, kind: ClusterSecretStore}
  target:
    name: argo-build-callback-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - {secretKey: CONTROL_PLANE_WEBHOOK_SECRET, remoteRef: {key: mlops/production-secrets, property: CONTROL_PLANE_WEBHOOK_SECRET}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-build-registry-auth-sync
  namespace: mlops-execution
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: "1h"
  secretStoreRef: {name: aws-secrets-manager, kind: ClusterSecretStore}
  target:
    name: harbor-registry-dockerconfig
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        config.json: |
          {"auths":{"registry.mlops-nids-nt114.id.vn":{"username":"{{ .HARBOR_USERNAME }}","password":"{{ .HARBOR_PASSWORD }}","auth":"{{ printf "%s:%s" .HARBOR_USERNAME .HARBOR_PASSWORD | b64enc }}"}}}
        .dockerconfigjson: |
          {"auths":{"registry.mlops-nids-nt114.id.vn":{"username":"{{ .HARBOR_USERNAME }}","password":"{{ .HARBOR_PASSWORD }}","auth":"{{ printf "%s:%s" .HARBOR_USERNAME .HARBOR_PASSWORD | b64enc }}"}}}
  data:
    - {secretKey: HARBOR_USERNAME, remoteRef: {key: mlops/production-secrets, property: HARBOR_USERNAME}}
    - {secretKey: HARBOR_PASSWORD, remoteRef: {key: mlops/production-secrets, property: HARBOR_PASSWORD}}
---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-training-job-role
  namespace: user-jobs
rules:
  - apiGroups: ["kubeflow.org"]
    resources: ["pytorchjobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-training-job-role-binding
  namespace: user-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-training-job-role
subjects:
  - kind: ServiceAccount
    name: argo-workflow-training-sa
    namespace: mlops-execution

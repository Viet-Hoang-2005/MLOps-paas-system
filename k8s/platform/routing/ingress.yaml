apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: model-gateway-rewrite
  namespace: mlops-paas-routing
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: model-gateway-rewrite
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: ingress
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: platform
spec:
  replacePathRegex:
    regex: "^/[^/]+/models/[^/]+/([^/]+)/(predict|health)$"
    replacement: "/models/${1}/${2}"
---
# Cấu hình IngressRoute cho Control Plane (Django Control Plane)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: control-plane-ingressroute
  namespace: mlops-paas-routing
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: control-plane-ingressroute
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: ingress
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: platform
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`api.mlops-nids-nt114.id.vn`) && (PathPrefix(`/api`) || PathPrefix(`/admin`))
      kind: Rule
      services:
        - name: mlops-paas-control-plane
          namespace: mlops-paas-core
          port: 8000
---
# Cấu hình IngressRoute cho Model Server Gateway (Inference & Health)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: model-server-ingressroute
  namespace: mlops-paas-routing
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: model-server-ingressroute
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: ingress
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: platform
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`mlops-nids-nt114.id.vn`) && PathRegexp(`^/[A-Za-z0-9-]+/models/[0-9A-Fa-f-]{36}/[0-9A-Fa-f-]{36}/(predict|health)$`)
      kind: Rule
      middlewares:
        - name: model-gateway-rewrite
      services:
        - name: mlops-paas-model-server
          namespace: mlops-paas-core
          port: 5000
---
# Endpoint kiểm tra sức khỏe nội bộ của Traefik
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-ping-expose
  namespace: mlops-paas-routing
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-ping-expose
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: ingress
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: platform
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/ping`)
      kind: Rule
      services:
        - name: ping@internal
          kind: TraefikService

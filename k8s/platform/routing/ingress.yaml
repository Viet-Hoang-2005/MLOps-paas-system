apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-security-headers
  namespace: mlops-paas-routing
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: admin-security-headers
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: ingress
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: platform
spec:
  headers:
    frameDeny: true
    browserXssFilter: true
    contentTypeNosniff: true
    stsSeconds: 31536000
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-rate-limit
  namespace: mlops-paas-routing
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: admin-rate-limit
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: ingress
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: platform
spec:
  rateLimit:
    average: 20
    burst: 40
---
# Cấu hình IngressRoute cho Control Plane (Django Control Plane)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: control-plane-ingressroute
  namespace: mlops-paas-routing
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: control-plane-ingressroute
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: ingress
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: platform
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`api.mlops-nids-nt114.id.vn`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: mlops-paas-control-plane
          namespace: mlops-paas-core
          port: 8000
    - match: Host(`api.mlops-nids-nt114.id.vn`) && PathPrefix(`/admin`)
      kind: Rule
      middlewares:
        - name: admin-security-headers
        - name: admin-rate-limit
      services:
        - name: mlops-paas-control-plane
          namespace: mlops-paas-core
          port: 8000
---
# Cấu hình IngressRoute cho Model Server Gateway (Inference & Health)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: model-server-ingressroute
  namespace: mlops-paas-routing
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: model-server-ingressroute
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: ingress
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: platform
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`mlops-nids-nt114.id.vn`) && PathRegexp(`^/model-versions/[0-9A-Fa-f]{8}(-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}/(predict|health)$`)
      kind: Rule
      services:
        - name: mlops-paas-model-server
          namespace: mlops-paas-core
          port: 5000

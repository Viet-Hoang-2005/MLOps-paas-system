apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: model-gateway-rewrite
  namespace: mlops-routing
spec:
  replacePathRegex:
    regex: "^/[^/]+/models/[^/]+/([^/]+)/(predict|health)$"
    replacement: "/models/${1}/${2}"
---
# Cấu hình IngressRoute cho Control Plane (Django Control Plane)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: control-plane-ingressroute
  namespace: mlops-routing
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`api.mlops-nids-nt114.id.vn`) && (PathPrefix(`/api`) || PathPrefix(`/admin`))
      kind: Rule
      services:
        - name: mlops-paas-control-plane
          namespace: mlops-control-plane
          port: 8000
    - match: Host(`mlops-nids-nt114.id.vn`) && PathRegexp(`^/[A-Za-z0-9-]+/models/[0-9A-Fa-f-]{36}/[0-9A-Fa-f-]{36}/(predict|health)$`)
      kind: Rule
      middlewares:
        - name: model-gateway-rewrite
      services:
        - name: mlops-paas-model-server
          namespace: mlops-model-server
          port: 5000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-ping-expose
  namespace: mlops-routing
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/ping`)
      kind: Rule
      services:
        - name: ping@internal
          kind: TraefikService
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: harbor-registry-ingressroute
  namespace: mlops-routing
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`registry.mlops-nids-nt114.id.vn`)
      kind: Rule
      services:
        - name: harbor
          namespace: harbor
          port: 80

apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-cache-config
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-cache
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: cache
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: platform
    mlops-paas.io/domain: cache
data:
  redis-additional.conf: |
    appendonly no
    save ""
    maxmemory-policy allkeys-lru
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-queue-config
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-queue-ha
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: queue
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: platform
    mlops-paas.io/domain: queue
data:
  redis-additional.conf: |
    appendonly yes
    appendfsync everysec
    maxmemory-policy noeviction

apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: redis-cache
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-cache
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: cache
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: platform
spec:
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.4.8
    imagePullPolicy: IfNotPresent
    redisSecret:
      name: redis-ha-secret
      key: REDIS_PASSWORD
    resources:
      requests:
        cpu: 30m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
  redisConfig:
    maxMemoryPercentOfLimit: 75
    additionalRedisConfig: redis-cache-config
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  nodeSelector:
    workload-type: worker
  redisExporter:
    enabled: true
    image: quay.io/opstree/redis-exporter:v1.89.0
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi


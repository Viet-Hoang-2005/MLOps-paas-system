apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisSentinel
metadata:
  name: redis-ha
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: redis-sentinel
    app.kubernetes.io/instance: redis-ha
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: sentinel
    app.kubernetes.io/tier: data
    mlops.io/domain: cache
    app.kubernetes.io/managed-by: redis-operator
spec:
  clusterSize: 3
  kubernetesConfig:
    image: quay.io/opstree/redis-sentinel:v7.4.8
    imagePullPolicy: IfNotPresent
    redisSecret:
      name: redis-ha-secret
      key: REDIS_SENTINEL_PASSWORD
    resources:
      requests:
        cpu: 15m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  redisSentinelConfig:
    redisReplicationName: redis-ha
    masterGroupName: redis-master
    redisReplicationPassword:
      secretKeyRef:
        name: redis-ha-secret
        key: REDIS_PASSWORD
    quorum: "2"
    downAfterMilliseconds: "10000"
    failoverTimeout: "60000"
    parallelSyncs: "1"
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: workload-type
                operator: In
                values: [worker, control-plane]
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: redis-ha-sentinel
              role: sentinel
          topologyKey: kubernetes.io/hostname
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Equal
      value: "true"
      effect: NoSchedule
  pdb:
    enabled: true
    minAvailable: 2
  redisExporter:
    enabled: true
    image: quay.io/opstree/redis-exporter:v1.44.0
    resources:
      requests:
        cpu: 15m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

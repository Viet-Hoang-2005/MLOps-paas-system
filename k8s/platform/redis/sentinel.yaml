apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisSentinel
metadata:
  name: mlops-paas-redis-ha
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  clusterSize: 3
  kubernetesConfig:
    image: quay.io/opstree/redis-sentinel:v7.4.8
    imagePullPolicy: IfNotPresent
    redisSecret:
      name: redis-ha-secret
      key: REDIS_SENTINEL_PASSWORD
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  redisSentinelConfig:
    redisReplicationName: mlops-paas-redis-ha
    masterGroupName: mlops-paas-redis
    redisReplicationPassword:
      secretKeyRef:
        name: redis-ha-secret
        key: REDIS_PASSWORD
    quorum: "2"
    downAfterMilliseconds: "10000"
    failoverTimeout: "60000"
    parallelSyncs: "1"
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: workload-type
                operator: In
                values: [worker, control-plane]
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: mlops-paas-redis-ha-sentinel
              role: sentinel
          topologyKey: kubernetes.io/hostname
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Equal
      value: "true"
      effect: NoSchedule
  pdb:
    enabled: true
    minAvailable: 2
  redisExporter:
    enabled: true
    image: quay.io/opstree/redis-exporter:v1.44.0
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

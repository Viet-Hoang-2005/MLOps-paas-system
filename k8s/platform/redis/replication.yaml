apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: redis-ha
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-ha
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: cache
    app.kubernetes.io/tier: data
    mlops.io/domain: cache
    app.kubernetes.io/managed-by: redis-operator
spec:
  clusterSize: 2
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.4.8
    imagePullPolicy: IfNotPresent
    redisSecret:
      name: redis-ha-secret
      key: REDIS_PASSWORD
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  redisConfig:
    maxMemoryPercentOfLimit: 50
    additionalRedisConfig: redis-ha-config
  storage:
    keepAfterDelete: true
    volumeClaimTemplate:
      spec:
        storageClassName: ebs-gp3
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  nodeSelector:
    workload-type: worker
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: redis-ha
              role: replication
          topologyKey: kubernetes.io/hostname
  pdb:
    enabled: true
    minAvailable: 1
  redisExporter:
    enabled: true
    image: quay.io/opstree/redis-exporter:v1.44.0
    resources:
      requests:
        cpu: 15m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

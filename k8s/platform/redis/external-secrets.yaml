apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-ha-secret-sync
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-ha
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: cache
    app.kubernetes.io/tier: data
    mlops.io/domain: cache
    app.kubernetes.io/managed-by: kustomize
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: redis-ha-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: mlops/production-secrets
        property: REDIS_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: REDIS_SENTINEL_PASSWORD
      remoteRef:
        key: mlops/production-secrets
        property: REDIS_SENTINEL_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

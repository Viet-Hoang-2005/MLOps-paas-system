      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-cache-monitor
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-cache
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: cache
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: platform
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - mlops-paas-data
  selector:
    matchLabels:
      app: redis-cache
      app.kubernetes.io/component: metrics
      redis_setup_type: standalone
  endpoints:
    - port: redis-exporter
      interval: 30s
      scrapeTimeout: 10s

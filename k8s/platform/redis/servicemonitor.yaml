apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-queue-ha-monitor
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-queue-ha
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: queue
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: platform
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - mlops-paas-data
  selector:
    matchLabels:
      app: redis-queue-ha
      app.kubernetes.io/component: metrics
      redis_setup_type: replication
      role: replication
  endpoints:
    - port: redis-exporter
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-queue-sentinel-monitor
  labels:
    app.kubernetes.io/name: redis-sentinel
    app.kubernetes.io/instance: redis-queue-ha
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: sentinel
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: platform
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - mlops-paas-data
  selector:
    matchLabels:
      app: redis-queue-ha-sentinel
      app.kubernetes.io/component: metrics
      redis_setup_type: sentinel
      role: sentinel
  endpoints:

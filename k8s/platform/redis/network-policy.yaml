apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-redis-ha
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlops-paas-core
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redis-operator
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 26379
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9121

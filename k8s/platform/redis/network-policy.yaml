apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-redis-platform
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-platform
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: cache
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: platform
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - redis-queue-ha
          - redis-queue-ha-sentinel
          - redis-cache
  policyTypes:
    - Ingress
  ingress:
    # Nội bộ Redis & Sentinel giao tiếp với nhau
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - redis-queue-ha
                  - redis-queue-ha-sentinel
                  - redis-cache
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 26379
    # Core platform workloads (control-plane, celery, model-server), Redis Operator & KEDA truy cập Redis & Sentinel
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlops-paas-core
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - mlops-paas-control-plane
                  - mlops-paas-celery-worker
                  - mlops-paas-celery-beat
                  - mlops-paas-celery-health-worker
                  - mlops-paas-model-server
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redis-operator
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 26379
    # Prometheus cào metrics exporter (cổng 9121)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9121

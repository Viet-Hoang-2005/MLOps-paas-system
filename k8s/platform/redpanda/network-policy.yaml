apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-redpanda
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/instance: redpanda
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: message-broker
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  policyTypes:
    - Ingress
  ingress:
    # Nội bộ Redpanda
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redpanda
    # Consumer, Model Server đẩy/tiêu thụ data & KEDA Autoscaler giám sát consumer lag
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlops-paas-core
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - mlops-paas-consumer
                  - mlops-paas-model-server
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
      ports:
        - protocol: TCP
          port: 9092
    # Chỉ Prometheus cào metrics admin (cổng 9644)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9644


apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  annotations:
    description: "Redpanda StatefulSet for high-performance Kafka-compatible message broker"
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/instance: redpanda
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: message-broker
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: platform
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda
        app.kubernetes.io/instance: redpanda
        app.kubernetes.io/part-of: mlops-paas
        app.kubernetes.io/component: message-broker
        app.kubernetes.io/managed-by: kustomize
        mlops-paas.io/plane: platform
    spec:
      nodeSelector:
        workload-type: worker
      # EBS volumes are formatted root-owned; the image runs as the redpanda
      # user (101), so the kubelet must hand the data volume to that group.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir: {}
      initContainers:
      - name: prepare-config
        image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
        # rpk rewrites redpanda.yaml before starting the broker.
        command: ["/bin/cp", "/etc/redpanda/redpanda.yaml", "/tmp/redpanda.yaml"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      containers:
      - name: redpanda
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        command: ["rpk", "redpanda", "start"]
        args:
        - --config
        - /tmp/redpanda.yaml
        - --overprovisioned
        - --smp
        - "1"
        - --memory
        - 768M
        - --reserve-memory
        - 0M
        - --kafka-addr
        - PLAINTEXT://0.0.0.0:9092
        - --advertise-kafka-addr
        - PLAINTEXT://$(POD_NAME).redpanda.mlops-paas-data.svc.cluster.local:9092
        ports:
        - containerPort: 9092
          name: kafka
        - containerPort: 9644
          name: admin
        readinessProbe:
          httpGet:
            path: /v1/status/ready
            port: admin
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /v1/status/ready
            port: admin
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 3
        resources:
          limits:
            memory: "1536Mi"
            cpu: "1000m"
          requests:
            memory: "384Mi"
            cpu: "50m"
        volumeMounts:
        - name: redpanda-data
          mountPath: /var/lib/redpanda/data
        - name: tmp
          mountPath: /tmp
  volumeClaimTemplates:
  - metadata:
      name: redpanda-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: ebs-gp3
      resources:
        requests:
          storage: 5Gi

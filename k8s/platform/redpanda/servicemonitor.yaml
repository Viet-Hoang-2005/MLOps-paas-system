# Redpanda tự expose metrics tại port 9644 không cần exporter thêm
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redpanda-monitor
  namespace: monitoring
  labels:
    release: monitoring
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: message-broker
    mlops.io/domain: messaging
spec:
  namespaceSelector:
    matchNames:
      - mlops-paas-data
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  endpoints:
    - port: admin
      path: /metrics
      interval: 30s
      scrapeTimeout: 15s

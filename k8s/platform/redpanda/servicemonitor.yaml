# redpanda-servicemonitor.yaml: Cấu hình Prometheus scrape metrics nội bộ của Redpanda
# Redpanda tự expose metrics tại port 9644 không cần exporter thêm
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redpanda-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - mlops-redpanda
  selector:
    matchLabels:
      app: redpanda
  endpoints:
    - port: admin
      path: /metrics
      interval: 30s
      scrapeTimeout: 15s

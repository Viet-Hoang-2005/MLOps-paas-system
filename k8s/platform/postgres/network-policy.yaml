apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-postgresql
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgresql
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: platform
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgresql
  policyTypes:
    - Ingress
  ingress:
    # Nội bộ các Pod Postgres đồng bộ Replication (cùng namespace)
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgresql
    # CloudNativePG Operator quản lý cluster
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
    # Control Plane, Migration Job, Celery, Consumer và Evidently truy cập DB (cổng 5432)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlops-paas-core
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - mlops-paas-control-plane
                  - mlops-paas-control-plane-migration
                  - mlops-paas-celery-worker
                  - mlops-paas-celery-beat
                  - mlops-paas-celery-health-worker
                  - mlops-paas-consumer
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlops-paas-execution
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mlops-paas-evidently
      ports:
        - protocol: TCP
          port: 5432
    # Prometheus cào metrics (cổng 9187)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9187


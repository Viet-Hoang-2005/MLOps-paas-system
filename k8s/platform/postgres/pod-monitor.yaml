# postgres-podmonitor.yaml: Thu thập metrics trực tiếp từ các Pod của CloudNativePG
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mlops-paas-postgres-monitor
  namespace: monitoring
  labels:
    release: monitoring # Label để Prometheus Operator nhận diện
spec:
  # Chỉ định namespace đang chạy Database
  namespaceSelector:
    matchNames:
      - mlops-postgres
  
  # Bộ lọc nhận diện chính xác các Pod thuộc cụm DB
  selector:
    matchLabels:
      cnpg.io/cluster: mlops-paas-postgres 

  # Cấu hình cổng và tần suất thu thập
  podMetricsEndpoints:
    - port: metrics      # CNPG đã tự động đặt tên cổng 9187 là "metrics"
      interval: 15s
      scrapeTimeout: 10s

# postgres-podmonitor.yaml: Thu thập metrics trực tiếp từ các Pod của CloudNativePG
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgresql-monitor
  namespace: monitoring
  labels:
    release: monitoring
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: database
    mlops.io/domain: storage
spec:
  # Chỉ định namespace đang chạy Database
  namespaceSelector:
    matchNames:
      - mlops-paas-data
  
  # Bộ lọc nhận diện chính xác các Pod thuộc cụm DB
  selector:
    matchLabels:
      cnpg.io/cluster: postgresql 

  # Cấu hình cổng và tần suất thu thập
  podMetricsEndpoints:
    - port: metrics      # CNPG đã tự động đặt tên cổng 9187 là "metrics"
      interval: 15s
      scrapeTimeout: 10s

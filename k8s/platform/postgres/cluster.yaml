# postgres-cluster.yaml: CloudNativePG Cluster
#   mlops-paas-postgres-rw -> Primary (dùng cho INSERT/UPDATE)
#   mlops-paas-postgres-ro -> Load-balanced Primary + Standby (dùng cho SELECT)
#   mlops-paas-postgres-r  -> Tất cả instances
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
  annotations:
    description: "CloudNativePG cluster for MLops data and training metadata storage"
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgresql
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: platform
spec:
  inheritedMetadata:
    labels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: postgresql
      app.kubernetes.io/part-of: mlops-paas
      app.kubernetes.io/component: database
      app.kubernetes.io/managed-by: kustomize
      mlops-paas.io/plane: platform
  # Chạy 2 instances để đảm bảo tính sẵn sàng cao (High Availability)
  # Node 1: Primary (RW), Node 2: Standby (RO)
  instances: 2
  enableSuperuserAccess: true
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5

  # Khởi tạo database và application owner
  bootstrap:
    initdb:
      database: mlops_paas_db
      owner: postgres
      secret:
        name: postgresql-bootstrap-secret
      postInitApplicationSQL:
        - "CREATE SCHEMA IF NOT EXISTS control_plane;"

  # Cấu hình Storage cho mỗi instance
  storage:
    storageClass: ebs-gp3
    size: 10Gi

  # Sao lưu WAL liên tục và base backup lên S3 qua IAM Role của worker node
  backup:
    retentionPolicy: "14d"
    barmanObjectStore:
      destinationPath: "s3://mlops-paas-artifacts/postgres-backups"
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip

  # Khi mở rộng lại nhiều instance, anti-affinity giúp tách các pod ra khác node.
  affinity:
    nodeSelector:
      workload-type: worker
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  # Tuning PostgreSQL parameters (an toàn dưới limits.memory=1Gi)
  postgresql:
    parameters:
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      work_mem: "32MB"
      maintenance_work_mem: "256MB"
      max_connections: "200"

  resources:
    requests:
      cpu: "75m"
      memory: "256Mi"
    limits:
      cpu: "800m"
      memory: "1536Mi"

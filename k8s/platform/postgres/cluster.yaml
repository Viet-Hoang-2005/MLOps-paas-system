# postgres-cluster.yaml: CloudNativePG Cluster
#   mlops-paas-postgres-rw -> Primary (dùng cho INSERT/UPDATE)
#   mlops-paas-postgres-ro -> Load-balanced Primary + Standby (dùng cho SELECT)
#   mlops-paas-postgres-r  -> Tất cả instances
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
  annotations:
    description: "CloudNativePG cluster for MLops data and training metadata storage"
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgresql
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: database
    app.kubernetes.io/tier: data
    mlops.io/domain: storage
    app.kubernetes.io/managed-by: cloudnative-pg
spec:
  inheritedMetadata:
    labels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: postgresql
      app.kubernetes.io/part-of: mlops-paas
      app.kubernetes.io/component: database
      app.kubernetes.io/tier: data
      mlops.io/domain: storage
  # Chạy 2 instances để đảm bảo tính sẵn sàng cao (High Availability)
  # Node 1: Primary (RW), Node 2: Standby (RO)
  instances: 2
  enableSuperuserAccess: true
  imageName: ghcr.io/cloudnative-pg/postgresql:15

  # Khởi tạo database và application owner
  bootstrap:
    initdb:
      database: mlops_paas_db
      owner: postgres
      secret:
        name: postgresql-bootstrap-secret
      postInitApplicationSQL:
        - "CREATE SCHEMA IF NOT EXISTS control_plane;"

  # Cấu hình Storage cho mỗi instance
  storage:
    storageClass: ebs-gp3
    size: 10Gi

  # Khi mở rộng lại nhiều instance, anti-affinity giúp tách các pod ra khác node.
  affinity:
    nodeSelector:
      workload-type: worker
    enablePodAntiAffinity: true
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname

  # Tuning PostgreSQL parameters
  postgresql:
    parameters:
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      work_mem: "32MB"
      maintenance_work_mem: "256MB"
      max_connections: "200"

  resources:
    requests:
      cpu: "150m"
      memory: "384Mi"
    limits:
      cpu: "800m"
      memory: "1Gi"

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-bootstrap-secret-sync
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgresql
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: platform
    mlops-paas.io/domain: storage
spec:
  refreshInterval: "1h"
  secretStoreRef: {name: aws-secrets-manager, kind: ClusterSecretStore}
  target:
    name: postgresql-bootstrap-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - {secretKey: DB_USER, remoteRef: {key: mlops/production-secrets, property: DB_USER, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None, nullBytePolicy: Ignore}}
    - {secretKey: DB_PASSWORD, remoteRef: {key: mlops/production-secrets, property: DB_PASSWORD, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None, nullBytePolicy: Ignore}}
    - {secretKey: username, remoteRef: {key: mlops/production-secrets, property: DB_USER, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None, nullBytePolicy: Ignore}}
    - {secretKey: password, remoteRef: {key: mlops/production-secrets, property: DB_PASSWORD, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None, nullBytePolicy: Ignore}}

expose:
  type: clusterIP
  tls:
    enabled: false
  ingress:
    enabled: false

externalURL: https://registry.mlops-nids-nt114.id.vn

persistence:
  enabled: true
  resourcePolicy: "keep"
  persistentVolumeClaim:
    registry:
      storageClass: local-path
      size: 5Gi
    jobservice:
      storageClass: local-path
      size: 1Gi
    redis:
      storageClass: local-path
      size: 2Gi
    database:
      storageClass: local-path
      size: 3Gi
  imageChartStorage:
    type: s3
    redirect:
      disable: true
    s3:
      region: ap-southeast-1
      bucket: mlops-paas-images
      v4auth: true
      secure: true
      rootdirectory: /

registry:
  relativeurls: true
  nodeSelector: { workload-type: worker }
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

trivy:
  enabled: false
  nodeSelector: { workload-type: worker }
notary:
  enabled: false

portal:
  nodeSelector: { workload-type: worker }
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

core:
  nodeSelector: { workload-type: worker }
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

jobservice:
  nodeSelector: { workload-type: worker }
  resources:
    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

database:
  nodeSelector: { workload-type: worker }
  internal:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 512Mi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

redis:
  nodeSelector: { workload-type: worker }
  internal:
    resources:
      requests:
        cpu: 30m
        memory: 64Mi
      limits:
        cpu: 150m
        memory: 128Mi
  resources:
    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi

exporter:
  nodeSelector: { workload-type: worker }
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

metrics:
  nodeSelector: { workload-type: worker }

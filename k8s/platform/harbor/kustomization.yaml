apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: harbor

resources:
  - ingress.yaml

helmCharts:
  - name: harbor
    repo: https://helm.goharbor.io
    version: 1.15.0
    releaseName: harbor
    namespace: harbor
    valuesFile: values.yaml

patches:
  - target:
      group: apps
      kind: Deployment
      name: harbor-jobservice
    patch: |-
      - op: replace
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1

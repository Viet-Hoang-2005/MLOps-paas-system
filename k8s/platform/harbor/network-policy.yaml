apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-harbor-platform
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/instance: harbor
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: registry
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Nội bộ các thành phần Harbor giao tiếp với nhau
    - from:
        - podSelector: {}
    # Traefik Ingress định tuyến registry.mlops-nids-nt114.id.vn vào Harbor nginx
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 80
    # Control Plane, Build Packager và Kyverno truy cập Harbor API/Registry nội bộ
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlops-paas-core
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - mlops-paas-control-plane
                  - mlops-paas-celery-worker
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlops-paas-execution
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mlops-paas-model-packager
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kyverno
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 80
    # Prometheus cào metrics exporter
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 8001

# grafana-alertrules.yaml: Cấu hình PrometheusRule với các ngưỡng cảnh báo cho hệ thống AI PaaS
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mlops-paas-alert-rules
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    # Nhóm 1: Microservices Health & Availability
    - name: paas.services.health
      rules:
        # Cảnh báo khi Control Plane pod không còn chạy
        - alert: ControlPlanePodsUnavailable
          expr: kube_deployment_status_replicas_available{deployment="mlops-paas-control-plane"} < 1
          for: 1m
          labels:
            severity: critical
            team: mlops
          annotations:
            summary: "Control Plane Pods unavailable"
            description: "The mlops-paas-control-plane deployment has 0 available replicas!"

        # Cảnh báo khi Consumer pod không còn chạy
        - alert: ConsumerPodsUnavailable
          expr: kube_deployment_status_replicas_available{deployment="mlops-paas-consumer"} < 1
          for: 1m
          labels:
            severity: critical
            team: mlops
          annotations:
            summary: "Consumer Pods unavailable"
            description: "The mlops-paas-consumer deployment has 0 available replicas!"

        # Cảnh báo khi Frontend Web pod không còn chạy
        - alert: WebPodsUnavailable
          expr: kube_deployment_status_replicas_available{deployment="mlops-paas-web"} < 1
          for: 1m
          labels:
            severity: critical
            team: mlops
          annotations:
            summary: "Frontend Web Pods unavailable"
            description: "The mlops-paas-web deployment has 0 available replicas!"

        # Cảnh báo khi p95 latency của đường predict qua gateway vượt ngưỡng 500ms
        - alert: HighServiceLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(paas_prediction_latency_seconds_bucket[5m])) by (le)
            ) > 0.5
          for: 3m
          labels:
            severity: warning
            team: mlops
          annotations:
            summary: "Model gateway p95 latency > 500ms"
            description: "Current p95 latency is {{ $value | humanizeDuration }}."

        # Cảnh báo khi tỷ lệ lỗi predict qua gateway vượt 1%
        - alert: HighHTTPErrorRate
          expr: |
            sum(rate(paas_predictions_total{status=~"error.*"}[5m])) /
            clamp_min(sum(rate(paas_predictions_total[5m])), 0.001) > 0.01
          for: 2m
          labels:
            severity: critical
            team: mlops
          annotations:
            summary: "Model gateway error rate > 1%"
            description: "Current error rate is {{ $value | humanizePercentage }}."

    # Nhóm 2: AI Inference & Model Endpoints
    - name: paas.inference
      rules:
        # Cảnh báo khi lượng lỗi suy luận tăng cao
        - alert: HighInferenceErrors
          expr: |
            rate(paas_predictions_total{status=~"error.*"}[5m]) > 5
          for: 2m
          labels:
            severity: warning
            team: mlops
          annotations:
            summary: "High Model Inference Errors"
            description: "Model Endpoint is generating {{ $value }} errors/sec."

    # Nhóm 3: Database Health
    - name: paas.database
      rules:
        # Cảnh báo khi PostgreSQL Pod down
        - alert: PostgresDown
          expr: cnpg_pg_up == 0
          for: 1m
          labels:
            severity: critical
            team: infrastructure
          annotations:
            summary: "PostgreSQL is not responding!"
            description: "A CloudNativePG instance is down. Check the database cluster immediately!"

        # Cảnh báo khi số connections gần đạt max_connections
        - alert: PostgresHighConnections
          expr: |
            sum(cnpg_pg_stat_database_numbackends) by (datname) > 80
          for: 5m
          labels:
            severity: warning
            team: infrastructure
          annotations:
            summary: "PostgreSQL high connections"
            description: "Database {{ $labels.datname }} has {{ $value }} active connections."

    # Nhóm 4: Infrastructure
    - name: paas.infrastructure
      rules:
        # Cảnh báo khi RAM Worker Node vượt 85%
        - alert: NodeHighMemoryUsage
          expr: |
            (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
          for: 5m
          labels:
            severity: warning
            team: infrastructure
          annotations:
            summary: "Worker Node RAM > 85%"
            description: "Node {{ $labels.instance }} is using {{ $value | humanize }}% RAM."

        # Cảnh báo khi disk vượt 80%
        - alert: NodeDiskAlmostFull
          expr: |
            (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 80
          for: 10m
          labels:
            severity: warning
            team: infrastructure
          annotations:
            summary: "Node Disk almost full (> 80%)"
            description: "Node {{ $labels.instance }}: {{ $value | humanize }}% disk usage."

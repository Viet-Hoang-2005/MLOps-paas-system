# prometheus-rule.yaml: Cấu hình PrometheusRule với các ngưỡng cảnh báo cho hệ thống AI PaaS
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mlops-paas-alert-rules
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    # Nhóm 1: Microservices Health & Availability
    - name: paas.services.health
      rules:
        # Cảnh báo khi Control Plane pod không còn chạy
        - alert: ControlPlanePodsUnavailable
          expr: kube_deployment_status_replicas_available{namespace="mlops-control-plane", deployment="mlops-paas-control-plane"} < 1
          for: 1m
          labels:
            severity: critical
            team: mlops
          annotations:
            summary: "Control Plane Pods unavailable"
            description: "The mlops-paas-control-plane deployment has 0 available replicas!"

        # Cảnh báo khi Celery Worker pod không còn chạy (ảnh hưởng pipeline training, build, drift)
        - alert: CeleryWorkersUnavailable
          expr: kube_deployment_status_replicas_available{namespace="mlops-control-plane", deployment="mlops-paas-celery-worker"} < 1
          for: 2m
          labels:
            severity: critical
            team: mlops
          annotations:
            summary: "Celery Worker deployment has 0 available replicas"
            description: "Background ML tasks (training, packaging, drift checks) are halted!"

        # Cảnh báo khi Consumer pod không còn chạy
        - alert: ConsumerPodsUnavailable
          expr: kube_deployment_status_replicas_available{namespace="mlops-consumer", deployment="mlops-paas-consumer"} < 1
          for: 1m
          labels:
            severity: critical
            team: mlops
          annotations:
            summary: "Consumer Pods unavailable"
            description: "The mlops-paas-consumer deployment has 0 available replicas!"

        # Cảnh báo khi Frontend Web pod không còn chạy
        - alert: WebPodsUnavailable
          expr: kube_deployment_status_replicas_available{namespace="mlops-web", deployment="mlops-paas-web"} < 1
          for: 1m
          labels:
            severity: critical
            team: mlops
          annotations:
            summary: "Frontend Web Pods unavailable"
            description: "The mlops-paas-web deployment has 0 available replicas!"

        # Cảnh báo khi tỷ lệ lỗi HTTP 5xx của Control Plane vượt 5%
        - alert: ControlPlaneHighErrorRate
          expr: |
            sum(rate(control_plane_api_requests_total{status=~"5.."}[5m])) /
            clamp_min(sum(rate(control_plane_api_requests_total[5m])), 0.001) > 0.05
          for: 2m
          labels:
            severity: critical
            team: mlops
          annotations:
            summary: "Control Plane 5xx error rate > 5%"
            description: "Control plane API is experiencing elevated server errors ({{ $value | humanizePercentage }})."

        # Cảnh báo khi p95 latency của Control Plane vượt 2 giây
        - alert: ControlPlaneHighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(control_plane_api_request_duration_seconds_bucket[5m])) by (le)
            ) > 2.0
          for: 3m
          labels:
            severity: warning
            team: mlops
          annotations:
            summary: "Control Plane p95 latency > 2s"
            description: "Current Control Plane API p95 latency is {{ $value | humanizeDuration }}."

        # Cảnh báo khi tỷ lệ thất bại của Celery task tăng cao
        - alert: CeleryHighTaskFailureRate
          expr: |
            sum(rate(control_plane_celery_tasks_total{status="failure"}[5m])) > 0.1
          for: 3m
          labels:
            severity: warning
            team: mlops
          annotations:
            summary: "High Celery task failure rate"
            description: "Background tasks are failing at {{ $value }} errors/sec."

        # Cảnh báo khi p95 latency của đường predict qua gateway vượt ngưỡng 500ms
        - alert: HighServiceLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(paas_prediction_latency_seconds_bucket[5m])) by (le)
            ) > 0.5
          for: 3m
          labels:
            severity: warning
            team: mlops
          annotations:
            summary: "Model gateway p95 latency > 500ms"
            description: "Current p95 latency is {{ $value | humanizeDuration }}."

        # Cảnh báo khi tỷ lệ lỗi predict qua gateway vượt 1%
        - alert: HighHTTPErrorRate
          expr: |
            sum(rate(paas_predictions_total{status=~"error.*"}[5m])) /
            clamp_min(sum(rate(paas_predictions_total[5m])), 0.001) > 0.01
          for: 2m
          labels:
            severity: critical
            team: mlops
          annotations:
            summary: "Model gateway error rate > 1%"
            description: "Current error rate is {{ $value | humanizePercentage }}."

    # Nhóm 2: AI Inference & Model Endpoints
    - name: paas.inference
      rules:
        # Cảnh báo khi lượng lỗi suy luận tăng cao theo từng Model & Version
        - alert: HighInferenceErrors
          expr: |
            sum(rate(paas_predictions_total{status=~"error.*"}[5m])) by (project_id, model_version_id) > 5
          for: 2m
          labels:
            severity: warning
            team: mlops
          annotations:
            summary: "High Model Inference Errors"
            description: "Model project {{ $labels.project_id }} (version {{ $labels.model_version_id }}) is generating {{ $value }} errors/sec."

    # Nhóm 3: Database Health
    - name: paas.database
      rules:
        # Cảnh báo khi PostgreSQL Pod down
        - alert: PostgresDown
          expr: cnpg_pg_up == 0
          for: 1m
          labels:
            severity: critical
            team: infrastructure
          annotations:
            summary: "PostgreSQL is not responding!"
            description: "A CloudNativePG instance is down. Check the database cluster immediately!"

        # Cảnh báo khi số connections gần đạt max_connections
        - alert: PostgresHighConnections
          expr: |
            sum(cnpg_pg_stat_database_numbackends) by (datname) > 80
          for: 5m
          labels:
            severity: warning
            team: infrastructure
          annotations:
            summary: "PostgreSQL high connections"
            description: "Database {{ $labels.datname }} has {{ $value }} active connections."

    # Nhóm 4: Infrastructure
    - name: paas.infrastructure
      rules:
        # Cảnh báo khi RAM Worker Node vượt 85%
        - alert: NodeHighMemoryUsage
          expr: |
            (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
          for: 5m
          labels:
            severity: warning
            team: infrastructure
          annotations:
            summary: "Worker Node RAM > 85%"
            description: "Node {{ $labels.instance }} is using {{ $value | humanize }}% RAM."

        # Cảnh báo khi disk vượt 80%
        - alert: NodeDiskAlmostFull
          expr: |
            (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 80
          for: 10m
          labels:
            severity: warning
            team: infrastructure
          annotations:
            summary: "Node Disk almost full (> 80%)"
            description: "Node {{ $labels.instance }}: {{ $value | humanize }}% disk usage."

    - name: paas.redis-ha
      rules:
        - alert: RedisHAReplicasUnavailable
          expr: kube_statefulset_status_replicas_ready{namespace="mlops-redis",statefulset="mlops-paas-redis-ha"} < 2 or kube_statefulset_status_replicas_ready{namespace="mlops-redis",statefulset="mlops-paas-redis-ha-sentinel"} < 3
          for: 3m
          labels:
            severity: critical
            team: infrastructure
          annotations:
            summary: "Redis HA has unavailable Redis or Sentinel replicas"
            description: "Check the two Redis and three Sentinel Pods and their node placement."
        - alert: RedisReplicaLinkDown
          expr: redis_master_link_up{namespace="mlops-redis"} == 0
          for: 2m
          labels:
            severity: critical
            team: infrastructure
          annotations:
            summary: "Redis replica lost its master link"
            description: "Inspect Sentinel election and Redis replication before accepting more writes."
        - alert: RedisHAMemoryHigh
          expr: redis_memory_used_bytes{namespace="mlops-redis"} / clamp_min(redis_memory_max_bytes{namespace="mlops-redis"}, 1) > 0.85
          for: 5m
          labels:
            severity: warning
            team: infrastructure
          annotations:
            summary: "Redis memory usage exceeds 85% of maxmemory"
            description: "Investigate queue depth and key retention before Redis rejects writes."
        - alert: RedisHAPVCAlmostFull
          expr: kubelet_volume_stats_used_bytes{namespace="mlops-redis"} / clamp_min(kubelet_volume_stats_capacity_bytes{namespace="mlops-redis"}, 1) > 0.8
          for: 10m
          labels:
            severity: warning
            team: infrastructure
          annotations:
            summary: "Redis HA PVC exceeds 80% usage"
            description: "AOF storage is approaching the 5 GiB volume limit."

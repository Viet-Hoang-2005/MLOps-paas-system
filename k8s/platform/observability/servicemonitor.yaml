# servicemonitor.yaml: Unified Prometheus ServiceMonitor configuration for MLOps PaaS
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mlops-paas-model-server-monitor
  namespace: monitoring
  labels:
    release: monitoring
    app.kubernetes.io/name: mlops-paas-model-server
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: gateway
    mlops.io/domain: serving
spec:
  selector:
    matchExpressions:
      # Scrape both dynamic serving workers and the central model gateway.
      - key: app.kubernetes.io/name
        operator: In
        values:
          - mlops-paas-model-server
          - mlops-paas-model-serving
  namespaceSelector:
    matchNames:
      - mlops-paas-core
      - mlops-paas-serving
  targetLabels:
    - app.kubernetes.io/name
    - app.kubernetes.io/component
    - mlops.io/domain
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mlops-paas-control-plane-monitor
  namespace: monitoring
  labels:
    release: monitoring
    app.kubernetes.io/name: mlops-paas-control-plane
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: backend
    mlops.io/domain: control-plane
spec:
  namespaceSelector:
    matchNames:
      - mlops-paas-core
  selector:
    matchLabels:
      app.kubernetes.io/name: mlops-paas-control-plane
  endpoints:
    - port: http
      path: /health/metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-ha-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - mlops-paas-data
  selector:
    matchLabels:
      app: redis-ha
      app.kubernetes.io/component: metrics
      redis_setup_type: replication
      role: replication
  endpoints:
    - port: redis-exporter
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-sentinel-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - mlops-paas-data
  selector:
    matchLabels:
      app: redis-ha-sentinel
      app.kubernetes.io/component: metrics
      redis_setup_type: sentinel
      role: sentinel
  endpoints:
    - port: sentinel-exp
      interval: 30s
      scrapeTimeout: 10s

# cloudflared-tunnel.yaml: Triển khai Cloudflared Tunnel để kết nối K3s với Cloudflare Zero Trust
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflare
  annotations:
    description: "Cloudflare Tunnel to securely expose the K3s Traefik Ingress to the public internet"
  labels:
    app: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      nodeSelector:
        workload-type: worker
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - cloudflared
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: cloudflared
          # Pull image chính thức của Cloudflared từ Docker Hub
          image: cloudflare/cloudflared:latest
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - run
          # Biến môi trường cung cấp token từ Secret cho Cloudflared
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tunnel-token
                  key: token
          
          # Cấu hình tài nguyên cho Cloudflared
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

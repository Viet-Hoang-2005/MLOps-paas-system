# cloudflared-tunnel.yaml: Triển khai Cloudflared Tunnel để kết nối K3s với Cloudflare Zero Trust
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: mlops-paas-routing
  annotations:
    description: "Cloudflare Tunnel to securely expose the K3s Traefik Ingress to the public internet"
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/instance: cloudflared
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: tunnel
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
        app.kubernetes.io/instance: cloudflared
        app.kubernetes.io/part-of: mlops-paas
        app.kubernetes.io/component: tunnel
        app.kubernetes.io/managed-by: kustomize
        mlops-paas.io/plane: platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        workload-type: worker
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - cloudflared
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: cloudflared
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Pull image chính thức của Cloudflared từ Docker Hub
          image: cloudflare/cloudflared:2026.10.7
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          ports:
            - name: metrics
              containerPort: 2000
          # Biến môi trường cung cấp token từ Secret cho Cloudflared
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-tunnel-token
                  key: token
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          
          # Cấu hình tài nguyên cho Cloudflared
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi

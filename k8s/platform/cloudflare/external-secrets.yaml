apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-tunnel-token-sync
  namespace: mlops-paas-routing
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/instance: cloudflared
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: tunnel
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: platform
    mlops-paas.io/domain: networking
spec:
  refreshInterval: "1h"
  secretStoreRef: {name: aws-secrets-manager, kind: ClusterSecretStore}
  target:
    name: cloudflared-tunnel-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - {secretKey: token, remoteRef: {key: mlops/production-secrets, property: TUNNEL_TOKEN, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None, nullBytePolicy: Ignore}}

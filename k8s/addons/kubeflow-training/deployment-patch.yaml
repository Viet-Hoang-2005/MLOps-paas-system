apiVersion: apps/v1
kind: Deployment
metadata:
  name: training-operator
  namespace: kubeflow
  labels:
    app.kubernetes.io/name: kubeflow-training-operator
    app.kubernetes.io/instance: kubeflow-training-operator
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: training-operator
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: addon
spec:
  template:
    spec:
      nodeSelector:
        workload-type: worker
      containers:
        - name: training-operator
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

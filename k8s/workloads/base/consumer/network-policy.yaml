apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-mlops-paas-consumer
  labels:
    app.kubernetes.io/name: mlops-paas-consumer
    app.kubernetes.io/instance: mlops-paas-consumer
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: worker
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: workload
    mlops-paas.io/domain: streaming
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mlops-paas-consumer
  policyTypes:
    - Ingress
  ingress: []


apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-paas-web
  labels:
    app.kubernetes.io/name: mlops-paas-web
    app.kubernetes.io/instance: mlops-paas-web
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: frontend
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: workload
    mlops-paas.io/domain: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlops-paas-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlops-paas-web
        app.kubernetes.io/instance: mlops-paas-web
        app.kubernetes.io/part-of: mlops-paas
        app.kubernetes.io/component: frontend
        app.kubernetes.io/managed-by: kustomize
        mlops-paas.io/plane: workload
        mlops-paas.io/domain: frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        workload-type: worker
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      containers:
        - name: web
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image: mlops-paas-web
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3

apiVersion: v1
kind: ConfigMap
metadata:
  name: mlops-paas-control-plane-config
  labels:
    app.kubernetes.io/name: mlops-paas-control-plane
    app.kubernetes.io/instance: mlops-paas-control-plane
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: workload
    mlops-paas.io/domain: control-plane
data:
  LOG_FORMAT: "console"
  LOG_SUMMARY_INTERVAL_SECONDS: "60"
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: "/app/src"
  DJANGO_SETTINGS_MODULE: "config.settings.production"
  DB_HOST_RW: "postgresql-rw.mlops-paas-data.svc.cluster.local"
  DB_HOST_RO: "postgresql-ro.mlops-paas-data.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "mlops_paas_db"
  DB_SCHEMA: "control_plane"
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "api.mlops-nids-nt114.id.vn,mlops-paas-control-plane,control-plane,localhost,127.0.0.1"
  EXECUTION_BACKEND: "argo"
  TRAINING_ENABLED: "true"
  TRAINING_GPU_ENABLED: "true"
  TRAINING_GPU_COUNTS: "1"
  HARBOR_REGISTRY_URL: "registry.mlops-nids-nt114.id.vn"
  HARBOR_USER_PROJECT: "user-images"
  CORS_ALLOWED_ORIGINS: "https://mlops-nids-nt114.id.vn"
  CSRF_TRUSTED_ORIGINS: "https://mlops-nids-nt114.id.vn"
  TRUSTED_PROXY_COUNT: "1"
  AUTH_COOKIE_SECURE: "true"
  ARGO_BUILD_WEBHOOK_URL: "http://webhook-eventsource-eventsource-svc.argo-events.svc.cluster.local:12000/build"
  ARGO_TRAINING_WEBHOOK_URL: "http://webhook-eventsource-eventsource-svc.argo-events.svc.cluster.local:12000/train"
  ARGO_DEPLOY_WEBHOOK_URL: "http://webhook-eventsource-eventsource-svc.argo-events.svc.cluster.local:12000/deploy"
  ARGO_DRIFT_WEBHOOK_URL: "http://webhook-eventsource-eventsource-svc.argo-events.svc.cluster.local:12000/drift"
  ARGO_RECONCILE_WEBHOOK_URL: "http://webhook-eventsource-eventsource-svc.argo-events.svc.cluster.local:12000/reconcile"
  DRIFT_EXECUTION_WATCH_ENABLED: "true"
  TRAINING_EXECUTION_WATCH_ENABLED: "true"
  EXECUTION_DISPATCH_TIMEOUT_SECONDS: "1800"
  EXECUTION_CHECK_LEASE_SECONDS: "300"
  EXECUTION_OBSERVATION_TOKEN_TTL_SECONDS: "300"
  DRIFT_MAX_RUNTIME_SECONDS: "3600"
  TRAINING_MAX_RUNTIME_SECONDS: "86400"
  TRAINING_CPU_MEDIUM_WEEKLY_SECONDS: "172800"
  TRAINING_CPU_LARGE_WEEKLY_SECONDS: "86400"
  TRAINING_GPU_T4_WEEKLY_SECONDS: "86400"
  TRAINING_GPU_A10G_WEEKLY_SECONDS: "43200"
  AWS_DEFAULT_REGION: "ap-southeast-1"
  AWS_BUCKET_NAME: "mlops-paas-artifacts"
  REDPANDA_BROKERS: "redpanda.mlops-paas-data.svc.cluster.local:9092"
  REDIS_CONNECTION_MODE: "direct"
  REDIS_URL: "redis://redis-cache.mlops-paas-data.svc.cluster.local:6379/0"
  CELERY_CONNECTION_MODE: "sentinel"
  CELERY_SENTINEL_MASTER_NAME: "redis-queue-master"
  CELERY_SENTINEL_HOSTS: "redis-queue-ha-sentinel-0.redis-queue-ha-sentinel-headless.mlops-paas-data.svc.cluster.local:26379,redis-queue-ha-sentinel-1.redis-queue-ha-sentinel-headless.mlops-paas-data.svc.cluster.local:26379,redis-queue-ha-sentinel-2.redis-queue-ha-sentinel-headless.mlops-paas-data.svc.cluster.local:26379"
  CONTROL_PLANE_INTERNAL_URL: "http://mlops-paas-control-plane.mlops-paas-core.svc.cluster.local:8000"
  MODEL_RUNTIME_NAMESPACE: "mlops-paas-serving"
  MODEL_SERVER_PUBLIC_URL: "https://mlops-nids-nt114.id.vn"
  PROMETHEUS_INTERNAL_URL: "http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
  LOKI_URL: "http://loki.mlops-logging.svc.cluster.local:3100"
  ACCOUNT_DELETION_RETENTION_DAYS: "30"
  ACCOUNT_DELETION_PURGE_INTERVAL_SECONDS: "3600"
  ACCOUNT_DELETION_PURGE_BATCH_SIZE: "20"

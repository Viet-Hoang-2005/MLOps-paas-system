apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mlops-paas-control-plane-rules
  labels:
    app.kubernetes.io/name: mlops-paas-control-plane
    app.kubernetes.io/instance: mlops-paas-control-plane
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: workload
    mlops-paas.io/domain: control-plane
    release: monitoring
spec:
  groups:
    - name: paas.control-plane
      rules:
        # Cảnh báo khi Control Plane pod không còn chạy
        - alert: ControlPlanePodsUnavailable
          expr: kube_deployment_status_replicas_available{namespace="mlops-paas-core", deployment="mlops-paas-control-plane"} < 1
          for: 1m
          labels:
            severity: critical
            team: mlops
          annotations:
            summary: "Control Plane Pods unavailable"
            description: "The mlops-paas-control-plane deployment has 0 available replicas!"

        # Cảnh báo khi tỷ lệ lỗi HTTP 5xx của Control Plane vượt 5%
        - alert: ControlPlaneHighErrorRate
          expr: |
            sum(rate(control_plane_api_requests_total{status=~"5.."}[5m])) /
            clamp_min(sum(rate(control_plane_api_requests_total[5m])), 0.001) > 0.05
          for: 2m
          labels:
            severity: critical
            team: mlops
          annotations:
            summary: "Control Plane 5xx error rate > 5%"
            description: "Control plane API is experiencing elevated server errors ({{ $value | humanizePercentage }})."

        # Cảnh báo khi p95 latency của Control Plane vượt 2 giây
        - alert: ControlPlaneHighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(control_plane_api_request_duration_seconds_bucket[5m])) by (le)
            ) > 2.0
          for: 3m
          labels:
            severity: warning
            team: mlops
          annotations:
            summary: "Control Plane p95 latency > 2s"
            description: "Current Control Plane API p95 latency is {{ $value | humanizeDuration }}."

        # Cảnh báo khi Celery Worker pod không còn chạy (ảnh hưởng pipeline training, build, drift)
        - alert: CeleryWorkersUnavailable
          expr: kube_deployment_status_replicas_available{namespace="mlops-paas-core", deployment="mlops-paas-celery-worker"} < 1
          for: 2m
          labels:
            severity: critical
            team: mlops
          annotations:
            summary: "Celery Worker deployment has 0 available replicas"
            description: "Background ML tasks (training, packaging, drift checks) are halted!"

        # Cảnh báo khi tỷ lệ thất bại của Celery task tăng cao
        - alert: CeleryHighTaskFailureRate
          expr: |
            sum(rate(control_plane_celery_tasks_total{status="failure"}[5m])) > 0.1
          for: 3m
          labels:
            severity: warning
            team: mlops
          annotations:
            summary: "High Celery task failure rate"
            description: "Background tasks are failing at {{ $value }} errors/sec."


apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-paas-celery-worker
  labels:
    app.kubernetes.io/name: mlops-paas-celery-worker
    app.kubernetes.io/instance: mlops-paas-celery-worker
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: worker
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: workload
    mlops-paas.io/domain: control-plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mlops-paas-celery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlops-paas-celery-worker
        app.kubernetes.io/instance: mlops-paas-celery-worker
        app.kubernetes.io/part-of: mlops-paas
        app.kubernetes.io/component: worker
        app.kubernetes.io/managed-by: kustomize
        mlops-paas.io/plane: workload
        mlops-paas.io/domain: control-plane
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        workload-type: worker
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mlops-paas-celery-worker
      containers:
        - name: worker
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image: mlops-paas-control-plane
          imagePullPolicy: IfNotPresent
          command: ["celery"]
          args: ["-A", "config", "worker", "-Q", "celery", "--concurrency=2"]
          env:
            - name: TRAINING_SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: mlops-training-secret-key
                  key: TRAINING_SECRET_ENCRYPTION_KEY
                  optional: true
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-celery-worker-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-celery-worker-secret
                  key: DB_PASSWORD
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-celery-worker-secret
                  key: DJANGO_SECRET_KEY
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-celery-worker-secret
                  key: JWT_PRIVATE_KEY
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-celery-worker-secret
                  key: JWT_PUBLIC_KEY
            - name: CONTROL_PLANE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-celery-worker-secret
                  key: CONTROL_PLANE_WEBHOOK_SECRET
            - name: ARGO_EVENTS_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-celery-worker-secret
                  key: ARGO_EVENTS_WEBHOOK_TOKEN
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-celery-worker-secret
                  key: REDIS_PASSWORD
            - name: REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-celery-worker-secret
                  key: REDIS_SENTINEL_PASSWORD
            - name: HARBOR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-celery-worker-secret
                  key: HARBOR_USERNAME
            - name: HARBOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-celery-worker-secret
                  key: HARBOR_PASSWORD
          envFrom:
            - configMapRef:
                name: mlops-paas-control-plane-config
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 40m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 768Mi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'celery -A config inspect ping -d "celery@${HOSTNAME}" --timeout=5'
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'celery -A config inspect ping -d "celery@${HOSTNAME}" --timeout=5'
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-paas-celery-beat
  labels:
    app.kubernetes.io/name: mlops-paas-celery-beat
    app.kubernetes.io/instance: mlops-paas-celery-beat
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: workload
    mlops-paas.io/domain: control-plane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mlops-paas-celery-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlops-paas-celery-beat
        app.kubernetes.io/instance: mlops-paas-celery-beat
        app.kubernetes.io/part-of: mlops-paas
        app.kubernetes.io/component: scheduler
        app.kubernetes.io/managed-by: kustomize
        mlops-paas.io/plane: workload
        mlops-paas.io/domain: control-plane
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        workload-type: worker
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: celery-beat
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image: mlops-paas-control-plane
          imagePullPolicy: IfNotPresent
          command: ["celery"]
          args: ["-A", "config", "beat", "--schedule=/tmp/celerybeat-schedule"]
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: config.settings.health
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-celery-worker-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-celery-worker-secret
                  key: DB_PASSWORD
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-celery-worker-secret
                  key: DJANGO_SECRET_KEY
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-celery-worker-secret
                  key: REDIS_PASSWORD
            - name: REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-celery-worker-secret
                  key: REDIS_SENTINEL_PASSWORD
          envFrom:
            - configMapRef:
                name: mlops-paas-control-plane-config
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: 150m
              memory: 256Mi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "test -s /tmp/celerybeat-schedule && grep -q beat /proc/1/cmdline"
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "test -s /tmp/celerybeat-schedule && grep -q beat /proc/1/cmdline"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mlops-paas-model-server-monitor
  labels:
    app.kubernetes.io/name: mlops-paas-model-server
    app.kubernetes.io/instance: mlops-paas-model-server
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: gateway
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: workload
    mlops-paas.io/domain: serving
    release: monitoring
spec:
  selector:
    matchExpressions:
      # Only the central gateway exposes /metrics.
      - key: app.kubernetes.io/name
        operator: In
        values:
          - mlops-paas-model-server
  namespaceSelector:
    matchNames:
      - mlops-paas-core
  targetLabels:
    - app.kubernetes.io/name
    - app.kubernetes.io/component
    - mlops-paas.io/domain
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s


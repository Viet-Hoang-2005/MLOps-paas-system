apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-mlops-paas-model-server
  labels:
    app.kubernetes.io/name: mlops-paas-model-server
    app.kubernetes.io/instance: mlops-paas-model-server
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: gateway
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: workload
    mlops-paas.io/domain: serving
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mlops-paas-model-server
  policyTypes:
    - Ingress
  ingress:
    # Traefik Ingress chuyển tiếp traffic suy luận (/predict, /feedback)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 5000
    # Control Plane gọi test model (cùng namespace mlops-paas-core)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mlops-paas-control-plane
      ports:
        - protocol: TCP
          port: 5000
    # Prometheus cào metrics
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 5000


apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mlops-paas-model-server-hpa
  labels:
    app.kubernetes.io/name: mlops-paas-model-server
    app.kubernetes.io/instance: mlops-paas-model-server
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: gateway
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: workload
    mlops-paas.io/domain: serving
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mlops-paas-model-server
  minReplicas: 2
  maxReplicas: 5
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: AverageValue
          averageValue: 250m
    - type: Resource
      resource:
        name: memory
        target:
          type: AverageValue
          averageValue: 256Mi


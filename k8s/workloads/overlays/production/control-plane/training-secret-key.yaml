apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlops-training-secret-key-sync
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: mlops-paas-control-plane
    app.kubernetes.io/instance: mlops-paas-control-plane
    app.kubernetes.io/part-of: mlops-paas
    app.kubernetes.io/component: api
    app.kubernetes.io/managed-by: kustomize
    mlops-paas.io/plane: workload
    mlops-paas.io/domain: control-plane
spec:
  refreshInterval: 1h
  secretStoreRef: {name: aws-secrets-manager, kind: ClusterSecretStore}
  target:
    name: mlops-training-secret-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: TRAINING_SECRET_ENCRYPTION_KEY
      remoteRef:
        key: mlops/production-secrets
        property: TRAINING_SECRET_ENCRYPTION_KEY

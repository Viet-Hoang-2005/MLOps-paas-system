global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
  - job_name: model-server
    static_configs:
      - targets: [model-server:5000]
  - job_name: control-plane
    metrics_path: /health/metrics
    static_configs:
      - targets: [control-plane:8000]
